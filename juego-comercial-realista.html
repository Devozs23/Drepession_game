<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camino de Esperanza - Juego Terapéutico Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .loading-bar-container {
            width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #fff, #fbbf24);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Particle Background */
        .bg-particle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hud-stat {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-bar {
            width: 150px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .health-fill { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .energy-fill { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .xp-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        /* Notification System */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            animation: slideInRight 0.5s ease, slideOutRight 0.5s ease 3.5s;
            z-index: 200;
            pointer-events: auto;
            max-width: 400px;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notification-text {
            font-size: 14px;
            opacity: 0.9;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(500px);
                opacity: 0;
            }
        }

        /* Button Styles */
        .game-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .game-button:active {
            transform: translateY(0);
        }

        /* Modal/Dialog */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            z-index: 300;
            min-width: 400px;
            color: white;
            pointer-events: auto;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 250;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-title">🌟 Camino de Esperanza 🌟</div>
            <div class="loading-subtitle">Un viaje de sanación y descubrimiento</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay"></div>

    <script>
        // ============================================
        // GAME ENGINE - PARTE 1: Estructura Base
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Management
        const GameStates = {
            LOADING: 'loading',
            MAIN_MENU: 'main_menu',
            CHARACTER_SELECT: 'character_select',
            PLAYING: 'playing',
            PAUSED: 'paused',
            SHOP: 'shop',
            CUTSCENE: 'cutscene',
            GAME_OVER: 'game_over',
            VICTORY: 'victory'
        };

        // Main Game Object
        const Game = {
            state: GameStates.LOADING,
            currentScene: null,
            deltaTime: 0,
            lastFrameTime: 0,
            paused: false,

            // Save System
            saveData: {
                playerName: '',
                character: 'luna', // luna or sol
                level: 1,
                xp: 0,
                coins: 0,
                currentWorld: 1,
                currentLevel: 1,
                unlockedWorlds: [1],
                unlockedAbilities: [],
                stats: {
                    maxHealth: 100,
                    maxEnergy: 100,
                    strength: 10,
                    defense: 5,
                    speed: 5
                },
                achievements: [],
                playtime: 0,
                completedLevels: []
            },

            // Player State
            player: {
                x: 100,
                y: 500,
                width: 32,
                height: 48,
                velocityX: 0,
                velocityY: 0,
                health: 100,
                energy: 100,
                xp: 0,
                level: 1,
                coins: 0,
                isGrounded: false,
                isFacingRight: true,
                isAttacking: false,
                isDashing: false,
                isInvulnerable: false,
                canDoubleJump: false,
                hasDoubleJumped: false,
                attackCooldown: 0,
                dashCooldown: 0,
                invulnerabilityTime: 0,
                combo: 0,
                comboTimer: 0
            },

            // Input System
            keys: {},
            mouseX: 0,
            mouseY: 0,
            mouseDown: false,

            // Cameras and Effects
            camera: {
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                shake: 0,
                shakeIntensity: 0
            },

            // Particle System
            particles: [],

            // Enemies
            enemies: [],

            // Collectibles
            collectibles: [],

            // NPCs
            npcs: [],

            // Current Level Data
            currentLevelData: null,

            // Audio Context
            audioContext: null,
            sounds: {},

            // Performance
            fps: 60,
            frameCount: 0
        };

        // ============================================
        // SAVE SYSTEM
        // ============================================

        function saveGame() {
            const saveData = {
                ...Game.saveData,
                savedAt: Date.now(),
                playtime: Game.saveData.playtime
            };
            localStorage.setItem('caminoDeEsperanza_save', JSON.stringify(saveData));
            showNotification('💾 Progreso Guardado', 'Tu aventura ha sido guardada exitosamente');
        }

        function loadGame() {
            const saved = localStorage.getItem('caminoDeEsperanza_save');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Game.saveData = { ...Game.saveData, ...data };
                    return true;
                } catch (e) {
                    console.error('Error loading save:', e);
                    return false;
                }
            }
            return false;
        }

        function deleteSave() {
            localStorage.removeItem('caminoDeEsperanza_save');
        }

        // ============================================
        // NOTIFICATION SYSTEM
        // ============================================

        function showNotification(title, text, duration = 4000) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-text">${text}</div>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), duration);
        }

        // ============================================
        // MODAL SYSTEM
        // ============================================

        function showModal(title, content, buttons = []) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-title">${title}</div>
                <div class="modal-content">${content}</div>
                <div class="modal-buttons"></div>
            `;

            const buttonContainer = modal.querySelector('.modal-buttons');
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'game-button';
                button.textContent = btn.text;
                button.onclick = () => {
                    btn.onClick();
                    overlay.remove();
                    modal.remove();
                };
                buttonContainer.appendChild(button);
            });

            document.body.appendChild(overlay);
            document.body.appendChild(modal);
        }

        // ============================================
        // MAIN MENU SCENE
        // ============================================

        const MainMenuScene = {
            particles: [],
            stars: [],
            title: 'Camino de Esperanza',
            subtitle: 'Un Viaje de Sanación Interior',
            menuItems: [
                { text: '🎮 Nueva Aventura', action: 'newGame' },
                { text: '📂 Continuar', action: 'continue' },
                { text: '⚙️ Opciones', action: 'options' },
                { text: '🏆 Logros', action: 'achievements' },
                { text: 'ℹ️ Créditos', action: 'credits' }
            ],
            selectedIndex: 0,
            time: 0,

            init() {
                // Create background stars
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.1,
                        opacity: Math.random()
                    });
                }

                // Create floating particles
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 2,
                        speedX: (Math.random() - 0.5) * 2,
                        speedY: Math.random() * -1 - 0.5,
                        hue: Math.random() * 60 + 200, // Purple/blue hues
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }

                // Check if save exists
                if (loadGame()) {
                    this.menuItems[1].text = '📂 Continuar (Nivel ' + Game.saveData.level + ')';
                } else {
                    this.menuItems[1].disabled = true;
                }
            },

            update(dt) {
                this.time += dt;

                // Update stars
                this.stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * canvas.width;
                    }
                    star.opacity = 0.3 + Math.sin(this.time * 2 + star.x) * 0.3;
                });

                // Update particles
                this.particles.forEach(particle => {
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    if (particle.y < -10) {
                        particle.y = canvas.height + 10;
                        particle.x = Math.random() * canvas.width;
                    }
                    if (particle.x < -10) particle.x = canvas.width + 10;
                    if (particle.x > canvas.width + 10) particle.x = -10;

                    particle.opacity = 0.3 + Math.sin(this.time * 3 + particle.x * 0.01) * 0.2;
                });
            },

            draw() {
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#0f0c29');
                gradient.addColorStop(0.5, '#302b63');
                gradient.addColorStop(1, '#24243e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw stars
                this.stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });

                // Draw particles
                this.particles.forEach(particle => {
                    ctx.save();
                    ctx.globalAlpha = particle.opacity;
                    ctx.fillStyle = `hsl(${particle.hue}, 70%, 60%)`;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Draw title with glow effect
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 30;
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                const titleGradient = ctx.createLinearGradient(0, 100, 0, 180);
                titleGradient.addColorStop(0, '#fff');
                titleGradient.addColorStop(1, '#667eea');
                ctx.fillStyle = titleGradient;
                ctx.fillText(this.title, canvas.width / 2, 150);
                ctx.restore();

                // Draw subtitle
                ctx.font = '24px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.textAlign = 'center';
                ctx.fillText(this.subtitle, canvas.width / 2, 200);

                // Draw menu items
                const startY = 300;
                const spacing = 70;

                this.menuItems.forEach((item, index) => {
                    const y = startY + index * spacing;
                    const isSelected = index === this.selectedIndex;
                    const isDisabled = item.disabled;

                    // Menu item background
                    if (isSelected) {
                        ctx.save();
                        ctx.shadowColor = '#667eea';
                        ctx.shadowBlur = 20;
                        const itemGradient = ctx.createLinearGradient(
                            canvas.width / 2 - 250, y - 25,
                            canvas.width / 2 + 250, y + 25
                        );
                        itemGradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
                        itemGradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.5)');
                        itemGradient.addColorStop(1, 'rgba(102, 126, 234, 0.3)');
                        ctx.fillStyle = itemGradient;
                        ctx.fillRect(canvas.width / 2 - 250, y - 25, 500, 50);
                        ctx.restore();
                    }

                    // Menu item text
                    ctx.font = isSelected ? 'bold 32px Arial' : '28px Arial';
                    ctx.fillStyle = isDisabled ? 'rgba(255, 255, 255, 0.3)' :
                                   isSelected ? '#fff' : 'rgba(255, 255, 255, 0.7)';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.text, canvas.width / 2, y + 10);

                    // Selection indicator
                    if (isSelected && !isDisabled) {
                        const pulseSize = 5 + Math.sin(this.time * 5) * 2;
                        ctx.fillStyle = '#fbbf24';
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 - 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 + 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Draw controls hint
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.textAlign = 'center';
                ctx.fillText('↑↓ Navegar  |  ENTER Seleccionar  |  ESC Salir', canvas.width / 2, canvas.height - 30);
            },

            handleInput(key) {
                if (key === 'ArrowUp') {
                    do {
                        this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'ArrowDown') {
                    do {
                        this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'Enter') {
                    const selected = this.menuItems[this.selectedIndex];
                    if (!selected.disabled) {
                        playSound('menu_select');
                        this.executeAction(selected.action);
                    }
                }
            },

            executeAction(action) {
                switch (action) {
                    case 'newGame':
                        showModal(
                            '🎮 Nueva Aventura',
                            '<p style="text-align: center; font-size: 18px;">¿Estás seguro? Esto borrará tu progreso actual.</p>',
                            [
                                {
                                    text: 'Sí, comenzar',
                                    onClick: () => {
                                        deleteSave();
                                        startCharacterSelect();
                                    }
                                },
                                {
                                    text: 'Cancelar',
                                    onClick: () => {}
                                }
                            ]
                        );
                        break;

                    case 'continue':
                        if (loadGame()) {
                            startGame();
                        }
                        break;

                    case 'options':
                        showModal(
                            '⚙️ Opciones',
                            `
                            <div style="text-align: left; padding: 20px;">
                                <p><strong>Controles:</strong></p>
                                <p>← → : Movimiento</p>
                                <p>ESPACIO: Saltar</p>
                                <p>Z: Atacar</p>
                                <p>X: Habilidad especial</p>
                                <p>C: Dash</p>
                                <p>ESC: Pausar</p>
                            </div>
                            `,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;

                    case 'achievements':
                        const achievementsList = Game.saveData.achievements.length > 0 ?
                            Game.saveData.achievements.map(a => `<p>🏆 ${a}</p>`).join('') :
                            '<p style="text-align: center; opacity: 0.7;">Aún no has desbloqueado logros</p>';

                        showModal(
                            '🏆 Logros',
                            `<div style="max-height: 400px; overflow-y: auto;">${achievementsList}</div>`,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;

                    case 'credits':
                        showModal(
                            'ℹ️ Créditos',
                            `
                            <div style="text-align: center; line-height: 2;">
                                <p><strong>Camino de Esperanza</strong></p>
                                <p>Un juego terapéutico para la sanación emocional</p>
                                <br>
                                <p>Desarrollado con ❤️</p>
                                <p>2024</p>
                            </div>
                            `,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;
                }
            }
        };

        // ============================================
        // AUDIO SYSTEM
        // ============================================

        function initAudio() {
            Game.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!Game.audioContext) initAudio();

            const now = Game.audioContext.currentTime;
            const osc = Game.audioContext.createOscillator();
            const gain = Game.audioContext.createGain();

            osc.connect(gain);
            gain.connect(Game.audioContext.destination);

            switch (type) {
                case 'menu_move':
                    osc.frequency.value = 400;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'menu_select':
                    osc.frequency.value = 600;
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;

                case 'jump':
                    osc.frequency.value = 300;
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'coin':
                    osc.frequency.value = 800;
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'damage':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 200;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;

                case 'attack':
                    osc.type = 'square';
                    osc.frequency.value = 150;
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'hit':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 300;
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'enemy_death':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 400;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;

                case 'levelup':
                    // Triumphant ascending sound
                    const freq1 = 440;
                    const freq2 = 550;
                    const freq3 = 660;

                    [freq1, freq2, freq3].forEach((freq, i) => {
                        const tempOsc = Game.audioContext.createOscillator();
                        const tempGain = Game.audioContext.createGain();
                        tempOsc.connect(tempGain);
                        tempGain.connect(Game.audioContext.destination);

                        tempOsc.frequency.value = freq;
                        tempGain.gain.setValueAtTime(0, now + i * 0.1);
                        tempGain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.05);
                        tempGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);

                        tempOsc.start(now + i * 0.1);
                        tempOsc.stop(now + i * 0.1 + 0.3);
                    });
                    return; // Don't use the main oscillator
            }
        }

                    color: '#667eea',
                    stats: {

                        speed: 75,

            selectedIndex: 0,
            time: 0,
            particles: [],

            init() {
                this.time = 0;
                this.particles = [];

                // Create character particles
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,

                        speedY: (Math.random() - 0.5) * 1,
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }
            },

            update(dt) {
                this.time += dt;

                // Update particles
                this.particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });
            },

            draw() {
                // Background
                const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGradient.addColorStop(0, '#1a1a2e');
                bgGradient.addColorStop(1, '#16213e');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Particles
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.restore();
                });

                // Title
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 20;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                ctx.fillText('Elige tu Héroe', canvas.width / 2, 80);
                ctx.restore();

                // Draw characters
                const charWidth = 400;
                const charHeight = 500;
                const spacing = 100;
                const startX = (canvas.width - (charWidth * 2 + spacing)) / 2;
                const startY = 150;

                this.characters.forEach((char, index) => {
                    const x = startX + index * (charWidth + spacing);
                    const y = startY;
                    const isSelected = index === this.selectedIndex;

                    // Character card background
                    ctx.save();
                    if (isSelected) {
                        ctx.shadowColor = char.color;
                        ctx.shadowBlur = 30;
                        const pulseScale = 1 + Math.sin(this.time * 3) * 0.02;
                        ctx.translate(x + charWidth/2, y + charHeight/2);
                        ctx.scale(pulseScale, pulseScale);
                        ctx.translate(-(x + charWidth/2), -(y + charHeight/2));
                    }

                    // Card gradient
                    const cardGradient = ctx.createLinearGradient(x, y, x, y + charHeight);
                    cardGradient.addColorStop(0, isSelected ? char.color + '40' : 'rgba(255,255,255,0.1)');
                    cardGradient.addColorStop(1, 'rgba(0,0,0,0.2)');
                    ctx.fillStyle = cardGradient;
                    ctx.fillRect(x, y, charWidth, charHeight);

                    // Card border
                    ctx.strokeStyle = isSelected ? char.color : 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = isSelected ? 4 : 2;
                    ctx.strokeRect(x, y, charWidth, charHeight);
                    ctx.restore();

                    // Draw character sprite
                    this.drawCharacter(x + charWidth/2, y + 150, char, isSelected);

                    // Character name
                    ctx.font = 'bold 36px Arial';
                    ctx.fillStyle = isSelected ? char.color : '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(char.name, x + charWidth/2, y + 250);

                    // Character title
                    ctx.font = '20px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillText(char.title, x + charWidth/2, y + 280);

                    // Description
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    const words = char.description.split(' ');
                    let line = '';
                    let lineY = y + 320;
                    words.forEach(word => {
                        const testLine = line + word + ' ';
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > charWidth - 40) {
                            ctx.fillText(line, x + charWidth/2, lineY);
                            line = word + ' ';
                            lineY += 20;
                        } else {
                            line = testLine;
                        }
                    });
                    ctx.fillText(line, x + charWidth/2, lineY);

                    // Stats
                    const statsY = y + 380;
                    const statsList = [
                        { name: '❤️', value: char.stats.health, max: 120 },
                        { name: '⚡', value: char.stats.energy, max: 100 },
                        { name: '🏃', value: char.stats.speed, max: 100 },
                        { name: '💪', value: char.stats.strength, max: 100 }
                    ];

                    statsList.forEach((stat, i) => {
                        const statY = statsY + i * 25;
                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'left';
                        ctx.fillText(stat.name, x + 20, statY);

                        // Stat bar
                        const barX = x + 50;
                        const barWidth = charWidth - 70;
                        const barHeight = 12;

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.fillRect(barX, statY - 10, barWidth, barHeight);

                        const fillWidth = (stat.value / stat.max) * barWidth;
                        const statGradient = ctx.createLinearGradient(barX, 0, barX + fillWidth, 0);
                        statGradient.addColorStop(0, char.color);
                        statGradient.addColorStop(1, char.color + 'aa');
                        ctx.fillStyle = statGradient;
                        ctx.fillRect(barX, statY - 10, fillWidth, barHeight);
                    });

                    // Selection indicator
                    if (isSelected) {
                        const indicatorY = y - 30;
                        const indicatorSize = 8 + Math.sin(this.time * 5) * 3;
                        ctx.fillStyle = char.color;
                        ctx.beginPath();
                        ctx.arc(x + charWidth/2, indicatorY, indicatorSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Instructions
                ctx.font = '18px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.textAlign = 'center';
                ctx.fillText('← → Seleccionar  |  ENTER Confirmar', canvas.width / 2, canvas.height - 30);
            },

            drawCharacter(x, y, char, isSelected) {
                const scale = isSelected ? 1.1 : 1;
                const bounce = Math.sin(this.time * 2) * 5;

                ctx.save();
                ctx.translate(x, y + bounce);
                ctx.scale(scale, scale);

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 35, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = char.color;
                ctx.fillRect(-15, 0, 30, 40);

                // Head
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(0, -10, 18, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (char.id === 'luna') {
                    // Long hair for Luna
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(-8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(0, -15, 15, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Short hair for Sol
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(0, -15, 15, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-6, -8, 2, 0, Math.PI * 2);
                ctx.arc(6, -8, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -5, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms
                ctx.fillStyle = '#FFD1B3';
                ctx.fillRect(-25, 5, 10, 20);
                ctx.fillRect(15, 5, 10, 20);

                // Legs
                ctx.fillStyle = char.color;
                ctx.fillRect(-12, 40, 10, 25);
                ctx.fillRect(2, 40, 10, 25);

                // Shoes
                ctx.fillStyle = '#333';
                ctx.fillRect(-12, 63, 10, 6);
                ctx.fillRect(2, 63, 10, 6);

                ctx.restore();
            },

            handleInput(key) {
                if (key === 'ArrowLeft') {
                    this.selectedIndex = (this.selectedIndex - 1 + this.characters.length) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'ArrowRight') {
                    this.selectedIndex = (this.selectedIndex + 1) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'Enter') {
                    const selected = this.characters[this.selectedIndex];
                    Game.saveData.character = selected.id;
                    Game.saveData.stats.maxHealth = selected.stats.health;
                    Game.saveData.stats.maxEnergy = selected.stats.energy;
                    Game.saveData.stats.speed = selected.stats.speed;
                    Game.saveData.stats.strength = selected.stats.strength;

                    playSound('menu_select');
                    saveGame();
                    showNotification(
                        `¡${selected.name} Seleccionado!`,
                        `Comenzando tu aventura como ${selected.title}`
                    );

                    setTimeout(() => {
                        startGame();
                    }, 1000);
                }

                if (key === 'Escape') {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }
            }
        };

                this.time += dt;

                // Update player physics
                this.updatePlayerPhysics(dt);

                // Update camera to follow player
                this.updateCamera();

                // Update moving platforms
                this.updatePlatforms(dt);

                // Update coins
                this.updateCoins(dt);

                // Update enemies
                this.updateEnemies(dt);

                // Update clouds
                this.clouds.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x > this.worldLength + 200) {
                        cloud.x = -200;
                    }
                });

                // Update stars
                this.stars.forEach(star => {
                    star.opacity = 0.5 + Math.sin(this.time * star.twinkleSpeed) * 0.5;
                });

                // Update message timer
                if (this.messageTimer > 0) {
                    this.messageTimer -= dt;
                    if (this.messageTimer <= 0) {
                        this.currentMessage = null;
                    }
                }

                // Check for checkpoint messages
                this.checkpoints.forEach((checkpoint, index) => {
                    if (Game.player.x > checkpoint && Game.player.x < checkpoint + 50) {
                        if (!this.currentMessage) {
                            this.showRandomMessage();
                        }
                    }
                });

                // Update HUD
                this.updateHUD();

                // Check victory
                if (Game.player.x >= this.worldLength - 100) {
                    this.victory();
                }
            },

            updatePlayerPhysics(dt) {
                const p = Game.player;
                const gravity = 0.8;
                const moveSpeed = 5 * (Game.saveData.stats.speed / 100);
                const jumpForce = -15;

                // Horizontal movement
                if (Game.keys['ArrowLeft'] || Game.keys['a'] || Game.keys['A']) {
                    p.velocityX = -moveSpeed;
                    p.isFacingRight = false;
                } else if (Game.keys['ArrowRight'] || Game.keys['d'] || Game.keys['D']) {
                    p.velocityX = moveSpeed;
                    p.isFacingRight = true;
                } else {
                    p.velocityX *= 0.8; // Friction
                }

                // Apply gravity
                p.velocityY += gravity;

                // Apply velocity
                p.x += p.velocityX;
                p.y += p.velocityY;

                // Check platform collisions
                p.isGrounded = false;
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    if (this.checkCollision(p, platform)) {
                        // Landing on top of platform
                        if (p.velocityY > 0 && p.y + p.height - p.velocityY <= platform.y + 10) {
                            p.y = platform.y - p.height;
                            p.velocityY = 0;
                            p.isGrounded = true;
                            p.canDoubleJump = true;

                            // Break breakable platforms
                            if (platform.type === 'breakable') {
                                setTimeout(() => {
                                    platform.broken = true;
                                }, 500);
                            }

                            // Victory platform
                            if (platform.type === 'victory') {
                                this.victory();
                            }
                        }
                    }
                });

                // Prevent falling below screen
                if (p.y > canvas.height + 100) {
                    p.health -= 20;
                    p.x = 100;
                    p.y = 300;
                    p.velocityX = 0;
                    p.velocityY = 0;
                    playSound('damage');

                    if (p.health <= 0) {
                        this.gameOver();
                    }
                }

                // Energy regeneration
                if (p.energy < Game.saveData.stats.maxEnergy) {
                    p.energy += dt * 5;
                }

                // Decrease cooldowns
                if (p.attackCooldown > 0) p.attackCooldown--;
                if (p.invulnerabilityTime > 0) p.invulnerabilityTime--;
            },

            updateCamera() {
                // Smooth camera follow
                Game.camera.targetX = Game.player.x - canvas.width / 3;
                Game.camera.targetY = Game.player.y - canvas.height / 2;

                Game.camera.x += (Game.camera.targetX - Game.camera.x) * 0.1;
                Game.camera.y += (Game.camera.targetY - Game.camera.y) * 0.1;

                // Clamp camera
                Game.camera.x = Math.max(0, Math.min(Game.camera.x, this.worldLength - canvas.width));
                Game.camera.y = Math.max(0, Math.min(Game.camera.y, 200));

                // Camera shake
                if (Game.camera.shake > 0) {
                    Game.camera.shake -= 0.5;
                    Game.camera.x += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                    Game.camera.y += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                }
            },

            updatePlatforms(dt) {
                this.platforms.forEach(platform => {
                    if (platform.type === 'moving') {
                        platform.y = platform.originalY + Math.sin(this.time * platform.moveSpeed) * platform.moveRange;
                    }
                });
            },

            updateCoins(dt) {
                this.coins.forEach(coin => {
                    if (!coin.collected) {
                        coin.rotation += dt * 3;

                        // Check collision with player
                        const dx = coin.x - (Game.player.x + Game.player.width / 2);
                        const dy = coin.y - (Game.player.y + Game.player.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < coin.radius + 20) {
                            coin.collected = true;
                            Game.player.coins += coin.value;
                            playSound('coin');
                            this.createCoinParticles(coin.x, coin.y);
                        }
                    }
                });
            },

            updateEnemies(dt) {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    // Apply gravity
                    enemy.velocityY += 0.8;

                    // Apply velocity
                    enemy.x += enemy.velocityX;
                    enemy.y += enemy.velocityY;

                    // Check platform collisions
                    enemy.isGrounded = false;
                    this.platforms.forEach(platform => {
                        if (platform.broken) return;

                        if (this.checkCollision(enemy, platform)) {
                            if (enemy.velocityY > 0 && enemy.y + enemy.height - enemy.velocityY <= platform.y + 10) {
                                enemy.y = platform.y - enemy.height;
                                enemy.velocityY = 0;
                                enemy.isGrounded = true;
                            }
                        }
                    });

                    // Patrol behavior
                    if (enemy.isGrounded && enemy.patrolPlatform) {
                        const platform = enemy.patrolPlatform;
                        if (enemy.x < platform.x || enemy.x + enemy.width > platform.x + platform.width) {
                            enemy.velocityX *= -1;
                        }
                    }

                    // Check collision with player
                    if (this.checkCollision(Game.player, enemy)) {
                        if (enemy.hitCooldown <= 0) {
                            // Player takes damage
                            Game.player.health -= enemy.damage;
                            Game.player.invulnerabilityTime = 60;
                            enemy.hitCooldown = 60;
                            playSound('damage');

                            // Knockback
                            const knockbackDir = Game.player.x < enemy.x ? -1 : 1;
                            Game.player.velocityX = knockbackDir * 8;
                            Game.player.velocityY = -8;

                            Game.camera.shake = 10;
                            Game.camera.shakeIntensity = 8;

                            if (Game.player.health <= 0) {
                                this.gameOver();
                            }
                        }
                    }

                    // Decrease cooldowns
                    if (enemy.hitCooldown > 0) enemy.hitCooldown--;
                });
            },

            checkCollision(player, platform) {
                return player.x < platform.x + platform.width &&
                       player.x + player.width > platform.x &&
                       player.y < platform.y + platform.height &&
                       player.y + player.height > platform.y;
            },

            createCoinParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    Game.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 1,
                        color: '#fbbf24',
                        size: Math.random() * 4 + 2
                    });
                }
            },

            handleJump() {
                const p = Game.player;
                const jumpForce = -15;

                if (p.isGrounded && p.energy >= 10) {
                    p.velocityY = jumpForce;
                    p.energy -= 10;
                    p.isGrounded = false;
                    playSound('jump');
                } else if (p.canDoubleJump && !p.isGrounded && p.energy >= 15) {
                    p.velocityY = jumpForce;
                    p.energy -= 15;
                    p.canDoubleJump = false;
                    playSound('jump');
                }
            },

            handleAttack() {
                const p = Game.player;

                if (p.attackCooldown > 0 || p.energy < 15) return;

                p.isAttacking = true;
                p.attackCooldown = 30;
                p.energy -= 15;

                playSound('attack');

                // Create attack hitbox
                const attackRange = 50;
                const attackX = p.isFacingRight ? p.x + p.width : p.x - attackRange;
                const attackY = p.y;
                const attackWidth = attackRange;
                const attackHeight = p.height;

                // Attack particles
                for (let i = 0; i < 10; i++) {
                    Game.particles.push({
                        x: attackX + attackWidth / 2,
                        y: attackY + attackHeight / 2,
                        vx: (p.isFacingRight ? 5 : -5) + (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 5,
                        life: 0.5,
                        color: p.color,
                        size: Math.random() * 4 + 2
                    });
                }

                // Check enemy hits
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    const hitbox = {
                        x: attackX,
                        y: attackY,
                        width: attackWidth,
                        height: attackHeight
                    };

                    if (this.checkCollision(hitbox, enemy)) {
                        // Deal damage
                        const damage = Game.saveData.stats.strength;
                        enemy.health -= damage;

                        // Knockback
                        const knockbackDir = p.isFacingRight ? 1 : -1;
                        enemy.velocityX = knockbackDir * 10;
                        enemy.velocityY = -5;

                        // Hit effect
                        for (let i = 0; i < 15; i++) {
                            Game.particles.push({
                                x: enemy.x + enemy.width / 2,
                                y: enemy.y + enemy.height / 2,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 0.8,
                                color: enemy.color,
                                size: Math.random() * 5 + 2
                            });
                        }

                        playSound('hit');

                        // Check if enemy died
                        if (enemy.health <= 0) {
                            enemy.isDead = true;
                            this.gainXP(enemy.xp);

                            // Death explosion
                            for (let i = 0; i < 30; i++) {
                                Game.particles.push({
                                    x: enemy.x + enemy.width / 2,
                                    y: enemy.y + enemy.height / 2,
                                    vx: (Math.random() - 0.5) * 12,
                                    vy: (Math.random() - 0.5) * 12,
                                    life: 1,
                                    color: enemy.color,
                                    size: Math.random() * 6 + 3
                                });
                            }

                            playSound('enemy_death');
                            showNotification(
                                `💫 ${enemy.name} derrotado!`,
                                `+${enemy.xp} XP`
                            );
                        }
                    }
                });

                setTimeout(() => {
                    p.isAttacking = false;
                }, 200);
            },

            draw() {
                // Draw parallax background
                this.drawParallax();

                // Draw stars
                this.drawStars();

                // Draw clouds
                this.drawClouds();

                // Draw platforms
                this.drawPlatforms();

                // Draw coins
                this.drawCoins();

                // Draw enemies
                this.drawEnemies();

                // Draw player
                this.drawPlayer();

                // Draw particles
                this.drawParticles();

                // Draw motivational message
                this.drawMessage();
            },

            drawParallax() {
                // Sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                const progress = Game.player.x / this.worldLength;

                // Change colors based on progress (dark to sunset)
                if (progress < 0.5) {
                    skyGradient.addColorStop(0, '#0f0c29');
                    skyGradient.addColorStop(1, '#302b63');
                } else {
                    const t = (progress - 0.5) * 2;
                    const r1 = Math.floor(15 + (255 - 15) * t);
                    const g1 = Math.floor(12 + (107 - 12) * t);
                    const b1 = Math.floor(41 + (133 - 41) * t);
                    skyGradient.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`);
                    skyGradient.addColorStop(1, '#ff6b9d');
                }

                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw mountains (parallax)
                const layer = this.parallaxLayers[1];
                const offsetX = Game.camera.x * layer.speed;

                ctx.fillStyle = layer.color;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);

                for (let i = 0; i < layer.heights.length; i++) {
                    const x = (i * 100) - offsetX;
                    const y = layer.y - layer.heights[i];
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            },

            drawStars() {
                this.stars.forEach(star => {
                    const screenX = star.x - Game.camera.x * 0.1;
                    const screenY = star.y;

                    ctx.save();
                    ctx.globalAlpha = star.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(screenX, screenY, star.size, star.size);
                    ctx.restore();
                });
            },

            drawClouds() {
                this.clouds.forEach(cloud => {
                    const screenX = cloud.x - Game.camera.x * 0.5;
                    const screenY = cloud.y;

                    ctx.save();
                    ctx.globalAlpha = cloud.opacity;
                    ctx.fillStyle = '#fff';

                    // Draw cloud shape
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width / 3, screenY - cloud.height / 4, cloud.height / 1.5, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width * 2/3, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            },

            drawPlatforms() {
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    const screenX = platform.x - Game.camera.x;
                    const screenY = platform.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + platform.width < 0 || screenX > canvas.width) return;

                    // Platform shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(screenX + 5, screenY + 5, platform.width, platform.height);

                    // Platform
                    ctx.fillStyle = platform.color;
                    ctx.fillRect(screenX, screenY, platform.width, platform.height);

                    // Platform border
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, screenY, platform.width, platform.height);

                    // Victory platform glow
                    if (platform.type === 'victory') {
                        ctx.save();
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        ctx.restore();
                    }
                });
            },

            drawCoins() {
                this.coins.forEach(coin => {
                    if (coin.collected) return;

                    const screenX = coin.x - Game.camera.x;
                    const screenY = coin.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.rotate(coin.rotation);

                    // Coin glow
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 10;

                    // Coin
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Coin center
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius - 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            },

            drawEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    const screenX = enemy.x - Game.camera.x;
                    const screenY = enemy.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + enemy.width < 0 || screenX > canvas.width) return;

                    ctx.save();

                    // Glow effect
                    ctx.shadowColor = enemy.color;
                    ctx.shadowBlur = 15;

                    // Enemy body (shadowy form)
                    ctx.fillStyle = enemy.color;
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2, screenY + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes (menacing)
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#fff';
                    const eyeY = screenY + enemy.height / 2 - 5;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 4, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // Health bar
                    if (enemy.health < enemy.maxHealth) {
                        const barWidth = enemy.width;
                        const barHeight = 4;
                        const barX = screenX;
                        const barY = screenY - 10;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillRect(barX, barY, barWidth, barHeight);

                        ctx.fillStyle = '#ef4444';
                        const healthWidth = (enemy.health / enemy.maxHealth) * barWidth;
                        ctx.fillRect(barX, barY, healthWidth, barHeight);
                    }

                    // Name label
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 4;
                    ctx.fillText(enemy.name, screenX + enemy.width / 2, screenY - 15);
                    ctx.shadowBlur = 0;
                });
            },

            drawPlayer() {
                const p = Game.player;
                const screenX = p.x - Game.camera.x;
                const screenY = p.y - Game.camera.y;

                ctx.save();

                // Flip if facing left
                if (!p.isFacingRight) {
                    ctx.translate(screenX + p.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.translate(-(screenX + p.width), -screenY);
                }

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(screenX + p.width/2, screenY + p.height + 2, p.width/2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = p.color;
                ctx.fillRect(screenX + 8, screenY + 20, p.width - 16, 22);

                // Head
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2, screenY + 12, 12, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (Game.saveData.character === 'luna') {
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2 - 6, screenY + 8, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2 + 6, screenY + 8, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2, screenY + 4, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2, screenY + 4, 12, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2 - 4, screenY + 10, 2, 0, Math.PI * 2);
                ctx.arc(screenX + p.width/2 + 4, screenY + 10, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(screenX + p.width/2, screenY + 12, 5, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms
                ctx.fillStyle = '#FFD1B3';
                ctx.fillRect(screenX + 2, screenY + 22, 6, 15);
                ctx.fillRect(screenX + p.width - 8, screenY + 22, 6, 15);

                // Legs
                ctx.fillStyle = p.color;
                const legOffset = Math.abs(p.velocityX) > 0.1 ? Math.sin(this.time * 10) * 3 : 0;
                ctx.fillRect(screenX + 10, screenY + 42 + legOffset, 6, 18);
                ctx.fillRect(screenX + p.width - 16, screenY + 42 - legOffset, 6, 18);

                // Shoes
                ctx.fillStyle = '#333';
                ctx.fillRect(screenX + 10, screenY + 58, 6, 4);
                ctx.fillRect(screenX + p.width - 16, screenY + 58, 6, 4);

                ctx.restore();
            },

            drawParticles() {
                Game.particles = Game.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;

                    if (p.life <= 0) return false;

                    const screenX = p.x - Game.camera.x;
                    const screenY = p.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    return true;
                });
            },

            drawMessage() {
                if (!this.currentMessage) return;

                const alpha = this.messageTimer > 0.5 ? 1 : this.messageTimer * 2;

                ctx.save();
                ctx.globalAlpha = alpha;

                // Message background
                const msgWidth = 400;
                const msgHeight = 60;
                const msgX = canvas.width - msgWidth - 20;
                const msgY = 100;

                ctx.fillStyle = 'rgba(102, 126, 234, 0.9)';
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 20;
                ctx.fillRect(msgX, msgY, msgWidth, msgHeight);

                // Message text
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.currentMessage, msgX + msgWidth/2, msgY + msgHeight/2 + 7);

                ctx.restore();
            },

            victory() {
                Game.state = GameStates.VICTORY;
                saveGame();
                showNotification('🎉 ¡Victoria!', '¡Has completado tu viaje de esperanza!');

                // Show victory screen (will implement in next part)
                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            },

            gameOver() {
                Game.state = GameStates.GAME_OVER;
                showNotification('💔 Fin del Juego', 'No te rindas, inténtalo de nuevo');

                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            }
        };

        function startGame() {
            Game.state = GameStates.PLAYING;
            GameScene.init();
        }

        // ============================================
        // INPUT HANDLING
        // ============================================

        document.addEventListener('keydown', (e) => {
            Game.keys[e.key] = true;

            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.handleInput(e.key);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.handleInput(e.key);
            } else if (Game.state === GameStates.PLAYING) {
                // Jump
                if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    GameScene.handleJump();
                }

                // Attack
                if (e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    GameScene.handleAttack();
                }

                // Pause
                if (e.key === 'Escape') {
                    Game.state = GameStates.PAUSED;
                    showNotification('⏸️ Pausado', 'Presiona ESC para continuar');
                }
            } else if (Game.state === GameStates.PAUSED) {
                if (e.key === 'Escape') {
                    Game.state = GameStates.PLAYING;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            Game.keys[e.key] = false;
        });

        // ============================================
        // GAME LOOP
        // ============================================

        function gameLoop(timestamp) {
            // Calculate delta time
            if (!Game.lastFrameTime) Game.lastFrameTime = timestamp;
            Game.deltaTime = (timestamp - Game.lastFrameTime) / 1000;
            Game.lastFrameTime = timestamp;

            // Update
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.update(Game.deltaTime);
            }

            // Draw
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.draw();
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.draw();
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.draw();
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            // Simulate loading
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);

                    // Hide loading screen
                    setTimeout(() => {
                        document.getElementById('loadingScreen').classList.add('hidden');

                        // Initialize main menu
                        Game.state = GameStates.MAIN_MENU;
                        MainMenuScene.init();

                        // Start game loop
                        requestAnimationFrame(gameLoop);

                        showNotification(
                            '🌟 Bienvenido',
                            'Tu viaje de esperanza está a punto de comenzar'
                        );
                    }, 500);
                }
                document.getElementById('loadingBar').style.width = progress + '%';
            }, 100);
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
