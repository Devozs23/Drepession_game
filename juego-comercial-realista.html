<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camino de Esperanza - Juego Terapéutico Profesional</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .loading-bar-container {
            width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #fff, #fbbf24);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Particle Background */
        .bg-particle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hud-stat {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-bar {
            width: 150px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .health-fill { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .energy-fill { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .xp-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        /* Notification System */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            animation: slideInRight 0.5s ease, slideOutRight 0.5s ease 3.5s;
            z-index: 200;
            pointer-events: auto;
            max-width: 400px;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notification-text {
            font-size: 14px;
            opacity: 0.9;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(500px);
                opacity: 0;
            }
        }

        /* Button Styles */
        .game-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .game-button:active {
            transform: translateY(0);
        }

        /* Modal/Dialog */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            z-index: 300;
            min-width: 400px;
            color: white;
            pointer-events: auto;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 250;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loadingScreen">
        <div class="loading-content">
            <div class="loading-title">🌟 Camino de Esperanza 🌟</div>
            <div class="loading-subtitle">Un viaje de sanación y descubrimiento</div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- UI Overlay -->
    <div id="ui-overlay"></div>

    <script>
        // ============================================
        // GAME ENGINE - PARTE 1: Estructura Base
        // ============================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State Management
        const GameStates = {
            LOADING: 'loading',
            MAIN_MENU: 'main_menu',
            CHARACTER_SELECT: 'character_select',
            PLAYING: 'playing',
            PAUSED: 'paused',
            SHOP: 'shop',
            CUTSCENE: 'cutscene',
            GAME_OVER: 'game_over',
            VICTORY: 'victory'
        };

        // Main Game Object
        const Game = {
            state: GameStates.LOADING,
            currentScene: null,
            deltaTime: 0,
            lastFrameTime: 0,
            paused: false,

            // Save System
            saveData: {
                playerName: '',
                character: 'luna', // luna or sol
                level: 1,
                xp: 0,
                coins: 0,
                currentWorld: 1,
                currentLevel: 1,
                unlockedWorlds: [1],
                unlockedAbilities: [],
                stats: {
                    maxHealth: 100,
                    maxEnergy: 100,
                    strength: 10,
                    defense: 5,
                    speed: 5
                },
                achievements: [],
                playtime: 0,
                completedLevels: []
            },

            // Player State
            player: {
                x: 100,
                y: 500,
                width: 32,
                height: 48,
                velocityX: 0,
                velocityY: 0,
                health: 100,
                energy: 100,
                xp: 0,
                level: 1,
                coins: 0,
                isGrounded: false,
                isFacingRight: true,
                isAttacking: false,
                isDashing: false,
                isInvulnerable: false,
                canDoubleJump: false,
                hasDoubleJumped: false,
                attackCooldown: 0,
                dashCooldown: 0,
                invulnerabilityTime: 0,
                combo: 0,
                comboTimer: 0,
                // Special ability system
                specialAbilityCooldown: 0,
                isUsingSpecial: false,
                // Power-ups
                activeBuffs: [],
                // Trail effect
                trail: [],
                // Achievements tracking
                stats: {
                    enemiesDefeated: 0,
                    damageDealt: 0,
                    damageTaken: 0,
                    coinsCollected: 0,
                    jumps: 0,
                    specialAbilitiesUsed: 0,
                    maxCombo: 0
                }
            },

            // Input System
            keys: {},
            mouseX: 0,
            mouseY: 0,
            mouseDown: false,

            // Cameras and Effects
            camera: {
                x: 0,
                y: 0,
                targetX: 0,
                targetY: 0,
                shake: 0,
                shakeIntensity: 0
            },

            // Particle System
            particles: [],

            // Enemies
            enemies: [],

            // Collectibles
            collectibles: [],

            // NPCs
            npcs: [],

            // Power-ups
            powerups: [],

            // Current Level Data
            currentLevelData: null,

            // Audio Context
            audioContext: null,
            sounds: {},

            // Performance
            fps: 60,
            frameCount: 0
        };

        // ============================================
        // SAVE SYSTEM
        // ============================================

        function saveGame() {
            const saveData = {
                ...Game.saveData,
                savedAt: Date.now(),
                playtime: Game.saveData.playtime
            };
            localStorage.setItem('caminoDeEsperanza_save', JSON.stringify(saveData));
            showNotification('💾 Progreso Guardado', 'Tu aventura ha sido guardada exitosamente');
        }

        function loadGame() {
            const saved = localStorage.getItem('caminoDeEsperanza_save');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Game.saveData = { ...Game.saveData, ...data };
                    return true;
                } catch (e) {
                    console.error('Error loading save:', e);
                    return false;
                }
            }
            return false;
        }

        function deleteSave() {
            localStorage.removeItem('caminoDeEsperanza_save');
        }

        // ============================================
        // NOTIFICATION SYSTEM
        // ============================================

        function showNotification(title, text, duration = 4000) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-text">${text}</div>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), duration);
        }

        // ============================================
        // MODAL SYSTEM
        // ============================================

        function showModal(title, content, buttons = []) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-title">${title}</div>
                <div class="modal-content">${content}</div>
                <div class="modal-buttons"></div>
            `;

            const buttonContainer = modal.querySelector('.modal-buttons');
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'game-button';
                button.textContent = btn.text;
                button.onclick = () => {
                    btn.onClick();
                    overlay.remove();
                    modal.remove();
                };
                buttonContainer.appendChild(button);
            });

            document.body.appendChild(overlay);
            document.body.appendChild(modal);
        }

        // ============================================
        // MAIN MENU SCENE
        // ============================================

        const MainMenuScene = {
            particles: [],
            stars: [],
            title: 'Camino de Esperanza',
            subtitle: 'Un Viaje de Sanación Interior',
            menuItems: [
                { text: '🎮 Nueva Aventura', action: 'newGame' },
                { text: '📂 Continuar', action: 'continue' },
                { text: '⚙️ Opciones', action: 'options' },
                { text: '🏆 Logros', action: 'achievements' },
                { text: 'ℹ️ Créditos', action: 'credits' }
            ],
            selectedIndex: 0,
            time: 0,

            init() {
                // Create background stars
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.1,
                        opacity: Math.random()
                    });
                }

                // Create floating particles
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 2,
                        speedX: (Math.random() - 0.5) * 2,
                        speedY: Math.random() * -1 - 0.5,
                        hue: Math.random() * 60 + 200, // Purple/blue hues
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }

                // Check if save exists
                if (loadGame()) {
                    this.menuItems[1].text = '📂 Continuar (Nivel ' + Game.saveData.level + ')';
                } else {
                    this.menuItems[1].disabled = true;
                }
            },

            update(dt) {
                this.time += dt;

                // Update stars
                this.stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * canvas.width;
                    }
                    star.opacity = 0.3 + Math.sin(this.time * 2 + star.x) * 0.3;
                });

                // Update particles
                this.particles.forEach(particle => {
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    if (particle.y < -10) {
                        particle.y = canvas.height + 10;
                        particle.x = Math.random() * canvas.width;
                    }
                    if (particle.x < -10) particle.x = canvas.width + 10;
                    if (particle.x > canvas.width + 10) particle.x = -10;

                    particle.opacity = 0.3 + Math.sin(this.time * 3 + particle.x * 0.01) * 0.2;
                });
            },

            draw() {
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#0f0c29');
                gradient.addColorStop(0.5, '#302b63');
                gradient.addColorStop(1, '#24243e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw stars
                this.stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });

                // Draw particles
                this.particles.forEach(particle => {
                    ctx.save();
                    ctx.globalAlpha = particle.opacity;
                    ctx.fillStyle = `hsl(${particle.hue}, 70%, 60%)`;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Draw title with glow effect
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 30;
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                const titleGradient = ctx.createLinearGradient(0, 100, 0, 180);
                titleGradient.addColorStop(0, '#fff');
                titleGradient.addColorStop(1, '#667eea');
                ctx.fillStyle = titleGradient;
                ctx.fillText(this.title, canvas.width / 2, 150);
                ctx.restore();

                // Draw subtitle
                ctx.font = '24px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.textAlign = 'center';
                ctx.fillText(this.subtitle, canvas.width / 2, 200);

                // Draw menu items
                const startY = 300;
                const spacing = 70;

                this.menuItems.forEach((item, index) => {
                    const y = startY + index * spacing;
                    const isSelected = index === this.selectedIndex;
                    const isDisabled = item.disabled;

                    // Menu item background
                    if (isSelected) {
                        ctx.save();
                        ctx.shadowColor = '#667eea';
                        ctx.shadowBlur = 20;
                        const itemGradient = ctx.createLinearGradient(
                            canvas.width / 2 - 250, y - 25,
                            canvas.width / 2 + 250, y + 25
                        );
                        itemGradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
                        itemGradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.5)');
                        itemGradient.addColorStop(1, 'rgba(102, 126, 234, 0.3)');
                        ctx.fillStyle = itemGradient;
                        ctx.fillRect(canvas.width / 2 - 250, y - 25, 500, 50);
                        ctx.restore();
                    }

                    // Menu item text
                    ctx.font = isSelected ? 'bold 32px Arial' : '28px Arial';
                    ctx.fillStyle = isDisabled ? 'rgba(255, 255, 255, 0.3)' :
                                   isSelected ? '#fff' : 'rgba(255, 255, 255, 0.7)';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.text, canvas.width / 2, y + 10);

                    // Selection indicator
                    if (isSelected && !isDisabled) {
                        const pulseSize = 5 + Math.sin(this.time * 5) * 2;
                        ctx.fillStyle = '#fbbf24';
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 - 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 + 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Draw controls hint
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.textAlign = 'center';
                ctx.fillText('↑↓ Navegar  |  ENTER Seleccionar  |  ESC Salir', canvas.width / 2, canvas.height - 30);
            },

            handleInput(key) {
                if (key === 'ArrowUp') {
                    do {
                        this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'ArrowDown') {
                    do {
                        this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'Enter') {
                    const selected = this.menuItems[this.selectedIndex];
                    if (!selected.disabled) {
                        playSound('menu_select');
                        this.executeAction(selected.action);
                    }
                }
            },

            executeAction(action) {
                switch (action) {
                    case 'newGame':
                        // Si hay un juego guardado, mostrar confirmación
                        if (loadGame()) {
                            showModal(
                                '🎮 Nueva Aventura',
                                '<p style="text-align: center; font-size: 18px;">¿Estás seguro? Esto borrará tu progreso actual.</p>',
                                [
                                    {
                                        text: 'Sí, comenzar',
                                        onClick: () => {
                                            deleteSave();
                                            startCharacterSelect();
                                        }
                                    },
                                    {
                                        text: 'Cancelar',
                                        onClick: () => {}
                                    }
                                ]
                            );
                        } else {
                            // No hay juego guardado, ir directo a selección
                            deleteSave();
                            startCharacterSelect();
                        }
                        break;

                    case 'continue':
                        if (loadGame()) {
                            startGame();
                        }
                        break;

                    case 'options':
                        showModal(
                            '⚙️ Opciones',
                            `
                            <div style="text-align: left; padding: 20px;">
                                <p><strong>Controles:</strong></p>
                                <p>← → : Movimiento</p>
                                <p>ESPACIO: Saltar</p>
                                <p>Z: Atacar</p>
                                <p>X: Habilidad especial</p>
                                <p>C: Dash</p>
                                <p>ESC: Pausar</p>
                            </div>
                            `,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;

                    case 'achievements':
                        const achievementsList = Game.saveData.achievements.length > 0 ?
                            Game.saveData.achievements.map(a => `<p>🏆 ${a}</p>`).join('') :
                            '<p style="text-align: center; opacity: 0.7;">Aún no has desbloqueado logros</p>';

                        showModal(
                            '🏆 Logros',
                            `<div style="max-height: 400px; overflow-y: auto;">${achievementsList}</div>`,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;

                    case 'credits':
                        showModal(
                            'ℹ️ Créditos',
                            `
                            <div style="text-align: center; line-height: 2;">
                                <p><strong>Camino de Esperanza</strong></p>
                                <p>Un juego terapéutico para la sanación emocional</p>
                                <br>
                                <p>Desarrollado con ❤️</p>
                                <p>2024</p>
                            </div>
                            `,
                            [{ text: 'Cerrar', onClick: () => {} }]
                        );
                        break;
                }
            }
        };

        // ============================================
        // AUDIO SYSTEM
        // ============================================

        function initAudio() {
            Game.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!Game.audioContext) initAudio();

            const now = Game.audioContext.currentTime;
            const osc = Game.audioContext.createOscillator();
            const gain = Game.audioContext.createGain();

            osc.connect(gain);
            gain.connect(Game.audioContext.destination);

            switch (type) {
                case 'menu_move':
                    osc.frequency.value = 400;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'menu_select':
                    osc.frequency.value = 600;
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;

                case 'jump':
                    osc.frequency.value = 300;
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'coin':
                    osc.frequency.value = 800;
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'damage':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 200;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;

                case 'attack':
                    osc.type = 'square';
                    osc.frequency.value = 150;
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'hit':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 300;
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'enemy_death':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 400;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;

                case 'levelup':
                    // Triumphant ascending sound
                    const freq1 = 440;
                    const freq2 = 550;
                    const freq3 = 660;

                    [freq1, freq2, freq3].forEach((freq, i) => {
                        const tempOsc = Game.audioContext.createOscillator();
                        const tempGain = Game.audioContext.createGain();
                        tempOsc.connect(tempGain);
                        tempGain.connect(Game.audioContext.destination);

                        tempOsc.frequency.value = freq;
                        tempGain.gain.setValueAtTime(0, now + i * 0.1);
                        tempGain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.05);
                        tempGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);

                        tempOsc.start(now + i * 0.1);
                        tempOsc.stop(now + i * 0.1 + 0.3);
                    });
                    return; // Don't use the main oscillator
            }
        }

            selectedIndex: 0,
            time: 0,

            init() {
                this.time = 0;
                this.particles = [];

                // Create character particles
                for (let i = 0; i < 100; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 3 + 1,
                        speedX: (Math.random() - 0.5) * 1,
                        speedY: (Math.random() - 0.5) * 1,
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }
            },

            update(dt) {
                this.time += dt;

                // Update particles
                this.particles.forEach(p => {
                    p.x += p.speedX;
                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;
                });
            },

            draw() {
                // Background
                const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                bgGradient.addColorStop(0, '#1a1a2e');
                bgGradient.addColorStop(1, '#16213e');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Particles
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.restore();
                });

                // Title
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 20;
                ctx.font = 'bold 48px Arial';
                ctx.textAlign = 'center';
                ctx.fillStyle = '#fff';
                ctx.fillText('Elige tu Héroe', canvas.width / 2, 80);
                ctx.restore();

                // Draw characters
                const charWidth = 400;
                const charHeight = 500;
                const spacing = 100;
                const startX = (canvas.width - (charWidth * 2 + spacing)) / 2;
                const startY = 150;

                this.characters.forEach((char, index) => {
                    const x = startX + index * (charWidth + spacing);
                    const y = startY;
                    const isSelected = index === this.selectedIndex;

                    // Character card background
                    ctx.save();
                    if (isSelected) {
                        ctx.shadowColor = char.color;
                        ctx.shadowBlur = 30;
                        const pulseScale = 1 + Math.sin(this.time * 3) * 0.02;
                        ctx.translate(x + charWidth/2, y + charHeight/2);
                        ctx.scale(pulseScale, pulseScale);
                        ctx.translate(-(x + charWidth/2), -(y + charHeight/2));
                    }

                    // Card gradient
                    const cardGradient = ctx.createLinearGradient(x, y, x, y + charHeight);
                    cardGradient.addColorStop(0, isSelected ? char.color + '40' : 'rgba(255,255,255,0.1)');
                    cardGradient.addColorStop(1, 'rgba(0,0,0,0.2)');
                    ctx.fillStyle = cardGradient;
                    ctx.fillRect(x, y, charWidth, charHeight);

                    // Card border
                    ctx.strokeStyle = isSelected ? char.color : 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = isSelected ? 4 : 2;
                    ctx.strokeRect(x, y, charWidth, charHeight);
                    ctx.restore();

                    // Draw character sprite
                    this.drawCharacter(x + charWidth/2, y + 150, char, isSelected);

                    // Character name
                    ctx.font = 'bold 36px Arial';
                    ctx.fillStyle = isSelected ? char.color : '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(char.name, x + charWidth/2, y + 250);

                    // Character title
                    ctx.font = '20px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillText(char.title, x + charWidth/2, y + 280);

                    // Description
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    const words = char.description.split(' ');
                    let line = '';
                    let lineY = y + 320;
                    words.forEach(word => {
                        const testLine = line + word + ' ';
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > charWidth - 40) {
                            ctx.fillText(line, x + charWidth/2, lineY);
                            line = word + ' ';
                            lineY += 20;
                        } else {
                            line = testLine;
                        }
                    });
                    ctx.fillText(line, x + charWidth/2, lineY);

                    // Stats
                    const statsY = y + 380;
                    const statsList = [
                        { name: '❤️', value: char.stats.health, max: 120 },
                        { name: '⚡', value: char.stats.energy, max: 100 },
                        { name: '🏃', value: char.stats.speed, max: 100 },
                        { name: '💪', value: char.stats.strength, max: 100 }
                    ];

                    statsList.forEach((stat, i) => {
                        const statY = statsY + i * 25;
                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'left';
                        ctx.fillText(stat.name, x + 20, statY);

                        // Stat bar
                        const barX = x + 50;
                        const barWidth = charWidth - 70;
                        const barHeight = 12;

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.fillRect(barX, statY - 10, barWidth, barHeight);

                        const fillWidth = (stat.value / stat.max) * barWidth;
                        const statGradient = ctx.createLinearGradient(barX, 0, barX + fillWidth, 0);
                        statGradient.addColorStop(0, char.color);
                        statGradient.addColorStop(1, char.color + 'aa');
                        ctx.fillStyle = statGradient;
                        ctx.fillRect(barX, statY - 10, fillWidth, barHeight);
                    });

                    // Selection indicator
                    if (isSelected) {
                        const indicatorY = y - 30;
                        const indicatorSize = 8 + Math.sin(this.time * 5) * 3;
                        ctx.fillStyle = char.color;
                        ctx.beginPath();
                        ctx.arc(x + charWidth/2, indicatorY, indicatorSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Instructions (más prominentes)
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 10;
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#fbbf24';
                ctx.textAlign = 'center';
                ctx.fillText('← → Seleccionar  |  ENTER o CLICK para Confirmar', canvas.width / 2, canvas.height - 40);
                ctx.restore();

                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillText('ESC para volver al menú', canvas.width / 2, canvas.height - 15);
            },

            drawCharacter(x, y, char, isSelected) {
                const scale = isSelected ? 1.1 : 1;
                const bounce = Math.sin(this.time * 2) * 5;

                ctx.save();
                ctx.translate(x, y + bounce);
                ctx.scale(scale, scale);

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 35, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = char.color;
                ctx.fillRect(-15, 0, 30, 40);

                // Head
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(0, -10, 18, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (char.id === 'luna') {
                    // Long hair for Luna
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(-8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(0, -15, 15, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Short hair for Sol
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(0, -15, 15, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-6, -8, 2, 0, Math.PI * 2);
                ctx.arc(6, -8, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -5, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms
                ctx.fillStyle = '#FFD1B3';
                ctx.fillRect(-25, 5, 10, 20);
                ctx.fillRect(15, 5, 10, 20);

                // Legs
                ctx.fillStyle = char.color;
                ctx.fillRect(-12, 40, 10, 25);
                ctx.fillRect(2, 40, 10, 25);

                // Shoes
                ctx.fillStyle = '#333';
                ctx.fillRect(-12, 63, 10, 6);
                ctx.fillRect(2, 63, 10, 6);

                ctx.restore();
            },

            handleInput(key) {
                if (key === 'ArrowLeft') {
                    this.selectedIndex = (this.selectedIndex - 1 + this.characters.length) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'ArrowRight') {
                    this.selectedIndex = (this.selectedIndex + 1) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'Enter' || key === ' ') {
                    this.selectCharacter();
                }

                if (key === 'Escape') {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }
            },

            selectCharacter() {
                const selected = this.characters[this.selectedIndex];
                Game.saveData.character = selected.id;
                Game.saveData.stats.maxHealth = selected.stats.health;
                Game.saveData.stats.maxEnergy = selected.stats.energy;
                Game.saveData.stats.speed = selected.stats.speed;
                Game.saveData.stats.strength = selected.stats.strength;

                playSound('menu_select');
                saveGame();
                showNotification(
                    `¡${selected.name} Seleccionado!`,
                    `Comenzando tu aventura como ${selected.title}`
                );

                setTimeout(() => {
                    startGame();
                }, 1000);
            },

            handleClick(x, y) {
                const charWidth = 400;
                const charHeight = 500;
                const spacing = 100;
                const startX = (canvas.width - (charWidth * 2 + spacing)) / 2;
                const startY = 150;

                this.characters.forEach((char, index) => {
                    const charX = startX + index * (charWidth + spacing);
                    const charY = startY;

                    if (x >= charX && x <= charX + charWidth &&
                        y >= charY && y <= charY + charHeight) {
                        this.selectedIndex = index;
                        playSound('menu_move');
                        // Double click or immediate selection
                        this.selectCharacter();
                    }
                });
            }
        };

            generatePlatforms() {
                this.platforms = [];

                // Ground platform
                this.platforms.push({
                    x: 0,
                    y: canvas.height - 40,
                    width: 300,
                    height: 40,
                    type: 'ground',
                    color: '#4a3f6b'
                });

                // Generate platforms progressively
                let lastX = 300;
                let lastY = canvas.height - 40;

                for (let i = 0; i < 50; i++) {
                    const gapX = Math.random() * 200 + 150;
                    const gapY = (Math.random() - 0.5) * 150;
                    const width = Math.random() * 150 + 100;

                    lastX += gapX;
                    lastY = Math.max(200, Math.min(canvas.height - 100, lastY + gapY));

                    const platformTypes = ['normal', 'moving', 'breakable'];
                    const type = i % 5 === 0 ? platformTypes[Math.floor(Math.random() * platformTypes.length)] : 'normal';

                    this.platforms.push({
                        x: lastX,
                        y: lastY,
                        width: width,
                        height: 30,
                        type: type,
                        color: type === 'moving' ? '#667eea' :
                               type === 'breakable' ? '#f59e0b' : '#5a4a7b',
                        originalY: lastY,
                        moveSpeed: type === 'moving' ? Math.random() * 2 + 1 : 0,
                        moveRange: 100,
                        broken: false
                    });
                }

                // Final victory platform
                this.platforms.push({
                    x: this.worldLength - 200,
                    y: canvas.height - 40,
                    width: 200,
                    height: 40,
                    type: 'victory',
                    color: '#fbbf24'

            // PARTE 5: Check achievements
            checkAchievements() {
                const p = Game.player;

                this.achievements.forEach(achievement => {
                    if (achievement.unlocked) return;

                    let unlock = false;

                    switch (achievement.id) {
                        case 'first_step':
                            if (p.stats.enemiesDefeated >= 1) unlock = true;
                            break;
                        case 'warrior':
                            if (p.stats.enemiesDefeated >= achievement.requirement) unlock = true;
                            break;
                        case 'unstoppable':
                            if (p.stats.maxCombo >= achievement.requirement) unlock = true;
                            break;
                        case 'collector':
                            if (p.stats.coinsCollected >= achievement.requirement) unlock = true;
                            break;
                        case 'survivor':
                            if (p.x >= this.worldLength * 0.5) unlock = true;
                            break;
                        case 'champion':
                            if (p.level >= achievement.requirement) unlock = true;
                            break;
                        case 'speedster':
                            if (p.stats.jumps >= achievement.requirement) unlock = true;
                            break;
                        case 'master':
                            if (p.stats.specialAbilitiesUsed >= achievement.requirement) unlock = true;
                            break;
                    }

                    if (unlock) {
                        achievement.unlocked = true;
                        Game.saveData.achievements.push(achievement.id);
                        saveGame();

                        showNotification(
                            `🏆 Logro Desbloqueado!`,
                            `${achievement.icon} ${achievement.name}: ${achievement.description}`,
                            5000
                        );
                        playSound('levelup');
                    }
                });

            updateHUD() {
                const healthPercent = (Game.player.health / Game.saveData.stats.maxHealth) * 100;
                const energyPercent = (Game.player.energy / Game.saveData.stats.maxEnergy) * 100;
                const progress = Math.floor((Game.player.x / this.worldLength) * 100);

                // XP calculation
                const xpForNextLevel = this.getXPForLevel(Game.player.level + 1);
                const xpPercent = (Game.player.xp / xpForNextLevel) * 100;
