            getXPForLevel(level) {
                return Math.floor(100 * Math.pow(1.5, level - 1));
            },

            gainXP(amount) {
                Game.player.xp += amount;
                const xpNeeded = this.getXPForLevel(Game.player.level + 1);

                if (Game.player.xp >= xpNeeded) {
                    this.levelUp();
                }
            },

            levelUp() {
                Game.player.level++;
                const xpNeeded = this.getXPForLevel(Game.player.level + 1);
                Game.player.xp = Game.player.xp - this.getXPForLevel(Game.player.level);

                // Increase stats
                Game.saveData.stats.maxHealth += 10;
                Game.saveData.stats.maxEnergy += 5;
                Game.saveData.stats.strength += 3;
                Game.saveData.stats.defense += 2;

                // Heal on level up
                Game.player.health = Game.saveData.stats.maxHealth;
                Game.player.energy = Game.saveData.stats.maxEnergy;

                // Visual effect
                for (let i = 0; i < 50; i++) {
                    Game.particles.push({
                        x: Game.player.x + Game.player.width / 2,
                        y: Game.player.y + Game.player.height / 2,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        color: '#fbbf24',
                        size: Math.random() * 6 + 3
                    });
                }

                playSound('levelup');
                showNotification(
                    `⭐ ¡Nivel ${Game.player.level}!`,
                    `Has subido de nivel! +10 ❤️ +5 ⚡ +3 💪`
                );

                saveGame();
            },

            showRandomMessage() {
                const message = this.motivationalMessages[Math.floor(Math.random() * this.motivationalMessages.length)];
                this.currentMessage = message;
                this.messageTimer = 4; // 4 seconds
            },

            update(dt) {
                this.time += dt;

                // Update player physics
                this.updatePlayerPhysics(dt);

                // Update camera to follow player
                this.updateCamera();

                // Update moving platforms
                this.updatePlatforms(dt);

                // Update coins
                this.updateCoins(dt);

                // Update enemies
                this.updateEnemies(dt);

                // PARTE 5: Update power-ups
                this.updatePowerups(dt);

                // PARTE 5: Update NPCs
                this.updateNPCs(dt);

                // PARTE 6: Update bosses
                this.updateBosses(dt);

                // PARTE 6: Update missions
                this.updateMissions();

                // PARTE 5: Update active buffs
                this.updateBuffs(dt);

                // PARTE 5: Update combo timer
                if (Game.player.comboTimer > 0) {
                    Game.player.comboTimer -= dt;
                    if (Game.player.comboTimer <= 0) {
                        Game.player.combo = 0;
                    }
                }

                // PARTE 5: Update ability cooldown
                if (Game.player.specialAbilityCooldown > 0) {
                    Game.player.specialAbilityCooldown--;
                }

                // PARTE 5: Update trail effect
                if (Math.abs(Game.player.velocityX) > 1 || Math.abs(Game.player.velocityY) > 1) {
                    Game.player.trail.push({
                        x: Game.player.x + Game.player.width / 2,
                        y: Game.player.y + Game.player.height / 2,
                        life: 0.5,
                        color: Game.player.color
                    });
                    if (Game.player.trail.length > 15) {
                        Game.player.trail.shift();
                    }
                }

                // PARTE 5: Check achievements
                this.checkAchievements();

                // Update clouds
                this.clouds.forEach(cloud => {
                    cloud.x += cloud.speed;
                    if (cloud.x > this.worldLength + 200) {
                        cloud.x = -200;
                    }
                });

                // Update stars
                this.stars.forEach(star => {
                    star.opacity = 0.5 + Math.sin(this.time * star.twinkleSpeed) * 0.5;
                });

                // Update message timer
                if (this.messageTimer > 0) {
                    this.messageTimer -= dt;
                    if (this.messageTimer <= 0) {
                        this.currentMessage = null;
                    }
                }

                // Check for checkpoint messages
                this.checkpoints.forEach((checkpoint, index) => {
                    if (Game.player.x > checkpoint && Game.player.x < checkpoint + 50) {
                        if (!this.currentMessage) {
                            this.showRandomMessage();
                        }
                    }
                });

                // Update HUD
                this.updateHUD();

                // Check victory
                if (Game.player.x >= this.worldLength - 100) {
                    this.victory();
                }
            },

            updatePlayerPhysics(dt) {
                const p = Game.player;
                const gravity = 0.8;
                let moveSpeed = 5 * (Game.saveData.stats.speed / 100);

                // PARTE 5: Apply speed buff
                const speedBuff = p.activeBuffs.find(b => b.type === 'speed');
                if (speedBuff) {
                    moveSpeed *= speedBuff.multiplier;
                }

                const jumpForce = -15;

                // Horizontal movement
                if (Game.keys['ArrowLeft'] || Game.keys['a'] || Game.keys['A']) {
                    p.velocityX = -moveSpeed;
                    p.isFacingRight = false;
                } else if (Game.keys['ArrowRight'] || Game.keys['d'] || Game.keys['D']) {
                    p.velocityX = moveSpeed;
                    p.isFacingRight = true;
                } else {
                    p.velocityX *= 0.8; // Friction
                }

                // Apply gravity
                p.velocityY += gravity;

                // Apply velocity
                p.x += p.velocityX;
                p.y += p.velocityY;

                // Check platform collisions
                p.isGrounded = false;
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    if (this.checkCollision(p, platform)) {
                        // Landing on top of platform
                        if (p.velocityY > 0 && p.y + p.height - p.velocityY <= platform.y + 10) {
                            p.y = platform.y - p.height;
                            p.velocityY = 0;
                            p.isGrounded = true;
                            p.canDoubleJump = true;

                            // Break breakable platforms
                            if (platform.type === 'breakable') {
                                setTimeout(() => {
                                    platform.broken = true;
                                }, 500);
                            }

                            // Victory platform
                            if (platform.type === 'victory') {
                                this.victory();
                            }
                        }
                    }
                });

                // Prevent falling below screen
                if (p.y > canvas.height + 100) {
                    p.health -= 20;
                    p.x = 100;
                    p.y = 300;
                    p.velocityX = 0;
                    p.velocityY = 0;
                    playSound('damage');

                    if (p.health <= 0) {
                        this.gameOver();
                    }
                }

                // Energy regeneration
                if (p.energy < Game.saveData.stats.maxEnergy) {
                    p.energy += dt * 5;
                }

                // Decrease cooldowns
                if (p.attackCooldown > 0) p.attackCooldown--;
                if (p.invulnerabilityTime > 0) p.invulnerabilityTime--;
            },

            updateCamera() {
                // Smooth camera follow
                Game.camera.targetX = Game.player.x - canvas.width / 3;
                Game.camera.targetY = Game.player.y - canvas.height / 2;

                Game.camera.x += (Game.camera.targetX - Game.camera.x) * 0.1;
                Game.camera.y += (Game.camera.targetY - Game.camera.y) * 0.1;

                // Clamp camera
                Game.camera.x = Math.max(0, Math.min(Game.camera.x, this.worldLength - canvas.width));
                Game.camera.y = Math.max(0, Math.min(Game.camera.y, 200));

                // Camera shake
                if (Game.camera.shake > 0) {
                    Game.camera.shake -= 0.5;
                    Game.camera.x += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                    Game.camera.y += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                }
            },

            updatePlatforms(dt) {
                this.platforms.forEach(platform => {
                    if (platform.type === 'moving') {
                        platform.y = platform.originalY + Math.sin(this.time * platform.moveSpeed) * platform.moveRange;
                    }
                });
            },

            updateCoins(dt) {
                this.coins.forEach(coin => {
                    if (!coin.collected) {
                        coin.rotation += dt * 3;

                        // Check collision with player
                        const dx = coin.x - (Game.player.x + Game.player.width / 2);
                        const dy = coin.y - (Game.player.y + Game.player.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < coin.radius + 20) {
                            coin.collected = true;
                            Game.player.coins += coin.value;
                            Game.player.stats.coinsCollected++;
                            playSound('coin');
                            this.createCoinParticles(coin.x, coin.y);
                        }
                    }
                });
            },

            // PARTE 5: Update power-ups
            updatePowerups(dt) {
                this.powerups.forEach(powerup => {
                    if (!powerup.collected) {
                        powerup.rotation += dt * 2;
                        powerup.floatOffset += dt * 3;

                        // Check collision with player
                        const dx = powerup.x - (Game.player.x + Game.player.width / 2);
                        const dy = powerup.y - (Game.player.y + Game.player.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 30) {
                            powerup.collected = true;
                            this.applyPowerup(powerup.type);
                        }
                    }
                });
            },

            // PARTE 5: Apply power-up effect
            applyPowerup(powerupType) {
                const p = Game.player;

                playSound('coin'); // Use coin sound, could create custom powerup sound

                if (powerupType.effect === 'heal') {
                    p.health = Math.min(p.health + powerupType.healAmount, Game.saveData.stats.maxHealth);
                    showNotification(
                        `${powerupType.icon} ${powerupType.name}!`,
                        `+${powerupType.healAmount} ❤️`,
                        2000
                    );
                } else {
                    // Add timed buff
                    p.activeBuffs.push({
                        type: powerupType.effect,
                        name: powerupType.name,
                        icon: powerupType.icon,
                        color: powerupType.color,
                        duration: powerupType.duration * 60, // Convert to frames
                        multiplier: powerupType.multiplier || 1
                    });

                    showNotification(
                        `${powerupType.icon} ${powerupType.name}!`,
                        powerupType.description,
                        3000
                    );
                }
            },

            // PARTE 5: Update NPCs
            updateNPCs(dt) {
                this.npcs.forEach(npc => {
                    npc.floatOffset += dt * 2;

                    // Check if player is near NPC
                    if (!npc.hasInteracted) {
                        const distance = Math.abs(Game.player.x - npc.x);
                        if (distance < 100) {
                            npc.hasInteracted = true;

                            // Show NPC message
                            const message = npc.type.messages[Math.floor(Math.random() * npc.type.messages.length)];
                            showNotification(
                                `${npc.type.name} 🧙`,
                                message,
                                4000
                            );

                            // Apply buff
                            Game.player.activeBuffs.push({
                                type: npc.type.buff.type,
                                name: npc.type.name,
                                icon: '✨',
                                color: npc.type.color,
                                duration: npc.type.buff.duration * 60,
                                multiplier: npc.type.buff.multiplier
                            });

                            playSound('levelup');
                        }
                    }
                });
            },

            // PARTE 5: Update active buffs
            updateBuffs(dt) {
                Game.player.activeBuffs = Game.player.activeBuffs.filter(buff => {
                    buff.duration--;
                    return buff.duration > 0;
                });
            },

            // PARTE 6: Update bosses
            updateBosses(dt) {
                this.bosses.forEach(boss => {
                    if (boss.isDefeated) return;

                    // Activate boss when player gets near
                    const distance = Math.abs(Game.player.x - boss.x);
                    if (distance < 300 && !boss.isActive) {
                        boss.isActive = true;
                        boss.dialogue = boss.type.dialogue.intro;
                        boss.dialogueTimer = 3;
                        showNotification(
                            `⚔️ ${boss.type.name}`,
                            boss.type.title,
                            3000
                        );
                        playSound('enemy_death'); // Dramatic sound
                    }

                    if (!boss.isActive) return;

                    // Show dialogue
                    if (boss.dialogueTimer > 0) {
                        boss.dialogueTimer -= dt;
                    }

                    // Update invulnerability
                    if (boss.invulnerableTimer > 0) {
                        boss.invulnerableTimer--;
                    }

                    // Check phase transitions
                    boss.type.phases.forEach((phase, index) => {
                        if (boss.currentPhase === index && boss.health <= phase.healthThreshold) {
                            boss.currentPhase++;
                            boss.dialogue = phase.message;
                            boss.dialogueTimer = 2;
                            showNotification('⚡ Cambio de Fase!', phase.message, 3000);
                            playSound('levelup');
                        }
                    });

                    // Simple AI: Move towards player
                    if (boss.attackCooldown <= 0) {
                        const dir = Game.player.x > boss.x ? 1 : -1;
                        boss.velocityX = dir * boss.type.speed;
                    } else {
                        boss.attackCooldown--;
                    }

                    // Apply velocity
                    boss.x += boss.velocityX;
                    boss.velocityX *= 0.9; // Friction

                    // Check collision with player
                    if (this.checkCollision(Game.player, boss) && !Game.player.isInvulnerable) {
                        const shieldBuff = Game.player.activeBuffs.find(b => b.type === 'shield');
                        if (!shieldBuff) {
                            Game.player.health -= boss.type.damage;
                            Game.player.stats.damageTaken += boss.type.damage;
                            Game.player.invulnerabilityTime = 60;
                            playSound('damage');

                            const knockbackDir = Game.player.x < boss.x ? -1 : 1;
                            Game.player.velocityX = knockbackDir * 12;
                            Game.player.velocityY = -10;

                            Game.camera.shake = 15;
                            Game.camera.shakeIntensity = 10;

                            if (Game.player.health <= 0) {
                                this.gameOver();
                            }
                        }
                    }
                });
            },

            // PARTE 6: Update missions
            updateMissions() {
                const p = Game.player;

                this.missions.forEach(mission => {
                    if (mission.completed) return;

                    switch (mission.id) {
                        case 'side_1':
                            mission.current = p.stats.coinsCollected;
                            break;
                        case 'side_2':
                            mission.current = p.stats.enemiesDefeated;
                            break;
                        case 'side_3':
                            mission.current = p.stats.maxCombo;
                            break;
                        case 'side_4':
                            mission.current = p.stats.jumps;
                            break;
                        case 'side_5':
                            mission.current = p.stats.specialAbilitiesUsed;
                            break;
                    }

                    // Check completion
                    if (mission.target && mission.current >= mission.target && !mission.completed) {
                        mission.completed = true;

                        // Give rewards
                        if (mission.reward.coins) {
                            p.coins += mission.reward.coins;
                        }
                        if (mission.reward.xp) {
                            this.gainXP(mission.reward.xp);
                        }

                        showNotification(
                            `${mission.icon} ¡Misión Completada!`,
                            `${mission.name} - Recompensa: ${mission.reward.coins || 0} 💰`,
                            4000
                        );
                        playSound('levelup');
                    }
                });
            },

            updateEnemies(dt) {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    // Apply gravity
                    enemy.velocityY += 0.8;

                    // Apply velocity
                    enemy.x += enemy.velocityX;
                    enemy.y += enemy.velocityY;

                    // Check platform collisions
                    enemy.isGrounded = false;
                    this.platforms.forEach(platform => {
                        if (platform.broken) return;

                        if (this.checkCollision(enemy, platform)) {
                            if (enemy.velocityY > 0 && enemy.y + enemy.height - enemy.velocityY <= platform.y + 10) {
                                enemy.y = platform.y - enemy.height;
                                enemy.velocityY = 0;
                                enemy.isGrounded = true;
                            }
                        }
                    });

                    // Patrol behavior
                    if (enemy.isGrounded && enemy.patrolPlatform) {
                        const platform = enemy.patrolPlatform;
                        if (enemy.x < platform.x || enemy.x + enemy.width > platform.x + platform.width) {
                            enemy.velocityX *= -1;
                        }
                    }

                    // Check collision with player
                    if (this.checkCollision(Game.player, enemy)) {
                        if (enemy.hitCooldown <= 0 && !Game.player.isInvulnerable) {
                            // PARTE 5: Check for shield buff
                            const shieldBuff = Game.player.activeBuffs.find(b => b.type === 'shield');
                            const hasInfiniteEnergy = Game.player.activeBuffs.find(b => b.type === 'infinite_energy');

                            if (!shieldBuff) {
                                // Player takes damage
                                Game.player.health -= enemy.damage;
                                Game.player.stats.damageTaken += enemy.damage;
                                Game.player.invulnerabilityTime = 60;
                                playSound('damage');

                                // Knockback
                                const knockbackDir = Game.player.x < enemy.x ? -1 : 1;
                                Game.player.velocityX = knockbackDir * 8;
                                Game.player.velocityY = -8;

                                Game.camera.shake = 10;
                                Game.camera.shakeIntensity = 8;

                                if (Game.player.health <= 0) {
                                    this.gameOver();
                                }
                            } else {
                                // Shield absorbs damage - show particle effect
                                for (let i = 0; i < 10; i++) {
                                    Game.particles.push({
                                        x: Game.player.x + Game.player.width / 2,
                                        y: Game.player.y + Game.player.height / 2,
                                        vx: (Math.random() - 0.5) * 6,
                                        vy: (Math.random() - 0.5) * 6,
                                        life: 0.5,
                                        color: '#3b82f6',
                                        size: Math.random() * 4 + 2
                                    });
                                }
                            }

                            enemy.hitCooldown = 60;
                        }
                    }

                    // Decrease cooldowns
                    if (enemy.hitCooldown > 0) enemy.hitCooldown--;
                });
            },

            checkCollision(player, platform) {
                return player.x < platform.x + platform.width &&
                       player.x + player.width > platform.x &&
                       player.y < platform.y + platform.height &&
                       player.y + player.height > platform.y;
            },

            createCoinParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    Game.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 5,
                        vy: (Math.random() - 0.5) * 5,
                        life: 1,
                        color: '#fbbf24',
                        size: Math.random() * 4 + 2
                    });
                }
            },

            handleJump() {
                const p = Game.player;
                const jumpForce = -15;
                const hasInfiniteEnergy = p.activeBuffs.find(b => b.type === 'infinite_energy');

                if (p.isGrounded && (p.energy >= 10 || hasInfiniteEnergy)) {
                    p.velocityY = jumpForce;
                    if (!hasInfiniteEnergy) p.energy -= 10;
                    p.isGrounded = false;
                    p.stats.jumps++;
                    playSound('jump');
                } else if (p.canDoubleJump && !p.isGrounded && (p.energy >= 15 || hasInfiniteEnergy)) {
                    p.velocityY = jumpForce;
                    if (!hasInfiniteEnergy) p.energy -= 15;
                    p.canDoubleJump = false;
                    p.stats.jumps++;
                    playSound('jump');
                }
            },

            handleAttack() {
                const p = Game.player;
                const hasInfiniteEnergy = p.activeBuffs.find(b => b.type === 'infinite_energy');

                if (p.attackCooldown > 0 || (p.energy < 15 && !hasInfiniteEnergy)) return;

                p.isAttacking = true;
                p.attackCooldown = 30;
                if (!hasInfiniteEnergy) p.energy -= 15;

                playSound('attack');

                // Create attack hitbox
                const attackRange = 50;
                const attackX = p.isFacingRight ? p.x + p.width : p.x - attackRange;
                const attackY = p.y;
                const attackWidth = attackRange;
                const attackHeight = p.height;

                // Attack particles
                for (let i = 0; i < 10; i++) {
                    Game.particles.push({
                        x: attackX + attackWidth / 2,
                        y: attackY + attackHeight / 2,
                        vx: (p.isFacingRight ? 5 : -5) + (Math.random() - 0.5) * 3,
                        vy: (Math.random() - 0.5) * 5,
                        life: 0.5,
                        color: p.color,
                        size: Math.random() * 4 + 2
                    });
                }

                // Check enemy hits
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    const hitbox = {
                        x: attackX,
                        y: attackY,
                        width: attackWidth,
                        height: attackHeight
                    };

                    if (this.checkCollision(hitbox, enemy)) {
                        // PARTE 5: Calculate damage with buffs and combo
                        let damage = Game.saveData.stats.strength;

                        // Apply strength buff
                        const strengthBuff = p.activeBuffs.find(b => b.type === 'strength' || b.type === 'damage_boost');
                        if (strengthBuff) {
                            damage *= strengthBuff.multiplier;
                        }

                        // Combo multiplier
                        const comboMultiplier = 1 + (p.combo * 0.15);
                        damage = Math.floor(damage * comboMultiplier);

                        enemy.health -= damage;
                        p.stats.damageDealt += damage;

                        // PARTE 5: Update combo
                        p.combo++;
                        p.comboTimer = 3; // 3 seconds to continue combo
                        if (p.combo > p.stats.maxCombo) {
                            p.stats.maxCombo = p.combo;
                        }

                        // Knockback
                        const knockbackDir = p.isFacingRight ? 1 : -1;
                        enemy.velocityX = knockbackDir * 10;
                        enemy.velocityY = -5;

                        // Hit effect
                        for (let i = 0; i < 15; i++) {
                            Game.particles.push({
                                x: enemy.x + enemy.width / 2,
                                y: enemy.y + enemy.height / 2,
                                vx: (Math.random() - 0.5) * 8,
                                vy: (Math.random() - 0.5) * 8,
                                life: 0.8,
                                color: enemy.color,
                                size: Math.random() * 5 + 2
                            });
                        }

                        playSound('hit');

                        // Check if enemy died
                        if (enemy.health <= 0) {
                            enemy.isDead = true;
                            p.stats.enemiesDefeated++;

                            // PARTE 5: Apply XP buff if active
                            let xpGain = enemy.xp;
                            const xpBuff = p.activeBuffs.find(b => b.type === 'xp_boost');
                            if (xpBuff) {
                                xpGain = Math.floor(xpGain * xpBuff.multiplier);
                            }

                            this.gainXP(xpGain);

                            // Death explosion
                            for (let i = 0; i < 30; i++) {
                                Game.particles.push({
                                    x: enemy.x + enemy.width / 2,
                                    y: enemy.y + enemy.height / 2,
                                    vx: (Math.random() - 0.5) * 12,
                                    vy: (Math.random() - 0.5) * 12,
                                    life: 1,
                                    color: enemy.color,
                                    size: Math.random() * 6 + 3
                                });
                            }

                            playSound('enemy_death');
                            showNotification(
                                `💫 ${enemy.name} derrotado!`,
                                `+${enemy.xp} XP`
                            );
                        }
                    }
                });

                // PARTE 6: Check boss hits
                this.bosses.forEach(boss => {
                    if (boss.isDefeated || !boss.isActive || boss.invulnerableTimer > 0) return;

                    const hitbox = {
                        x: attackX,
                        y: attackY,
                        width: attackWidth,
                        height: attackHeight
                    };

                    if (this.checkCollision(hitbox, boss)) {
                        let damage = Game.saveData.stats.strength;

                        const strengthBuff = p.activeBuffs.find(b => b.type === 'strength' || b.type === 'damage_boost');
                        if (strengthBuff) {
                            damage *= strengthBuff.multiplier;
                        }

                        const comboMultiplier = 1 + (p.combo * 0.15);
                        damage = Math.floor(damage * comboMultiplier);

                        boss.health -= damage;
                        p.stats.damageDealt += damage;

                        p.combo++;
                        p.comboTimer = 3;
                        if (p.combo > p.stats.maxCombo) {
                            p.stats.maxCombo = p.combo;
                        }

                        // Boss hit effects
                        for (let i = 0; i < 20; i++) {
                            Game.particles.push({
                                x: boss.x + boss.width / 2,
                                y: boss.y + boss.height / 2,
                                vx: (Math.random() - 0.5) * 10,
                                vy: (Math.random() - 0.5) * 10,
                                life: 0.8,
                                color: boss.type.color,
                                size: Math.random() * 6 + 3
                            });
                        }

                        playSound('hit');

                        // Check if boss defeated
                        if (boss.health <= 0) {
                            boss.isDefeated = true;
                            p.coins += boss.type.coins;
                            this.gainXP(boss.type.xp);

                            // Complete main mission
                            const mission = this.missions.find(m => m.type === 'main' && m.description.includes(boss.type.name));
                            if (mission) {
                                mission.completed = true;
                                if (mission.reward.coins) p.coins += mission.reward.coins;
                                if (mission.reward.xp) this.gainXP(mission.reward.xp);
                            }

                            showNotification(
                                `🏆 ¡${boss.type.name} Derrotado!`,
                                `+${boss.type.coins} 💰 +${boss.type.xp} XP`,
                                5000
                            );
                            playSound('levelup');

                            // Death explosion
                            for (let i = 0; i < 50; i++) {
                                Game.particles.push({
                                    x: boss.x + boss.width / 2,
                                    y: boss.y + boss.height / 2,
                                    vx: (Math.random() - 0.5) * 15,
                                    vy: (Math.random() - 0.5) * 15,
                                    life: 1.5,
                                    color: boss.type.color,
                                    size: Math.random() * 8 + 4
                                });
                            }
                        }
                    }
                });

                setTimeout(() => {
                    p.isAttacking = false;
                }, 200);
            },

            // PARTE 5: Handle special ability
            handleSpecialAbility() {
                const p = Game.player;
                const ability = this.specialAbilities[Game.saveData.character];

                // Check cooldown and energy
                if (p.specialAbilityCooldown > 0 || p.energy < ability.energyCost) {
                    if (p.specialAbilityCooldown > 0) {
                        showNotification('⏱️ Recargando', 'Habilidad aún en cooldown', 1500);
                    } else {
                        showNotification('⚡ Sin energía', 'Necesitas más energía', 1500);
                    }
                    return;
                }

                p.energy -= ability.energyCost;
                p.specialAbilityCooldown = ability.cooldown * 60; // Convert to frames
                p.isUsingSpecial = true;
                p.stats.specialAbilitiesUsed++;

                playSound('levelup');

                if (Game.saveData.character === 'luna') {
                    // Luna's ability: Healing wave
                    showNotification(
                        `${ability.icon} ${ability.name}!`,
                        ability.description,
                        3000
                    );

                    // Heal player
                    p.health = Math.min(p.health + ability.healAmount, Game.saveData.stats.maxHealth);

                    // Create wave effect
                    for (let i = 0; i < 50; i++) {
                        const angle = (Math.PI * 2 * i) / 50;
                        const speed = 5 + Math.random() * 3;
                        Game.particles.push({
                            x: p.x + p.width / 2,
                            y: p.y + p.height / 2,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1.5,
                            color: ability.color,
                            size: Math.random() * 6 + 4
                        });
                    }

                    // Push back nearby enemies
                    this.enemies.forEach(enemy => {
                        if (enemy.isDead) return;

                        const dx = enemy.x - p.x;
                        const dy = enemy.y - p.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < ability.range) {
                            const pushDir = dx > 0 ? 1 : -1;
                            enemy.velocityX = pushDir * ability.pushForce;
                            enemy.velocityY = -ability.pushForce;
                        }
                    });

                } else if (Game.saveData.character === 'sol') {
                    // Sol's ability: Dash attack
                    showNotification(
                        `${ability.icon} ${ability.name}!`,
                        ability.description,
                        3000
                    );

                    p.isDashing = true;
                    const dashDir = p.isFacingRight ? 1 : -1;
                    p.velocityX = dashDir * ability.dashSpeed;
                    p.isInvulnerable = true;

                    // Trail particles
                    const dashInterval = setInterval(() => {
                        for (let i = 0; i < 5; i++) {
                            Game.particles.push({
                                x: p.x + p.width / 2,
                                y: p.y + p.height / 2,
                                vx: (Math.random() - 0.5) * 4,
                                vy: (Math.random() - 0.5) * 4,
                                life: 0.8,
                                color: ability.color,
                                size: Math.random() * 6 + 3
                            });
                        }
                    }, 50);

                    // Damage enemies during dash
                    const dashDamageInterval = setInterval(() => {
                        this.enemies.forEach(enemy => {
                            if (enemy.isDead) return;

                            if (this.checkCollision(p, enemy)) {
                                enemy.health -= ability.damage;
                                p.stats.damageDealt += ability.damage;

                                // Knockback
                                enemy.velocityX = dashDir * 15;
                                enemy.velocityY = -10;

                                // Hit particles
                                for (let i = 0; i < 10; i++) {
                                    Game.particles.push({
                                        x: enemy.x + enemy.width / 2,
                                        y: enemy.y + enemy.height / 2,
                                        vx: (Math.random() - 0.5) * 10,
                                        vy: (Math.random() - 0.5) * 10,
                                        life: 0.6,
                                        color: ability.color,
                                        size: Math.random() * 5 + 2
                                    });
                                }

                                if (enemy.health <= 0) {
                                    enemy.isDead = true;
                                    p.stats.enemiesDefeated++;
                                    this.gainXP(enemy.xp);
                                    playSound('enemy_death');
                                }
                            }
                        });
                    }, 100);

                    // End dash after duration
                    setTimeout(() => {
                        p.isDashing = false;
                        p.isInvulnerable = false;
                        p.isUsingSpecial = false;
                        clearInterval(dashInterval);
                        clearInterval(dashDamageInterval);
                    }, ability.duration * 1000);
                }

                if (Game.saveData.character === 'luna') {
                    setTimeout(() => {
                        p.isUsingSpecial = false;
                    }, 500);
                }
            },

            draw() {
                // Draw parallax background
                this.drawParallax();

                // Draw stars
                this.drawStars();

                // Draw clouds
                this.drawClouds();

                // Draw platforms
                this.drawPlatforms();

                // Draw coins
                this.drawCoins();

                // PARTE 5: Draw power-ups
                this.drawPowerups();

                // PARTE 5: Draw NPCs
                this.drawNPCs();

                // Draw enemies
                this.drawEnemies();

                // PARTE 6: Draw bosses
                this.drawBosses();

                // PARTE 5: Draw player trail
                this.drawTrail();

                // Draw player
                this.drawPlayer();

                // Draw particles
                this.drawParticles();

                // Draw motivational message
                this.drawMessage();
            },

            drawParallax() {
                // Sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                const progress = Game.player.x / this.worldLength;

                // Change colors based on progress (dark to sunset)
                if (progress < 0.5) {
                    skyGradient.addColorStop(0, '#0f0c29');
                    skyGradient.addColorStop(1, '#302b63');
                } else {
                    const t = (progress - 0.5) * 2;
                    const r1 = Math.floor(15 + (255 - 15) * t);
                    const g1 = Math.floor(12 + (107 - 12) * t);
                    const b1 = Math.floor(41 + (133 - 41) * t);
                    skyGradient.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`);
                    skyGradient.addColorStop(1, '#ff6b9d');
                }

                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw mountains (parallax)
                const layer = this.parallaxLayers[1];
                const offsetX = Game.camera.x * layer.speed;

                ctx.fillStyle = layer.color;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);

                for (let i = 0; i < layer.heights.length; i++) {
                    const x = (i * 100) - offsetX;
                    const y = layer.y - layer.heights[i];
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            },

            drawStars() {
                this.stars.forEach(star => {
                    const screenX = star.x - Game.camera.x * 0.1;
                    const screenY = star.y;

                    ctx.save();
                    ctx.globalAlpha = star.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(screenX, screenY, star.size, star.size);
                    ctx.restore();
                });
            },

            drawClouds() {
                this.clouds.forEach(cloud => {
                    const screenX = cloud.x - Game.camera.x * 0.5;
                    const screenY = cloud.y;

                    ctx.save();
                    ctx.globalAlpha = cloud.opacity;
                    ctx.fillStyle = '#fff';

                    // Draw cloud shape
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width / 3, screenY - cloud.height / 4, cloud.height / 1.5, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width * 2/3, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            },

            drawPlatforms() {
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    const screenX = platform.x - Game.camera.x;
                    const screenY = platform.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + platform.width < 0 || screenX > canvas.width) return;

                    // Platform shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(screenX + 5, screenY + 5, platform.width, platform.height);

                    // Platform
                    ctx.fillStyle = platform.color;
                    ctx.fillRect(screenX, screenY, platform.width, platform.height);

                    // Platform border
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(screenX, screenY, platform.width, platform.height);

                    // Victory platform glow
                    if (platform.type === 'victory') {
                        ctx.save();
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        ctx.restore();
                    }
                });
            },

            drawCoins() {
                this.coins.forEach(coin => {
                    if (coin.collected) return;

                    const screenX = coin.x - Game.camera.x;
                    const screenY = coin.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.rotate(coin.rotation);

                    // Coin glow
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 10;

                    // Coin
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Coin center
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius - 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            },

            // PARTE 5: Draw power-ups
            drawPowerups() {
                this.powerups.forEach(powerup => {
                    if (powerup.collected) return;

                    const screenX = powerup.x - Game.camera.x;
                    const screenY = powerup.y + Math.sin(powerup.floatOffset) * 10 - Game.camera.y;

                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.rotate(powerup.rotation);

                    // Glow effect
                    ctx.shadowColor = powerup.type.color;
                    ctx.shadowBlur = 20;

                    // Power-up background
                    ctx.fillStyle = powerup.type.color;
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(-powerup.width/2, -powerup.height/2, powerup.width, powerup.height);

                    // Icon
                    ctx.globalAlpha = 1;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(powerup.type.icon, 0, 0);

                    ctx.restore();
                });
            },

            // PARTE 5: Draw NPCs
            drawNPCs() {
                this.npcs.forEach(npc => {
                    const screenX = npc.x - Game.camera.x;
                    const screenY = npc.y + Math.sin(npc.floatOffset) * 5 - Game.camera.y;

                    if (screenX < -100 || screenX > canvas.width + 100) return;

                    ctx.save();

                    // Glow effect
                    ctx.shadowColor = npc.type.color;
                    ctx.shadowBlur = 20;

                    // Body (wise robed figure)
                    ctx.fillStyle = npc.type.color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, npc.width/2, 0, Math.PI * 2);
                    ctx.fill();

                    // Wisdom aura
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, npc.width/2 + 10, 0, Math.PI * 2);
                    ctx.fill();

                    // Face
                    ctx.globalAlpha = 1;
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🧙', screenX, screenY);

                    // Name label if not interacted
                    if (!npc.hasInteracted) {
                        ctx.font = '12px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.shadowColor = '#000';
                        ctx.shadowBlur = 4;
                        ctx.fillText(npc.type.name, screenX, screenY - 35);
                    }

                    ctx.restore();
                });
            },

            // PARTE 5: Draw player trail
            drawTrail() {
                Game.player.trail = Game.player.trail.filter(t => {
                    t.life -= 0.03;
                    if (t.life <= 0) return false;

                    const screenX = t.x - Game.camera.x;
                    const screenY = t.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = t.life * 0.5;
                    ctx.fillStyle = t.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    return true;
                });
            },

            drawEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    const screenX = enemy.x - Game.camera.x;
                    const screenY = enemy.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + enemy.width < 0 || screenX > canvas.width) return;

                    ctx.save();

                    // Glow effect
                    ctx.shadowColor = enemy.color;
                    ctx.shadowBlur = 15;

                    // Enemy body (shadowy form)
                    ctx.fillStyle = enemy.color;
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2, screenY + enemy.height / 2, enemy.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes (menacing)
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#fff';
                    const eyeY = screenY + enemy.height / 2 - 5;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 4, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 4, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // Health bar
                    if (enemy.health < enemy.maxHealth) {
                        const barWidth = enemy.width;
                        const barHeight = 4;
                        const barX = screenX;
                        const barY = screenY - 10;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillRect(barX, barY, barWidth, barHeight);

                        ctx.fillStyle = '#ef4444';
                        const healthWidth = (enemy.health / enemy.maxHealth) * barWidth;
                        ctx.fillRect(barX, barY, healthWidth, barHeight);
                    }

                    // Name label
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 4;
                    ctx.fillText(enemy.name, screenX + enemy.width / 2, screenY - 15);
                    ctx.shadowBlur = 0;
                });
            },

            // PARTE 6: Draw bosses
            drawBosses() {
                this.bosses.forEach(boss => {
                    if (boss.isDefeated) return;

                    const screenX = boss.x - Game.camera.x;
                    const screenY = boss.y - Game.camera.y;

                    if (screenX + boss.width < -100 || screenX > canvas.width + 100) return;

                    ctx.save();

                    // Massive glow effect
                    ctx.shadowColor = boss.type.color;
                    ctx.shadowBlur = 30;

                    // Boss body
                    const currentPhase = boss.type.phases[boss.currentPhase];
                    const color = currentPhase?.color || boss.type.color;

                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(screenX + boss.width / 2, screenY + boss.height / 2, boss.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Aura
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(screenX + boss.width / 2, screenY + boss.height / 2, boss.width / 2 + 20, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes (glowing red)
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ff0000';
                    const eyeY = screenY + boss.height / 2 - 10;
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 15;
                    ctx.beginPath();
                    ctx.arc(screenX + boss.width / 2 - 20, eyeY, 8, 0, Math.PI * 2);
                    ctx.arc(screenX + boss.width / 2 + 20, eyeY, 8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // BOSS HEALTH BAR (prominent)
                    const barWidth = 200;
                    const barHeight = 20;
                    const barX = screenX + boss.width / 2 - barWidth / 2;
                    const barY = screenY - 40;

                    // Background
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(barX, barY, barWidth, barHeight);

                    // Health
                    ctx.fillStyle = '#ef4444';
                    const healthWidth = (boss.health / boss.maxHealth) * barWidth;
                    ctx.fillRect(barX, barY, healthWidth, barHeight);

                    // Border
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barWidth, barHeight);

                    // Boss name and title
                    ctx.font = 'bold 18px Arial';
                    ctx.fillStyle = '#fbbf24';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 6;
                    ctx.fillText(boss.type.name, screenX + boss.width / 2, screenY - 55);

                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(boss.type.title, screenX + boss.width / 2, screenY - 70);

                    // Health text
                    ctx.font = '14px Arial';
                    ctx.fillText(`${Math.floor(boss.health)} / ${boss.maxHealth}`, screenX + boss.width / 2, barY + 15);
                    ctx.shadowBlur = 0;

                    // Dialogue box (if active)
                    if (boss.dialogue && boss.dialogueTimer > 0) {
                        const dialogueWidth = 300;
                        const dialogueHeight = 50;
                        const dialogueX = screenX + boss.width / 2 - dialogueWidth / 2;
                        const dialogueY = screenY - 120;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.fillRect(dialogueX, dialogueY, dialogueWidth, dialogueHeight);

                        ctx.strokeStyle = boss.type.color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(dialogueX, dialogueY, dialogueWidth, dialogueHeight);

                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'center';
                        ctx.fillText(boss.dialogue, screenX + boss.width / 2, dialogueY + 30);
                    }
                });
            },

            drawPlayer() {
                const p = Game.player;
                const screenX = p.x - Game.camera.x;
                const screenY = p.y - Game.camera.y;

                ctx.save();

                // Flip if facing left
                if (!p.isFacingRight) {
                    ctx.translate(screenX + p.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.translate(-(screenX + p.width), -screenY);
                }

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(screenX + p.width/2, screenY + p.height + 2, p.width/2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = p.color;
                ctx.fillRect(screenX + 8, screenY + 20, p.width - 16, 22);

                // Head
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2, screenY + 12, 12, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (Game.saveData.character === 'luna') {
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2 - 6, screenY + 8, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2 + 6, screenY + 8, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2, screenY + 4, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2, screenY + 4, 12, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2 - 4, screenY + 10, 2, 0, Math.PI * 2);
                ctx.arc(screenX + p.width/2 + 4, screenY + 10, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(screenX + p.width/2, screenY + 12, 5, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms
                ctx.fillStyle = '#FFD1B3';
                ctx.fillRect(screenX + 2, screenY + 22, 6, 15);
                ctx.fillRect(screenX + p.width - 8, screenY + 22, 6, 15);

                // Legs
                ctx.fillStyle = p.color;
                const legOffset = Math.abs(p.velocityX) > 0.1 ? Math.sin(this.time * 10) * 3 : 0;
                ctx.fillRect(screenX + 10, screenY + 42 + legOffset, 6, 18);
                ctx.fillRect(screenX + p.width - 16, screenY + 42 - legOffset, 6, 18);

                // Shoes
                ctx.fillStyle = '#333';
                ctx.fillRect(screenX + 10, screenY + 58, 6, 4);
                ctx.fillRect(screenX + p.width - 16, screenY + 58, 6, 4);

                ctx.restore();
            },

            drawParticles() {
                Game.particles = Game.particles.filter(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;

                    if (p.life <= 0) return false;

                    const screenX = p.x - Game.camera.x;
                    const screenY = p.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    return true;
                });
            },

            drawMessage() {
                if (!this.currentMessage) return;

                const alpha = this.messageTimer > 0.5 ? 1 : this.messageTimer * 2;

                ctx.save();
                ctx.globalAlpha = alpha;

                // Message background
                const msgWidth = 400;
                const msgHeight = 60;
                const msgX = canvas.width - msgWidth - 20;
                const msgY = 100;

                ctx.fillStyle = 'rgba(102, 126, 234, 0.9)';
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 20;
                ctx.fillRect(msgX, msgY, msgWidth, msgHeight);

                // Message text
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.currentMessage, msgX + msgWidth/2, msgY + msgHeight/2 + 7);

                ctx.restore();
            },

            victory() {
                Game.state = GameStates.VICTORY;
                saveGame();
                showNotification('🎉 ¡Victoria!', '¡Has completado tu viaje de esperanza!');

                // Show victory screen (will implement in next part)
                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            },

            gameOver() {
                Game.state = GameStates.GAME_OVER;
                showNotification('💔 Fin del Juego', 'No te rindas, inténtalo de nuevo');

                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            }
        };

        function startGame() {
            Game.state = GameStates.PLAYING;
            GameScene.init();
        }

        // ============================================
        // INPUT HANDLING
        // ============================================

        document.addEventListener('keydown', (e) => {
            Game.keys[e.key] = true;

            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.handleInput(e.key);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.handleInput(e.key);
            } else if (Game.state === GameStates.PLAYING) {
                // Jump
                if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    GameScene.handleJump();
                }

                // Attack
                if (e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    GameScene.handleAttack();
                }

                // PARTE 5: Special Ability
                if (e.key === 'x' || e.key === 'X') {
                    e.preventDefault();
                    GameScene.handleSpecialAbility();
                }

                // Pause
                if (e.key === 'Escape') {
                    Game.state = GameStates.PAUSED;
                    showNotification('⏸️ Pausado', 'Presiona ESC para continuar');
                }
            } else if (Game.state === GameStates.PAUSED) {
                if (e.key === 'Escape') {
                    Game.state = GameStates.PLAYING;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            Game.keys[e.key] = false;
        });

        // Mouse input for character selection
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.handleClick(x, y);
            }
        });

        // ============================================
        // GAME LOOP
        // ============================================

        function gameLoop(timestamp) {
            // Calculate delta time
            if (!Game.lastFrameTime) Game.lastFrameTime = timestamp;
            Game.deltaTime = (timestamp - Game.lastFrameTime) / 1000;
            Game.lastFrameTime = timestamp;

            // Update
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.update(Game.deltaTime);
            }

            // Draw
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.draw();
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.draw();
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.draw();
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            // Simulate loading
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);

                    // Hide loading screen
                    setTimeout(() => {
                        document.getElementById('loadingScreen').classList.add('hidden');

                        // Initialize main menu
                        Game.state = GameStates.MAIN_MENU;
                        MainMenuScene.init();

                        // Start game loop
                        requestAnimationFrame(gameLoop);

                        showNotification(
                            '🌟 Bienvenido',
                            'Tu viaje de esperanza está a punto de comenzar'
                        );
                    }, 500);
                }
                document.getElementById('loadingBar').style.width = progress + '%';
            }, 100);
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
