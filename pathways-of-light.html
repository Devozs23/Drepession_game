<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathways of Light - Professional Therapeutic Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: #000;
        }

        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: linear-gradient(to bottom, #1a1a2e, #16213e);
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
        }

        /* Loading Screen */
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loadingScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .loading-title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        .loading-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .loading-bar-container {
            width: 400px;
            height: 8px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
        }

        .loading-bar {
            height: 100%;
            background: linear-gradient(90deg, #fff, #fbbf24, #f97316);
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.6), 0 0 40px rgba(251, 191, 36, 0.3);
            animation: shimmer 2s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* Particle Background */
        .bg-particle {
            position: fixed;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.8), transparent);
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* UI Overlay */
        #ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.5);
            padding: 15px 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }

        .hud-stat {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stat-bar {
            width: 150px;
            height: 20px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .stat-fill {
            height: 100%;
            transition: width 0.3s ease;
            border-radius: 8px;
        }

        .health-fill { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .energy-fill { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .xp-fill { background: linear-gradient(90deg, #fbbf24, #f59e0b); }

        /* Notification System */
        .notification {
            position: fixed;
            top: 100px;
            right: 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            color: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.2);
            animation: slideInRight 0.5s ease, slideOutRight 0.5s ease 3.5s;
            z-index: 200;
            pointer-events: auto;
            max-width: 400px;
        }

        .notification-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .notification-text {
            font-size: 14px;
            opacity: 0.9;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(500px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(500px);
                opacity: 0;
            }
        }

        /* Button Styles */
        .game-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            pointer-events: auto;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .game-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .game-button:active {
            transform: translateY(0);
        }

        /* Modal/Dialog */
        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(26, 26, 46, 0.98), rgba(22, 33, 62, 0.98));
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(102, 126, 234, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            z-index: 300;
            min-width: 400px;
            color: white;
            pointer-events: auto;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 250;
            pointer-events: auto;
        }

        .modal-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }
    </style>

    <!-- Solana Web3.js Library -->
    <script src="https://unpkg.com/@solana/web3.js@latest/lib/index.iife.min.js"></script>
</head>
<body>

            <div class="loading-bar-container">
                <div class="loading-bar" id="loadingBar"></div>
            </div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas" width="1280" height="720"></canvas>

    <!-- UI Overlay -->

                { id: 'courage', name: 'Courage', color: '#ef4444', icon: '💪', effect: 'damage_boost', multiplier: 1.8, duration: 300 },

            // PART 11: Unique Boss Defeat Messages - NEVER REPEAT! 💙

                    "Every step forward is a victory over yesterday's pain",
                    "The past tried to hold you, but you chose to grow"
                ],
                'duda_suprema': [
                    "Your courage silenced the voice of doubt",
                    "Belief in yourself is stronger than any uncertainty",
                    "You trusted your strength when it mattered most"
                ],
                'darkness_total': [
                    "Light always finds a way through the deepest dark",
                    "You faced the abyss and emerged victorious",
                    "Hope is unbreakable when you protect it"
                ]
            },
            bossMessagesUsed: {}, // Track used messages per boss

            // General motivational quotes (for other achievements)
            motivationalQuotes: [
                "Depression doesn't define you. It's something you experience, not who you are",
                "The first step toward healing is admitting you need help - that's courage, not weakness",
                "It's okay to not be okay. What matters is you don't stay alone in that dark place",
                "Recovery is a process, not an event. Be patient with yourself",
                "Your thoughts aren't facts. Depression lies. You're worth more than it says",
                "Every day you choose to move forward is a victory, no matter how small it seems",
                "You don't have to be positive all the time. It's okay to feel all your emotions",
                "Hope is the only thing stronger than fear",
                "Your story doesn't end here. A semicolon represents a pause, not an ending",
                "Asking for help isn't giving up - it's refusing to give up",
                "Sometimes the bravest act is simply getting out of bed. And that's enough",
                "Healing isn't linear. There will be good days and bad days - both are part of the process",
                "You're not broken. You're healing. And that takes time",
                "Your worth doesn't decrease by someone's inability to see your value",
                "Storms don't last forever. This is just one chapter, not your whole story"

            // Performance
            fps: 60,
            frameCount: 0

        // ============================================
        // SAVE SYSTEM
        // ============================================

        function saveGame() {
            const saveData = {
                ...Game.saveData,
                savedAt: Date.now(),
                playtime: Game.saveData.playtime
            };
            localStorage.setItem('pathwaysOfLight_save', JSON.stringify(saveData));
            showNotification('💾 Progress Saved', 'Your adventure has been saved successfully');
        }

        function loadGame() {
            const saved = localStorage.getItem('pathwaysOfLight_save');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    Game.saveData = { ...Game.saveData, ...data };
                    return true;
                } catch (e) {
                    console.error('Error loading save:', e);
                    return false;
                }
            }
            return false;
        }

        function deleteSave() {
            localStorage.removeItem('pathwaysOfLight_save');
        }

        // ============================================
        // NOTIFICATION SYSTEM
        // ============================================

        function showNotification(title, text, duration = 4000) {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.innerHTML = `
                <div class="notification-title">${title}</div>
                <div class="notification-text">${text}</div>
            `;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), duration);
        }

        // ============================================
        // MODAL SYSTEM
        // ============================================

        function showModal(title, content, buttons = []) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';

            const modal = document.createElement('div');
            modal.className = 'modal';
            modal.innerHTML = `
                <div class="modal-title">${title}</div>
                <div class="modal-content">${content}</div>
                <div class="modal-buttons"></div>
            `;

            const buttonContainer = modal.querySelector('.modal-buttons');
            buttons.forEach(btn => {
                const button = document.createElement('button');
                button.className = 'game-button';
                button.textContent = btn.text;
                button.onclick = () => {
                    btn.onClick();
                    overlay.remove();
                    modal.remove();
                };
                buttonContainer.appendChild(button);
            });

            document.body.appendChild(overlay);
            document.body.appendChild(modal);
        }

        // ============================================
        // MAIN MENU SCENE
        // ============================================

        const MainMenuScene = {
            particles: [],
            stars: [],
            title: 'Pathways of Light',
            subtitle: 'A Journey of Inner Healing',
            menuItems: [
                { text: '🎮 New Adventure', action: 'newGame' },
                { text: '📂 Continue', action: 'continue' },
                { text: '⚙️ Options', action: 'options' },
                { text: '🏆 Achievements', action: 'achievements' },
                { text: 'ℹ️ Credits', action: 'credits' }
            ],
            selectedIndex: 0,
            time: 0,

            init() {
                // Create background stars
                for (let i = 0; i < 100; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.1,
                        opacity: Math.random()
                    });
                }

                // Create floating particles
                for (let i = 0; i < 50; i++) {
                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 4 + 2,
                        speedX: (Math.random() - 0.5) * 2,
                        speedY: Math.random() * -1 - 0.5,
                        hue: Math.random() * 60 + 200, // Purple/blue hues
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }

                // Check if save exists
                if (loadGame()) {
                    this.menuItems[1].text = '📂 Continue (Level ' + Game.saveData.level + ')';
                } else {
                    this.menuItems[1].disabled = true;
                }
            },

            update(dt) {
                this.time += dt;

                // Update stars
                this.stars.forEach(star => {
                    star.y += star.speed;
                    if (star.y > canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * canvas.width;
                    }
                    star.opacity = 0.3 + Math.sin(this.time * 2 + star.x) * 0.3;
                });

                // Update particles
                this.particles.forEach(particle => {
                    particle.x += particle.speedX;
                    particle.y += particle.speedY;

                    if (particle.y < -10) {
                        particle.y = canvas.height + 10;
                        particle.x = Math.random() * canvas.width;
                    }
                    if (particle.x < -10) particle.x = canvas.width + 10;
                    if (particle.x > canvas.width + 10) particle.x = -10;

                    particle.opacity = 0.3 + Math.sin(this.time * 3 + particle.x * 0.01) * 0.2;
                });
            },

            draw() {
                // Background gradient
                const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                gradient.addColorStop(0, '#0f0c29');
                gradient.addColorStop(0.5, '#302b63');
                gradient.addColorStop(1, '#24243e');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw stars
                this.stars.forEach(star => {
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });

                // Draw particles
                this.particles.forEach(particle => {
                    ctx.save();
                    ctx.globalAlpha = particle.opacity;
                    ctx.fillStyle = `hsl(${particle.hue}, 70%, 60%)`;
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                // Draw title with glow effect
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 30;
                ctx.font = 'bold 72px Arial';
                ctx.textAlign = 'center';
                const titleGradient = ctx.createLinearGradient(0, 100, 0, 180);
                titleGradient.addColorStop(0, '#fff');
                titleGradient.addColorStop(1, '#667eea');
                ctx.fillStyle = titleGradient;
                ctx.fillText(this.title, canvas.width / 2, 150);
                ctx.restore();

                // Draw subtitle
                ctx.font = '24px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.textAlign = 'center';
                ctx.fillText(this.subtitle, canvas.width / 2, 200);

                // Draw menu items
                const startY = 300;
                const spacing = 70;

                this.menuItems.forEach((item, index) => {
                    const y = startY + index * spacing;
                    const isSelected = index === this.selectedIndex;
                    const isDisabled = item.disabled;

                    // Menu item background
                    if (isSelected) {
                        ctx.save();
                        ctx.shadowColor = '#667eea';
                        ctx.shadowBlur = 20;
                        const itemGradient = ctx.createLinearGradient(
                            canvas.width / 2 - 250, y - 25,
                            canvas.width / 2 + 250, y + 25
                        );
                        itemGradient.addColorStop(0, 'rgba(102, 126, 234, 0.3)');
                        itemGradient.addColorStop(0.5, 'rgba(118, 75, 162, 0.5)');
                        itemGradient.addColorStop(1, 'rgba(102, 126, 234, 0.3)');
                        ctx.fillStyle = itemGradient;
                        ctx.fillRect(canvas.width / 2 - 250, y - 25, 500, 50);
                        ctx.restore();
                    }

                    // Menu item text
                    ctx.font = isSelected ? 'bold 32px Arial' : '28px Arial';
                    ctx.fillStyle = isDisabled ? 'rgba(255, 255, 255, 0.3)' :
                                   isSelected ? '#fff' : 'rgba(255, 255, 255, 0.7)';
                    ctx.textAlign = 'center';
                    ctx.fillText(item.text, canvas.width / 2, y + 10);

                    // Selection indicator
                    if (isSelected && !isDisabled) {
                        const pulseSize = 5 + Math.sin(this.time * 5) * 2;
                        ctx.fillStyle = '#fbbf24';
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 - 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(canvas.width / 2 + 270, y, pulseSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Draw controls hint
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
                ctx.textAlign = 'center';
                ctx.fillText('↑↓ Navegar  |  ENTER Select  |  ESC Exit', canvas.width / 2, canvas.height - 30);
            },

            handleInput(key) {
                if (key === 'ArrowUp') {
                    do {
                        this.selectedIndex = (this.selectedIndex - 1 + this.menuItems.length) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'ArrowDown') {
                    do {
                        this.selectedIndex = (this.selectedIndex + 1) % this.menuItems.length;
                    } while (this.menuItems[this.selectedIndex].disabled);
                    playSound('menu_move');
                }

                if (key === 'Enter') {
                    const selected = this.menuItems[this.selectedIndex];
                    if (!selected.disabled) {
                        playSound('menu_select');
                        this.executeAction(selected.action);
                    }
                }
            },

        // AUDIO SYSTEM

        function initAudio() {
            Game.audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(type) {
            if (!Game.audioContext) initAudio();

            const now = Game.audioContext.currentTime;
            const osc = Game.audioContext.createOscillator();
            const gain = Game.audioContext.createGain();

            osc.connect(gain);
            gain.connect(Game.audioContext.destination);

            switch (type) {
                case 'menu_move':
                    osc.frequency.value = 400;
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'menu_select':
                    osc.frequency.value = 600;
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;

                case 'jump':
                    osc.frequency.value = 300;
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'coin':
                    osc.frequency.value = 800;
                    osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'damage':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 200;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;

                case 'attack':
                    osc.type = 'square';
                    osc.frequency.value = 150;
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.1);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;

                case 'hit':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 300;
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;

                case 'enemy_death':
                    osc.type = 'sawtooth';
                    osc.frequency.value = 400;
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.5);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;

                case 'levelup':
                    // Triumphant ascending sound
                    const freq1 = 440;
                    const freq2 = 550;
                    const freq3 = 660;

                    [freq1, freq2, freq3].forEach((freq, i) => {
                        const tempOsc = Game.audioContext.createOscillator();
                        const tempGain = Game.audioContext.createGain();
                        tempOsc.connect(tempGain);
                        tempGain.connect(Game.audioContext.destination);

                        tempOsc.frequency.value = freq;
                        tempGain.gain.setValueAtTime(0, now + i * 0.1);
                        tempGain.gain.linearRampToValueAtTime(0.15, now + i * 0.1 + 0.05);
                        tempGain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);

                        tempOsc.start(now + i * 0.1);
                        tempOsc.stop(now + i * 0.1 + 0.3);
                    });
                    return; // Don't use the main oscillator
            }
        }

        const SolanaPayment = {
            // Recipient wallet address
            RECIPIENT_WALLET: 'az62CTg4Gm7YtSxrDVvm9z9ow1j7d8mVwW4cXvdQtN3',

            // Network configuration
            NETWORK: 'mainnet-beta', // Use 'devnet' for testing

            // State
            connection: null,
            walletAddress: null,

            // Initialize connection
            init() {
                try {
                    const endpoint = this.NETWORK === 'mainnet-beta'
                        ? 'https://api.mainnet-beta.solana.com'
                        : 'https://api.devnet.solana.com';

                    this.connection = new solanaWeb3.Connection(endpoint, 'confirmed');
                    console.log('✅ Solana connection initialized');
                } catch (error) {
                    console.error('❌ Failed to initialize Solana:', error);
                }
            },

            // Connect Phantom Wallet
            async connectWallet() {
                try {
                    if (!window.solana || !window.solana.isPhantom) {
                        showNotification('Please install Phantom Wallet first!', 'error');
                        window.open('https://phantom.app/', '_blank');
                        return false;
                    }

                    const response = await window.solana.connect();
                    this.walletAddress = response.publicKey.toString();

                    console.log('✅ Wallet connected:', this.walletAddress);
                    showNotification(`Wallet connected: ${this.walletAddress.substring(0, 8)}...`, 'success');
                    return true;
                } catch (error) {
                    console.error('❌ Error connecting wallet:', error);
                    showNotification('Failed to connect wallet: ' + error.message, 'error');
                    return false;
                }
            },

            // Disconnect wallet
            async disconnectWallet() {
                try {
                    if (window.solana) {
                        await window.solana.disconnect();
                        this.walletAddress = null;
                        console.log('Wallet disconnected');
                    }
                } catch (error) {
                    console.error('Error disconnecting:', error);
                }
            },

            // Purchase lives with SOL
            async purchaseLives(lives, priceSOL) {
                try {
                    if (!this.walletAddress) {
                        throw new Error('Wallet not connected');
                    }

                    showNotification('Processing payment...', 'info');

                    // Convert SOL to lamports
                    const lamports = Math.floor(priceSOL * solanaWeb3.LAMPORTS_PER_SOL);

                    // Create transaction
                    const transaction = new solanaWeb3.Transaction().add(
                        solanaWeb3.SystemProgram.transfer({
                            fromPubkey: new solanaWeb3.PublicKey(this.walletAddress),
                            toPubkey: new solanaWeb3.PublicKey(this.RECIPIENT_WALLET),
                            lamports: lamports
                        })
                    );

                    // Get recent blockhash
                    const { blockhash } = await this.connection.getLatestBlockhash();
                    transaction.recentBlockhash = blockhash;
                    transaction.feePayer = new solanaWeb3.PublicKey(this.walletAddress);

                    // Sign and send transaction
                    const signed = await window.solana.signAndSendTransaction(transaction);

                    // Wait for confirmation
                    const confirmation = await this.connection.confirmTransaction(
                        signed.signature,
                        'confirmed'
                    );

                    if (confirmation.value.err) {
                        throw new Error('Transaction failed');
                    }

                    console.log('✅ Transaction successful:', signed.signature);

                    return {
                        success: true,
                        signature: signed.signature,
                        lives: lives
                    };

                } catch (error) {
                    console.error('❌ Payment error:', error);
                    return {
                        success: false,
                        error: error.message || 'Unknown error'
                    };
                }
            },

            // Get wallet balance
            async getBalance() {
                try {
                    if (!this.walletAddress) return 0;

                    const balance = await this.connection.getBalance(
                        new solanaWeb3.PublicKey(this.walletAddress)
                    );

                    return balance / solanaWeb3.LAMPORTS_PER_SOL;
                } catch (error) {
                    console.error('Error getting balance:', error);
                    return 0;
                }
            }
        };

            init() {
                this.time = 0;

                // Create character particles

                    this.particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,

                    });

            update(dt) {
                this.time += dt;

                    p.y += p.speedY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                bgGradient.addColorStop(0, '#1a1a2e');
                bgGradient.addColorStop(1, '#16213e');
                ctx.fillStyle = bgGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Particles
                this.particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = p.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.restore();

                        ctx.translate(-(x + charWidth/2), -(y + charHeight/2));

                    ctx.strokeStyle = isSelected ? char.color : 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = isSelected ? 4 : 2;
                    ctx.strokeRect(x, y, charWidth, charHeight);
                    ctx.restore();

                    // Draw character sprite
                    this.drawCharacter(x + charWidth/2, y + 150, char, isSelected);

                    // Character name
                    ctx.font = 'bold 36px Arial';
                    ctx.fillStyle = isSelected ? char.color : '#fff';
                    ctx.textAlign = 'center';
                    ctx.fillText(char.name, x + charWidth/2, y + 250);

                    // Character title
                    ctx.font = '20px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.fillText(char.title, x + charWidth/2, y + 280);

                    // Description
                    ctx.font = '16px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    const words = char.description.split(' ');
                    let line = '';
                    let lineY = y + 320;
                    words.forEach(word => {
                        const testLine = line + word + ' ';
                        const metrics = ctx.measureText(testLine);
                        if (metrics.width > charWidth - 40) {
                            ctx.fillText(line, x + charWidth/2, lineY);
                            line = word + ' ';
                            lineY += 20;
                        } else {
                            line = testLine;
                        }
                    });
                    ctx.fillText(line, x + charWidth/2, lineY);

                    // Stats
                    const statsY = y + 380;
                    const statsList = [
                        { name: '❤️', value: char.stats.health, max: 120 },
                        { name: '⚡', value: char.stats.energy, max: 100 },
                        { name: '🏃', value: char.stats.speed, max: 100 },
                        { name: '💪', value: char.stats.strength, max: 100 }
                    ];

                    statsList.forEach((stat, i) => {
                        const statY = statsY + i * 25;
                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'left';
                        ctx.fillText(stat.name, x + 20, statY);

                        // Stat bar
                        const barX = x + 50;
                        const barWidth = charWidth - 70;
                        const barHeight = 12;

                        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                        ctx.fillRect(barX, statY - 10, barWidth, barHeight);

                        const fillWidth = (stat.value / stat.max) * barWidth;
                        const statGradient = ctx.createLinearGradient(barX, 0, barX + fillWidth, 0);
                        statGradient.addColorStop(0, char.color);
                        statGradient.addColorStop(1, char.color + 'aa');
                        ctx.fillStyle = statGradient;
                        ctx.fillRect(barX, statY - 10, fillWidth, barHeight);
                    });

                    // Selection indicator
                    if (isSelected) {
                        const indicatorY = y - 30;
                        const indicatorSize = 8 + Math.sin(this.time * 5) * 3;
                        ctx.fillStyle = char.color;
                        ctx.beginPath();
                        ctx.arc(x + charWidth/2, indicatorY, indicatorSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // Instructions (más prominentes)
                ctx.save();
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 10;
                ctx.font = 'bold 24px Arial';
                ctx.fillStyle = '#fbbf24';
                ctx.textAlign = 'center';
                ctx.fillText('← → Select  |  ENTER o CLICK para Confirmar', canvas.width / 2, canvas.height - 40);
                ctx.restore();

                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                ctx.fillText('ESC para volver al menú', canvas.width / 2, canvas.height - 15);
            },

            drawCharacter(x, y, char, isSelected) {
                const scale = isSelected ? 1.1 : 1;
                const bounce = Math.sin(this.time * 2) * 5;

                ctx.save();
                ctx.translate(x, y + bounce);
                ctx.scale(scale, scale);

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(0, 35, 20, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.fillStyle = char.color;
                ctx.fillRect(-15, 0, 30, 40);

                // Head
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(0, -10, 18, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (char.id === 'luna') {
                    // Long hair for Luna
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(-8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(8, -10, 12, 0, Math.PI * 2);
                    ctx.arc(0, -15, 15, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Short hair for Sol
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(0, -15, 15, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(-6, -8, 2, 0, Math.PI * 2);
                ctx.arc(6, -8, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -5, 8, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms
                ctx.fillStyle = '#FFD1B3';
                ctx.fillRect(-25, 5, 10, 20);
                ctx.fillRect(15, 5, 10, 20);

                // Legs
                ctx.fillStyle = char.color;
                ctx.fillRect(-12, 40, 10, 25);
                ctx.fillRect(2, 40, 10, 25);

                // Shoes
                ctx.fillStyle = '#333';
                ctx.fillRect(-12, 63, 10, 6);
                ctx.fillRect(2, 63, 10, 6);

                ctx.restore();
            },

            handleInput(key) {
                if (key === 'ArrowLeft') {
                    this.selectedIndex = (this.selectedIndex - 1 + this.characters.length) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'ArrowRight') {
                    this.selectedIndex = (this.selectedIndex + 1) % this.characters.length;
                    playSound('menu_move');
                }

                if (key === 'Enter' || key === ' ') {
                    this.selectCharacter();
                }

                if (key === 'Escape') {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }
            },

            selectCharacter() {
                const selected = this.characters[this.selectedIndex];
                Game.saveData.character = selected.id;
                Game.saveData.stats.maxHealth = selected.stats.health;
                Game.saveData.stats.maxEnergy = selected.stats.energy;
                Game.saveData.stats.speed = selected.stats.speed;
                Game.saveData.stats.strength = selected.stats.strength;

                playSound('menu_select');
                saveGame();
                showNotification(
                    `${selected.name} Selected!`,
                    `Starting your adventure as ${selected.title}`
                );

                setTimeout(() => {
                    startGame();
                }, 1000);
            },

            handleClick(x, y) {
                const charWidth = 400;
                const charHeight = 500;
                const spacing = 100;
                const startX = (canvas.width - (charWidth * 2 + spacing)) / 2;
                const startY = 150;

                this.characters.forEach((char, index) => {
                    const charX = startX + index * (charWidth + spacing);
                    const charY = startY;

                    if (x >= charX && x <= charX + charWidth &&
                        y >= charY && y <= charY + charHeight) {
                        this.selectedIndex = index;
                        playSound('menu_move');
                        // Double click or immediate selection
                        this.selectCharacter();
                    }
                });
            }
        };

            // PART 9: Initialize Music System
            initMusicSystem() {
                try {
                    const MS = Game.musicSystem;
                    MS.audioContext = new (window.AudioContext || window.webkitAudioContext)();

                    // Create master gain
                    MS.masterGain = MS.audioContext.createGain();
                    MS.masterGain.gain.value = 0.3;
                    MS.masterGain.connect(MS.audioContext.destination);

                    // Create separate gains for each layer
                    MS.bassGain = MS.audioContext.createGain();
                    MS.bassGain.gain.value = 0;
                    MS.bassGain.connect(MS.masterGain);

                    MS.melodyGain = MS.audioContext.createGain();
                    MS.melodyGain.gain.value = 0;
                    MS.melodyGain.connect(MS.masterGain);

                    MS.drumGain = MS.audioContext.createGain();
                    MS.drumGain.gain.value = 0;
                    MS.drumGain.connect(MS.masterGain);

                    MS.padGain = MS.audioContext.createGain();
                    MS.padGain.gain.value = 0;
                    MS.padGain.connect(MS.masterGain);

                    // Start with just pads (ambient)
                    MS.layers.pads = true;
                    this.fadeInLayer('pads', 0.15, 2);

                    console.log('🎵 Generative Music System initialized!');
                } catch (e) {
                    console.log('Audio not supported:', e);
                }
            },

            // PART 9: Play note on jump
            playJumpNote(velocity) {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const scale = MS.scales[MS.currentScale];
                const noteIndex = Math.min(Math.floor(velocity / 3), scale.length - 1);
                const semitone = scale[noteIndex];
                const freq = MS.baseFreq * Math.pow(2, semitone / 12);

                // Create oscillator for melody
                const osc = MS.audioContext.createOscillator();
                const gain = MS.audioContext.createGain();

                osc.type = 'triangle';
                osc.frequency.value = freq;

                gain.gain.value = 0;
                gain.gain.linearRampToValueAtTime(0.15, MS.audioContext.currentTime + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 0.3);

                osc.connect(gain);
                gain.connect(MS.melodyGain);

                osc.start(MS.audioContext.currentTime);
                osc.stop(MS.audioContext.currentTime + 0.3);

                // Add to recent notes for arpeggiator
                MS.recentNotes.push(freq);
                if (MS.recentNotes.length > 4) MS.recentNotes.shift();
            },

            // PART 9: Play kick drum
            playKick() {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const osc = MS.audioContext.createOscillator();
                const gain = MS.audioContext.createGain();

                osc.frequency.value = 55; // Low A
                osc.frequency.exponentialRampToValueAtTime(30, MS.audioContext.currentTime + 0.1);

                gain.gain.value = 1;
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(MS.drumGain);

                osc.start(MS.audioContext.currentTime);
                osc.stop(MS.audioContext.currentTime + 0.4);
            },

            // PART 9: Play snare
            playSnare() {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const noise = MS.audioContext.createBufferSource();
                const buffer = MS.audioContext.createBuffer(1, MS.audioContext.sampleRate * 0.2, MS.audioContext.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                noise.buffer = buffer;

                const filter = MS.audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 2000;

                const gain = MS.audioContext.createGain();
                gain.gain.value = 0.5;
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(MS.drumGain);

                noise.start(MS.audioContext.currentTime);
                noise.stop(MS.audioContext.currentTime + 0.15);
            },

            // PART 9: Play hihat
            playHihat() {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const noise = MS.audioContext.createBufferSource();
                const buffer = MS.audioContext.createBuffer(1, MS.audioContext.sampleRate * 0.05, MS.audioContext.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                noise.buffer = buffer;

                const filter = MS.audioContext.createBiquadFilter();
                filter.type = 'highpass';
                filter.frequency.value = 8000;

                const gain = MS.audioContext.createGain();
                gain.gain.value = 0.3;
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 0.05);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(MS.drumGain);

                noise.start(MS.audioContext.currentTime);
                noise.stop(MS.audioContext.currentTime + 0.05);
            },

            // PART 9: Play bass note
            playBass(freq) {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const osc = MS.audioContext.createOscillator();
                const gain = MS.audioContext.createGain();

                osc.type = 'sawtooth';
                osc.frequency.value = freq / 2; // One octave lower

                gain.gain.value = 0;
                gain.gain.linearRampToValueAtTime(0.2, MS.audioContext.currentTime + 0.01);
                gain.gain.linearRampToValueAtTime(0.1, MS.audioContext.currentTime + 0.2);
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 0.4);

                osc.connect(gain);
                gain.connect(MS.bassGain);

                osc.start(MS.audioContext.currentTime);
                osc.stop(MS.audioContext.currentTime + 0.4);
            },

            // PART 9: Epic drop effect
            playEpicDrop() {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                // Sweep down
                const osc = MS.audioContext.createOscillator();
                const gain = MS.audioContext.createGain();

                osc.type = 'sawtooth';
                osc.frequency.value = 1000;
                osc.frequency.exponentialRampToValueAtTime(50, MS.audioContext.currentTime + 1.5);

                gain.gain.value = 0.4;
                gain.gain.exponentialRampToValueAtTime(0.001, MS.audioContext.currentTime + 1.5);

                osc.connect(gain);
                gain.connect(MS.masterGain);

                osc.start(MS.audioContext.currentTime);
                osc.stop(MS.audioContext.currentTime + 1.5);

                // Trigger all layers
                this.fadeInLayer('bass', 0.25, 0.5);
                this.fadeInLayer('drums', 0.6, 0.5);
                this.fadeInLayer('melody', 0.3, 0.5);
            },

            // PART 9: Fade in a musical layer
            fadeInLayer(layer, targetVolume, duration) {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                MS.layers[layer] = true;

                const gain = layer === 'bass' ? MS.bassGain :
                             layer === 'melody' ? MS.melodyGain :
                             layer === 'drums' ? MS.drumGain :
                             MS.padGain;

                gain.gain.cancelScheduledValues(MS.audioContext.currentTime);
                gain.gain.setValueAtTime(gain.gain.value, MS.audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(targetVolume, MS.audioContext.currentTime + duration);
            },

            // PART 9: Fade out a musical layer
            fadeOutLayer(layer, duration) {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const gain = layer === 'bass' ? MS.bassGain :
                             layer === 'melody' ? MS.melodyGain :
                             layer === 'drums' ? MS.drumGain :
                             MS.padGain;

                gain.gain.cancelScheduledValues(MS.audioContext.currentTime);
                gain.gain.setValueAtTime(gain.gain.value, MS.audioContext.currentTime);
                gain.gain.linearRampToValueAtTime(0, MS.audioContext.currentTime + duration);

                setTimeout(() => {
                    MS.layers[layer] = false;
                }, duration * 1000);
            },

            // PART 9: Update music based on gameplay
            updateMusicSystem(dt) {
                const MS = Game.musicSystem;
                if (!MS.audioContext) return;

                const p = Game.player;

                // Calculate music intensity from gameplay
                const comboIntensity = Math.min(p.combo / 10, 0.4);
                const healthIntensity = (1 - p.health / Game.saveData.stats.maxHealth) * 0.3;
                const progressIntensity = Game.worldProgress * 0.3;

                MS.intensity = Math.min(comboIntensity + progressIntensity + healthIntensity, 1);

                // Add drums when intensity rises
                if (MS.intensity > 0.2 && !MS.layers.drums) {
                    this.fadeInLayer('drums', 0.4, 2);
                }

                // Add melody when comboing
                if (p.combo >= 3 && !MS.layers.melody) {
                    this.fadeInLayer('melody', 0.25, 1);
                }

                // Add bass when high intensity
                if (MS.intensity > 0.5 && !MS.layers.bass) {
                    this.fadeInLayer('bass', 0.2, 2);
                }

                // Change scale based on emotional state
                if (Game.inDreamWorld) {
                    MS.currentScale = 'dream';
                } else if (p.health < 30) {
                    MS.currentScale = 'minor';
                } else {
                    MS.currentScale = 'major';
                }

                // Procedural drums
                const beatDuration = (60 / MS.bpm) * 1000; // ms per beat
                if (MS.layers.drums && Date.now() - MS.lastBeatTime > beatDuration) {
                    MS.lastBeatTime = Date.now();

                    if (MS.kickPattern[MS.beatIndex]) this.playKick();
                    if (MS.snarePattern[MS.beatIndex]) this.playSnare();
                    if (MS.hihatPattern[MS.beatIndex]) this.playHihat();

                    // Bass on kicks
                    if (MS.layers.bass && MS.kickPattern[MS.beatIndex] && MS.recentNotes.length > 0) {
                        const bassNote = MS.recentNotes[0];
                        this.playBass(bassNote);
                    }

                    MS.beatIndex = (MS.beatIndex + 1) % 8;
                }
            },

            // PART 10: Update wind system
            updateWind(dt) {
                if (!dt || dt > 1) return; // BUGFIX: Prevenir dt inválido o muy grande

                const wind = Game.wind;

                // Increment timer
                wind.timer += dt;

                // Random wind gusts
                if (!wind.active && wind.timer >= wind.nextWindTime) {
                    wind.active = true;
                    wind.strength = Math.random() * 0.3 + 0.2; // 0.2-0.5
                    wind.direction = Math.random() < 0.5 ? -1 : 1;
                    wind.timer = 0;

                    // BUGFIX: Usar try-catch para notificación
                    try {
                        if (typeof showNotification === 'function') {
                            showNotification('🌪️ ¡Viento!', wind.direction > 0 ? 'Viento →' : 'Viento ←', 2000);
                        }
                    } catch (e) {
                        console.log('Wind notification error:', e);
                    }
                } else if (wind.active && wind.timer >= 3) { // Wind lasts 3 seconds
                    wind.active = false;
                    wind.timer = 0;
                    wind.nextWindTime = Math.random() * 10 + 5; // Next wind in 5-15 seconds
                }
            },

            // PART 10: Update parkour combo system
            updateParkourCombo(dt) {
                if (!dt || dt > 1) return; // BUGFIX: Prevenir dt inválido

                const combo = Game.parkourCombo;

                // Decrease timer
                if (combo.timer > 0) {
                    combo.timer -= dt;
                    if (combo.timer < 0) combo.timer = 0; // BUGFIX: No permitir timer negativo
                }

                // Reset combo if timer runs out
                if (combo.timer <= 0 && combo.count > 0) {
                    combo.count = 0;
                    combo.lastPlatform = null;
                    combo.bonusMultiplier = 1;
                }

                // Update bonus multiplier based on combo
                if (combo.count >= 10) combo.bonusMultiplier = 3;
                else if (combo.count >= 5) combo.bonusMultiplier = 2;
                else combo.bonusMultiplier = 1;
            },

            // PART 11: Update weather system 🌧️❄️⛈️
            updateWeather(dt) {
                if (!dt || dt > 1) return;

                const weather = Game.weather;
                weather.timer += dt;

                // Change weather periodically
                if (weather.timer >= weather.nextChangeTime) {
                    weather.timer = 0;
                    weather.nextChangeTime = Math.random() * 30 + 30; // 30-60 segundos

                    const weathers = ['clear', 'rain', 'snow', 'fog', 'aurora']; // BUGFIX: Removido 'storm' que causaba bugs
                    const newWeather = weathers[Math.floor(Math.random() * weathers.length)];

                    if (newWeather !== weather.current) {
                        weather.current = newWeather;
                        weather.intensity = 0;

                        try {
                            if (typeof showNotification === 'function') {
                                const messages = {
                                    rain: ['🌧️ Lluvia', 'Las plataformas están resbalosas'],
                                    snow: ['❄️ Nieve', 'El frío reduce tu velocidad'],
                                    fog: ['🌫️ Niebla', 'Visibilidad reducida'],
                                    aurora: ['🌌 Aurora Boreal', '¡Energy ilimitada!'],
                                    clear: ['☀️ Despejado', 'Clima perfecto']
                                };
                                const msg = messages[newWeather];
                                showNotification(msg[0], msg[1], 3000);
                            }
                        } catch (e) {}
                    }
                }

                // Gradual intensity change
                if (weather.current !== 'clear') {
                    weather.intensity = Math.min(weather.intensity + dt * 0.1, 1);
                } else {
                    weather.intensity = Math.max(weather.intensity - dt * 0.2, 0);
                }

                // BUGFIX: Limitar cantidad de partículas antes de generar
                if (weather.particles.length > 150) {
                    weather.particles.splice(0, 50); // Remove oldest 50
                }

                // Generate weather particles (OPTIMIZADO: menos frecuencia)
                if (weather.current === 'rain' && Math.random() < weather.intensity * 0.3 && weather.particles.length < 100) {
                    weather.particles.push({
                        x: Math.random() * canvas.width + Game.camera.x,
                        y: Game.camera.y - 10,
                        vx: -2,
                        vy: 15 + Math.random() * 5,
                        life: 2,
                        color: '#60a5fa',
                        type: 'rain'
                    });
                } else if (weather.current === 'snow' && Math.random() < weather.intensity * 0.2 && weather.particles.length < 80) {
                    weather.particles.push({
                        x: Math.random() * canvas.width + Game.camera.x,
                        y: Game.camera.y - 10,
                        vx: (Math.random() - 0.5) * 2,
                        vy: 2 + Math.random() * 3,
                        life: 5,
                        color: '#ffffff',
                        type: 'snow',
                        size: Math.random() * 4 + 2
                    });
                }

                // Update weather particles
                for (let i = weather.particles.length - 1; i >= 0; i--) {
                    const p = weather.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= dt;

                    if (p.life <= 0 || p.y > canvas.height + Game.camera.y) {
                        weather.particles.splice(i, 1);
                    }
                }

                // BUGFIX: Lightning code removed - was causing bugs

                // Weather effects on player
                const p = Game.player;
                if (weather.current === 'aurora') {
                    // Aurora gives infinite energy
                    p.energy = Math.min(p.energy + dt * 20, Game.saveData.stats.maxEnergy);
                } else if (weather.current === 'fog') {
                    // Fog is just visual, no effect on player
                }

                // BUGFIX: Ya se limitan arriba, este era redundante
            },

            transformPlayer(transformType) {
                const trans = Game.transformations;

                if (!trans.available.includes(transformType)) {

                            showNotification('🔒 Transformación Bloqueada', 'Completa más misiones para desbloquear', 2000);

                }

                if (trans.cooldown > 0) {
                    try {

                            showNotification('⏳ En Enfriamiento', `Espera ${Math.ceil(trans.cooldown)} segundos`, 2000);
                        }
                    } catch (e) {}
                    return;
                }

                trans.current = transformType;
                trans.timer = 10; // 10 segundos de transformación
                trans.cooldown = 20; // 20 segundos de cooldown

                const messages = {
                    shadow: ['👤 Forma Sombra', '¡Eres invisible!'],
                    light: ['💡 Forma Light', '¡Puedes volar!'],
                    giant: ['🗿 Forma Gigante', '¡Poder supremo!'],
                    speed: ['⚡ Forma Veloz', '¡Speed extrema!']
                };

                try {
                    if (typeof showNotification === 'function' && messages[transformType]) {
                        showNotification(messages[transformType][0], messages[transformType][1], 3000);
                    }
                } catch (e) {}

                // Visual effect
                try {
                    for (let i = 0; i < 50; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        Game.particles.push({
                            x: Game.player.x + Game.player.width / 2,
                            y: Game.player.y + Game.player.height / 2,
                            vx: Math.cos(angle) * 10,
                            vy: Math.sin(angle) * 10,

                        });
                    }

            updateTransformations(dt) {
                if (!dt || dt > 1) return;

                const trans = Game.transformations;

                // Decrease transformation timer
                if (trans.timer > 0) {
                    trans.timer -= dt;

                    if (trans.timer <= 0) {
                        trans.current = 'normal';
                        try {
                            if (typeof showNotification === 'function') {
                                showNotification('🔄 Transformación Terminada', 'Volviste a la normalidad', 2000);
                            }
                        } catch (e) {}
                    }
                }

                // Decrease cooldown
                if (trans.cooldown > 0) {
                    trans.cooldown -= dt;
                }

                // Apply transformation effects
                const p = Game.player;

                if (trans.current === 'shadow') {
                    // Invisible to enemies (reduce damage taken)
                    p.isInvulnerable = true;
                } else if (trans.current === 'light') {
                    // Can fly (reduce gravity)
                    if (Game.keys[' '] || Game.keys['w'] || Game.keys['W']) {
                        p.velocityY = Math.max(p.velocityY - 1, -10);
                    }
                } else if (trans.current === 'giant') {
                    // Increased damage and size
                    // Size handled in rendering
                } else if (trans.current === 'speed') {
                    // Extreme speed
                    // Speed handled in physics
                } else {
                    // Normal form
                    if (trans.current === 'normal') {
                        p.isInvulnerable = false;
                    }
                }
            },

            // BUGFIX PART 11: Update particle system (fix frame-rate dependent bug) 💫
            updateParticles(dt) {
                if (!dt || dt > 1) return; // Guard against invalid dt

                // OPTIMIZED: Reduced particle limit for better performance (500 -> 300)
                if (Game.particles.length > 300) {
                    Game.particles.splice(0, 150); // Remove oldest 150 particles
                }

                // Update particle positions and life
                for (let i = Game.particles.length - 1; i >= 0; i--) {
                    const p = Game.particles[i];

                    // Update position
                    p.x += p.vx * dt * 60; // Normalize for 60 FPS baseline
                    p.y += p.vy * dt * 60;

                    // BUGFIX: Decrease life by dt instead of fixed 0.02
                    p.life -= dt;

                    // Remove dead particles
                    if (p.life <= 0) {
                        Game.particles.splice(i, 1);
                    }
                }
