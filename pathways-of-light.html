            updatePlayerPhysics(dt) {
                const p = Game.player;
                let gravity = 0.8;
                let moveSpeed = 5 * (Game.saveData.stats.speed / 100);

                // PART 5: Apply speed buff
                const speedBuff = p.activeBuffs.find(b => b.type === 'speed');
                if (speedBuff) {
                    moveSpeed *= speedBuff.multiplier;
                }

                // PART 11: Apply transformation effects 🔮
                const trans = Game.transformations;
                if (trans.current === 'speed') {
                    moveSpeed *= 3; // Triple speed
                } else if (trans.current === 'giant') {
                    moveSpeed *= 0.7; // Slower but stronger
                } else if (trans.current === 'light') {
                    gravity *= 0.3; // Much lighter, can fly
                } else if (trans.current === 'shadow') {
                    // Shadow form doesn't affect speed
                }

                // PART 11: Weather effects on movement
                if (Game.weather.current === 'snow') {
                    moveSpeed *= 0.7; // Slower in snow
                } else if (Game.weather.current === 'storm') {
                    moveSpeed *= 0.85; // Slightly slower in storm
                }

                const jumpForce = -12; // Reducido de -15 para saltos más realistas

                // Horizontal movement - CON ACELERACIÓN REALISTA! 🏃
                const acceleration = 0.6; // Aceleración gradual
                const maxSpeed = moveSpeed; // Speed máxima

                if (Game.keys['ArrowLeft'] || Game.keys['a'] || Game.keys['A']) {
                    // Acelerar hacia la izquierda gradualmente
                    p.velocityX -= acceleration;
                    p.velocityX = Math.max(p.velocityX, -maxSpeed); // Limitar velocidad máxima
                    p.isFacingRight = false;
                } else if (Game.keys['ArrowRight'] || Game.keys['d'] || Game.keys['D']) {
                    // Acelerar hacia la derecha gradualmente
                    p.velocityX += acceleration;
                    p.velocityX = Math.min(p.velocityX, maxSpeed); // Limitar velocidad máxima
                    p.isFacingRight = true;
                } else {
                    // Fricción más fuerte para detenerse más rápido
                    p.velocityX *= 0.85;
                    // Detener completamente si la velocidad es muy baja
                    if (Math.abs(p.velocityX) < 0.1) p.velocityX = 0;
                }

                // Apply gravity
                // PART 13: Wall slide reduce gravedad 🧗
                if (p.isWallSliding && !p.isGroundPounding) {
                    p.velocityY += gravity * 0.2; // 20% de gravedad en pared
                    p.velocityY = Math.min(p.velocityY, 2); // Speed máxima de deslizamiento
                } else if (p.isGroundPounding) {
                    p.velocityY = p.groundPoundVelocity; // Caída rápida
                } else {
                    p.velocityY += gravity;
                }

                // PART 10: Apply wind effect
                if (Game.wind.active) {
                    p.velocityX += Game.wind.direction * Game.wind.strength;
                }

                // Apply velocity
                p.x += p.velocityX;
                p.y += p.velocityY;

                // PART 10: Parkour combo system
                if (!p.isGrounded) {
                    Game.parkourCombo.timeWithoutGround += dt;
                } else if (Game.parkourCombo.timeWithoutGround > 0) {
                    Game.parkourCombo.timeWithoutGround = 0;
                }

                // Check platform collisions
                // PART 13: Coyote time - dar buffer de 6 frames al dejar el suelo
                const wasGrounded = p.isGrounded;
                p.isGrounded = false;
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    // PART 10: Plataformas magnéticas atraen al jugador
                    if (platform.type === 'magnetic' && !p.isGrounded) {
                        const dx = (platform.x + platform.width / 2) - (p.x + p.width / 2);
                        const dy = (platform.y - 20) - (p.y + p.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 150) { // Radio de atracción
                            p.velocityX += (dx / distance) * platform.magneticPull;
                            p.velocityY += (dy / distance) * platform.magneticPull;
                        }
                    }

                    if (this.checkCollision(p, platform)) {
                        // PART 10: Plataformas nube - atravesables desde abajo
                        if (platform.type === 'cloud') {
                            // Solo colisión si cayendo desde arriba
                            if (p.velocityY > 0 && p.y + p.height - p.velocityY <= platform.y + 5) {
                                p.y = platform.y - p.height;
                                p.velocityY = 0;
                                p.isGrounded = true;
                                p.jumpsRemaining = p.maxJumps; // PART 12: Reset triple salto
                            }
                            return; // No colisión lateral o desde abajo
                        }

                        // Landing on top of platform
                        if (p.velocityY > 0 && p.y + p.height - p.velocityY <= platform.y + 10) {
                            p.y = platform.y - p.height;
                            p.velocityY = 0;
                            p.isGrounded = true;
                            p.jumpsRemaining = p.maxJumps; // PART 12: Reset triple salto

                            // PART 13: Ground Pound Impact! 💥
                            if (p.isGroundPounding) {
                                p.isGroundPounding = false;

                                // Screen shake épico
                                Game.camera.shake = 30;
                                Game.camera.shakeIntensity = 20;

                                // Explosión de partículas rojas
                                for (let i = 0; i < 60; i++) {
                                    const angle = (Math.PI * 2 * i) / 60;
                                    const speed = 8 + Math.random() * 6;
                                    Game.particles.push({
                                        x: p.x + p.width / 2,
                                        y: p.y + p.height,
                                        vx: Math.cos(angle) * speed,
                                        vy: Math.sin(angle) * speed,
                                        life: 1.2,
                                        color: ['#ff0000', '#ff4400', '#ff8800', '#ffaa00'][Math.floor(Math.random() * 4)],
                                        size: Math.random() * 8 + 4
                                    });
                                }

                                // Daño a enemigos en área
                                const impactRadius = 150;
                                this.enemies.forEach(enemy => {
                                    if (enemy.isDead) return;

                                    const dx = enemy.x - (p.x + p.width / 2);
                                    const dy = enemy.y - (p.y + p.height);
                                    const distance = Math.sqrt(dx * dx + dy * dy);

                                    if (distance < impactRadius) {
                                        const damage = 50;
                                        enemy.health -= damage;

                                        // Knockback
                                        const pushDir = dx > 0 ? 1 : -1;
                                        enemy.velocityX = pushDir * 12;
                                        enemy.velocityY = -8;

                                        // Visual feedback
                                        this.createParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 15, '#ff0000');

                                        if (enemy.health <= 0) {
                                            enemy.isDead = true;
                                            p.stats.enemiesKilled++;
                                            showNotification('💥 Ground Pound Kill!', '+50 XP', 1500);
                                        }
                                    }
                                });

                                // Notification disabled - less spam
                                // showNotification('💥 IMPACT!', 'Ground Pound Strike!', 1200);
                                try {
                                    if (typeof playSound === 'function') playSound('explosion');
                                } catch (e) {}
                            }

                            // PART 10: Parkour combo - bonus por encadenar plataformas
                            if (Game.parkourCombo.lastPlatform !== platform && Game.parkourCombo.timeWithoutGround > 0.5) {
                                Game.parkourCombo.count++;
                                Game.parkourCombo.lastPlatform = platform;
                                Game.parkourCombo.timer = 300; // 5 segundos para siguiente plataforma

                                if (Game.parkourCombo.count >= 3) {
                                    const bonus = Math.floor(Game.parkourCombo.count * 5);
                                    p.coins += bonus;

                                    // BUGFIX: Try-catch para notificación
                                    try {
                                        if (typeof showNotification === 'function') {
                                            showNotification(`🏃 Parkour Combo x${Game.parkourCombo.count}!`, `+${bonus} monedas`, 2000);
                                        }
                                    } catch (e) {
                                        console.log('Parkour notification error:', e);
                                    }
                                }
                            }

                            // PART 10: Plataforma trampolín - super salto
                            if (platform.type === 'trampoline' && !p.lastBouncePlatform) {
                                p.velocityY = -platform.trampolinePower;
                                p.isGrounded = false;
                                p.lastBouncePlatform = platform;
                                setTimeout(() => p.lastBouncePlatform = null, 100);

                                // BUGFIX: Try-catch para sonido
                                try {
                                    if (typeof playSound === 'function') playSound('jump');
                                } catch (e) {}

                                try {
                                    this.createParticles(p.x + p.width / 2, p.y + p.height, 10, '#10b981');
                                } catch (e) {}
                            }

                            // PART 10: Plataforma de impulso - velocidad horizontal (BUGFIX: solo una vez por aterrizaje)
                            if (platform.type === 'boost' && !p.lastBoostPlatform) {
                                const currentSpeed = Math.abs(p.velocityX);
                                // Solo aplicar impulso si no está ya a velocidad máxima
                                if (currentSpeed < 15) { // BUGFIX: Limitar velocidad máxima
                                    if (p.velocityX > 0) p.velocityX = Math.min(p.velocityX + platform.boostPower, 15);
                                    else if (p.velocityX < 0) p.velocityX = Math.max(p.velocityX - platform.boostPower, -15);
                                    else p.velocityX = p.isFacingRight ? platform.boostPower : -platform.boostPower;
                                }

                                p.lastBoostPlatform = platform;
                                setTimeout(() => p.lastBoostPlatform = null, 100);

                                try {
                                    this.createParticles(p.x + p.width / 2, p.y + p.height, 10, '#f97316');
                                } catch (e) {}
                            }

                            // PART 10: Plataforma arcoíris - buff aleatorio
                            if (platform.type === 'rainbow' && !p.lastRainbowPlatform) {
                                const buffs = ['speed', 'infinite_energy', 'shield', 'damage'];
                                const randomBuff = buffs[Math.floor(Math.random() * buffs.length)];
                                p.activeBuffs.push({
                                    type: randomBuff,
                                    duration: 300,
                                    multiplier: randomBuff === 'speed' ? 1.5 : randomBuff === 'damage' ? 2 : 1
                                });
                                p.lastRainbowPlatform = platform;
                                setTimeout(() => p.lastRainbowPlatform = null, 2000);

                                // BUGFIX: Try-catch para notificación
                                try {
                                    if (typeof showNotification === 'function') {
                                        showNotification(`✨ Buff: ${randomBuff.toUpperCase()}!`, '', 2000);
                                    }
                                } catch (e) {}
                            }

                            // Break breakable platforms
                            if (platform.type === 'breakable' && !platform.breaking) {
                                platform.breaking = true; // Marcar que está en proceso
                                // BUGFIX PART 13: Dar 1.5 segundos antes de romperse (era 500ms = muy poco)
                                setTimeout(() => {
                                    platform.broken = true;
                                }, 1500); // 1.5 segundos para que puedas saltar
                            }

                            // Victory platform
                            if (platform.type === 'victory') {
                                this.victory();
                            }
                        }
                    }
                });

                // PART 13: Coyote time - Si acabamos de dejar el suelo, dar 6 frames de gracia
                if (wasGrounded && !p.isGrounded) {
                    p.coyoteTime = 6; // 6 frames (~0.1 segundos a 60fps)
                } else if (p.isGrounded) {
                    p.coyoteTime = 0;
                } else if (p.coyoteTime > 0) {
                    p.coyoteTime--;
                }

                // PART 13: Wall Slide Detection 🧗
                p.isWallSliding = false;
                p.wallSide = 0;

                if (!p.isGrounded && p.velocityY > 0 && !p.isGroundPounding) {
                    // Check for walls (plataformas a los lados)
                    this.platforms.forEach(platform => {
                        if (platform.broken) return;

                        // Check if touching left side of platform (wall on right)
                        if (p.x + p.width >= platform.x && p.x + p.width <= platform.x + 10 &&
                            p.y + p.height > platform.y && p.y < platform.y + platform.height) {
                            p.isWallSliding = true;
                            p.wallSide = 1; // Wall on right
                            p.jumpsRemaining = p.maxJumps; // Reset jumps on wall
                        }
                        // Check if touching right side of platform (wall on left)
                        else if (p.x <= platform.x + platform.width && p.x >= platform.x + platform.width - 10 &&
                            p.y + p.height > platform.y && p.y < platform.y + platform.height) {
                            p.isWallSliding = true;
                            p.wallSide = -1; // Wall on left
                            p.jumpsRemaining = p.maxJumps; // Reset jumps on wall
                        }
                    });
                }

                // Wall slide particles
                if (p.isWallSliding && Math.random() < 0.3) {
                    Game.particles.push({
                        x: p.wallSide === 1 ? p.x + p.width : p.x,
                        y: p.y + Math.random() * p.height,
                        vx: p.wallSide * (Math.random() * 2 + 1),
                        vy: Math.random() * 2,
                        life: 0.5,
                        color: '#94a3b8',
                        size: Math.random() * 3 + 1
                    });
                }

                // PART 13: Flow State System 🌊✨
                if (p.isGrounded) {
                    p.flowTime = 0;
                    p.flowLevel = 0;
                    p.lastFlowLevel = 0;
                } else {
                    p.flowTime += dt;

                    // Calculate flow level based on time in air
                    if (p.flowTime > 30) {
                        p.flowLevel = 3; // TRANSCENDENCE
                    } else if (p.flowTime > 15) {
                        p.flowLevel = 2; // EUPHORIA
                    } else if (p.flowTime > 5) {
                        p.flowLevel = 1; // FLOW
                    } else {
                        p.flowLevel = 0; // NORMAL
                    }

                    // Notify on flow level change!
                    if (p.flowLevel > p.lastFlowLevel) {
                        const flowMessages = [
                            null, // 0 = normal
                            { icon: '🌊', title: 'FLOW STATE!', desc: 'Speed +20%', color: '#3b82f6' },
                            { icon: '✨', title: 'EUPHORIA!', desc: 'Speed +50%', color: '#8b5cf6' },
                            { icon: '🌟', title: 'TRANSCENDENCE!', desc: 'Speed +80% + Invincible', color: '#ec4899' }
                        ];

                        const msg = flowMessages[p.flowLevel];
                        if (msg) {
                            showNotification(`${msg.icon} ${msg.title}`, msg.desc, 3000);

                            // Explosion de partículas con el color del nivel
                            for (let i = 0; i < 40; i++) {
                                const angle = (Math.PI * 2 * i) / 40;
                                const speed = 5 + Math.random() * 4;
                                Game.particles.push({
                                    x: p.x + p.width / 2,
                                    y: p.y + p.height / 2,
                                    vx: Math.cos(angle) * speed,
                                    vy: Math.sin(angle) * speed,
                                    life: 1.5,
                                    color: msg.color,
                                    size: Math.random() * 6 + 3
                                });
                            }
                        }
                        p.lastFlowLevel = p.flowLevel;
                    }
                }

                // Apply flow state buffs
                let flowSpeedMultiplier = 1;
                if (p.flowLevel === 1) flowSpeedMultiplier = 1.2;
                else if (p.flowLevel === 2) flowSpeedMultiplier = 1.5;
                else if (p.flowLevel === 3) {
                    flowSpeedMultiplier = 1.8;
                    p.isInvulnerable = true; // Invincible in transcendence
                }

                // Prevent falling below screen
                if (p.y > canvas.height + 100) {
                    p.health -= 20;
                    p.x = 100;
                    p.y = 300;
                    p.velocityX = 0;
                    p.velocityY = 0;
                    playSound('damage');

                    // BUGFIX PART 13: Resetear plataformas rotas cuando respawneas 🔧
                    // Si caíste porque una plataforma se rompió, las regeneramos
                    this.platforms.forEach(platform => {
                        if (platform.broken || platform.breaking) {
                            platform.broken = false; // Restaurar plataforma
                            platform.breaking = false; // Resetear estado de rotura
                        }
                    });

                    if (p.health <= 0) {
                        loseLife();
                    } else {
                        showNotification('⚠️ Be careful!', 'Platforms have been restored', 2000);
                    }
                }

                // Energy regeneration
                if (p.energy < Game.saveData.stats.maxEnergy) {
                    p.energy += dt * 5;
                }

                // Decrease cooldowns
                if (p.attackCooldown > 0) p.attackCooldown--;
                if (p.invulnerabilityTime > 0) {
                    p.invulnerabilityTime--;
                    p.isInvulnerable = true; // Invulnerable while invuln time active
                } else if (p.flowLevel !== 3) {
                    // Solo desactivar invuln si NO estamos en Transcendence
                    p.isInvulnerable = false;
                }
            },

            updateCamera() {
                // Smooth camera follow
                Game.camera.targetX = Game.player.x - canvas.width / 3;
                Game.camera.targetY = Game.player.y - canvas.height / 2;

                Game.camera.x += (Game.camera.targetX - Game.camera.x) * 0.1;
                Game.camera.y += (Game.camera.targetY - Game.camera.y) * 0.1;

                // Clamp camera
                Game.camera.x = Math.max(0, Math.min(Game.camera.x, this.worldLength - canvas.width));
                Game.camera.y = Math.max(0, Math.min(Game.camera.y, 200));

                // Camera shake
                if (Game.camera.shake > 0) {
                    Game.camera.shake -= 0.5;
                    Game.camera.x += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                    Game.camera.y += (Math.random() - 0.5) * Game.camera.shakeIntensity;
                }
            },

            updatePlatforms(dt) {
                this.platforms.forEach(platform => {
                    if (platform.type === 'moving') {
                        platform.y = platform.originalY + Math.sin(this.time * platform.moveSpeed) * platform.moveRange;
                    }
                    // PART 10: Animar plataformas arcoíris
                    if (platform.type === 'rainbow') {
                        platform.rainbowHue = (platform.rainbowHue + dt * 50) % 360;
                    }
                });
            },

            updateCoins(dt) {
                this.coins.forEach(coin => {
                    if (!coin.collected) {
                        coin.rotation += dt * 3;

                        // Check collision with player
                        const dx = coin.x - (Game.player.x + Game.player.width / 2);
                        const dy = coin.y - (Game.player.y + Game.player.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < coin.radius + 20) {
                            coin.collected = true;
                            Game.player.coins += coin.value;
                            Game.player.stats.coinsCollected++;
                            playSound('coin');
                            this.createCoinParticles(coin.x, coin.y);
                        }
                    }
                });
            },

            // PART 5: Update power-ups
            updatePowerups(dt) {
                this.powerups.forEach(powerup => {
                    if (!powerup.collected) {
                        powerup.rotation += dt * 2;
                        powerup.floatOffset += dt * 3;

                        // Check collision with player
                        const dx = powerup.x - (Game.player.x + Game.player.width / 2);
                        const dy = powerup.y - (Game.player.y + Game.player.height / 2);
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < 30) {
                            powerup.collected = true;
                            this.applyPowerup(powerup.type);
                        }
                    }
                });
            },

            // PART 5: Apply power-up effect
            applyPowerup(powerupType) {
                const p = Game.player;

                playSound('coin'); // Use coin sound, could create custom powerup sound

                if (powerupType.effect === 'heal') {
                    p.health = Math.min(p.health + powerupType.healAmount, Game.saveData.stats.maxHealth);
                    showNotification(
                        `${powerupType.icon} ${powerupType.name}!`,
                        `+${powerupType.healAmount} ❤️`,
                        2000
                    );
                } else {
                    // Add timed buff
                    p.activeBuffs.push({
                        type: powerupType.effect,
                        name: powerupType.name,
                        icon: powerupType.icon,
                        color: powerupType.color,
                        duration: powerupType.duration * 60, // Convert to frames
                        multiplier: powerupType.multiplier || 1
                    });

                    showNotification(
                        `${powerupType.icon} ${powerupType.name}!`,
                        powerupType.description,
                        3000
                    );
                }
            },

            // PART 5: Update NPCs
            updateNPCs(dt) {
                this.npcs.forEach(npc => {
                    npc.floatOffset += dt * 2;

                    // Check if player is near NPC
                    if (!npc.hasInteracted) {
                        const distance = Math.abs(Game.player.x - npc.x);
                        if (distance < 100) {
                            npc.hasInteracted = true;

                            // Show NPC message
                            const message = npc.type.messages[Math.floor(Math.random() * npc.type.messages.length)];
                            showNotification(
                                `${npc.type.name} 🧙`,
                                message,
                                4000
                            );

                            // Apply buff
                            Game.player.activeBuffs.push({
                                type: npc.type.buff.type,
                                name: npc.type.name,
                                icon: '✨',
                                color: npc.type.color,
                                duration: npc.type.buff.duration * 60,
                                multiplier: npc.type.buff.multiplier
                            });

                            playSound('levelup');
                        }
                    }
                });
            },

            // PART 5: Update active buffs
            updateBuffs(dt) {
                Game.player.activeBuffs = Game.player.activeBuffs.filter(buff => {
                    buff.duration--;
                    return buff.duration > 0;
                });
            },

            // PART 6: Update bosses
            updateBosses(dt) {
                this.bosses.forEach(boss => {
                    if (boss.isDefeated) return;

                    // Activate boss when player gets near
                    const distance = Math.abs(Game.player.x - boss.x);
                    if (distance < 300 && !boss.isActive) {
                        boss.isActive = true;
                        boss.dialogue = boss.type.dialogue.intro;
                        boss.dialogueTimer = 3;
                        showNotification(
                            `⚔️ ${boss.type.name}`,
                            boss.type.title,
                            3000
                        );
                        playSound('enemy_death'); // Dramatic sound
                    }

                    if (!boss.isActive) return;

                    // Show dialogue
                    if (boss.dialogueTimer > 0) {
                        boss.dialogueTimer -= dt;
                    }

                    // Update invulnerability
                    if (boss.invulnerableTimer > 0) {
                        boss.invulnerableTimer--;
                    }

                    // Check phase transitions
                    boss.type.phases.forEach((phase, index) => {
                        if (boss.currentPhase === index && boss.health <= phase.healthThreshold) {
                            boss.currentPhase++;
                            boss.dialogue = phase.message;
                            boss.dialogueTimer = 2;
                            showNotification('⚡ Cambio de Fase!', phase.message, 3000);
                            playSound('levelup');
                        }
                    });

                    // Simple AI: Move towards player
                    if (boss.attackCooldown <= 0) {
                        const dir = Game.player.x > boss.x ? 1 : -1;
                        boss.velocityX = dir * boss.type.speed;
                    } else {
                        boss.attackCooldown--;
                    }

                    // Apply velocity
                    boss.x += boss.velocityX;
                    boss.velocityX *= 0.9; // Friction

                    // Check collision with player
                    if (this.checkCollision(Game.player, boss) && !Game.player.isInvulnerable) {
                        const shieldBuff = Game.player.activeBuffs.find(b => b.type === 'shield');
                        if (!shieldBuff) {
                            // BUGFIX: Activar invulnerabilidad INMEDIATAMENTE para evitar múltiples hits
                            Game.player.invulnerabilityTime = 60;
                            Game.player.isInvulnerable = true;

                            Game.player.health -= boss.type.damage;
                            Game.player.stats.damageTaken += boss.type.damage;
                            playSound('damage');

                            const knockbackDir = Game.player.x < boss.x ? -1 : 1;
                            Game.player.velocityX = knockbackDir * 12;
                            Game.player.velocityY = -10;

                            Game.camera.shake = 15;
                            Game.camera.shakeIntensity = 10;

                            if (Game.player.health <= 0) {
                                loseLife();
                            }
                        }
                    }
                });
            },

            // PART 6: Update missions
            updateMissions() {
                const p = Game.player;

                this.missions.forEach(mission => {
                    if (mission.completed) return;

                    switch (mission.id) {
                        case 'side_1':
                            mission.current = p.stats.coinsCollected;
                            break;
                        case 'side_2':
                            mission.current = p.stats.enemiesDefeated;
                            break;
                        case 'side_3':
                            mission.current = p.stats.maxCombo;
                            break;
                        case 'side_4':
                            mission.current = p.stats.jumps;
                            break;
                        case 'side_5':
                            mission.current = p.stats.specialAbilitiesUsed;
                            break;
                    }

                    // Check completion
                    if (mission.target && mission.current >= mission.target && !mission.completed) {
                        mission.completed = true;

                        // Give rewards
                        if (mission.reward.coins) {
                            p.coins += mission.reward.coins;
                        }
                        if (mission.reward.xp) {
                            this.gainXP(mission.reward.xp);
                        }

                        showNotification(
                            `${mission.icon} ¡Misión Completada!`,
                            `${mission.name} - Recompensa: ${mission.reward.coins || 0} 💰`,
                            4000
                        );
                        playSound('levelup');
                    }
                });
            },

            updateEnemies(dt) {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    // Apply gravity
                    enemy.velocityY += 0.8;

                    // Apply velocity
                    enemy.x += enemy.velocityX;
                    enemy.y += enemy.velocityY;

                    // Check platform collisions
                    enemy.isGrounded = false;
                    this.platforms.forEach(platform => {
                        if (platform.broken) return;

                        if (this.checkCollision(enemy, platform)) {
                            if (enemy.velocityY > 0 && enemy.y + enemy.height - enemy.velocityY <= platform.y + 10) {
                                enemy.y = platform.y - enemy.height;
                                enemy.velocityY = 0;
                                enemy.isGrounded = true;
                            }
                        }
                    });

                    // Patrol behavior
                    if (enemy.isGrounded && enemy.patrolPlatform) {
                        const platform = enemy.patrolPlatform;
                        if (enemy.x < platform.x || enemy.x + enemy.width > platform.x + platform.width) {
                            enemy.velocityX *= -1;
                        }
                    }

                    // Check collision with player
                    if (this.checkCollision(Game.player, enemy)) {
                        const p = Game.player;

                        // PART 13: Enemy Bounce (Mario/Hollow Knight style) 🦘
                        // If player falls from above, bounce on enemy
                        if (p.velocityY > 0 && p.y + p.height - p.velocityY <= enemy.y + 10) {
                            // Bounce!
                            p.velocityY = -10; // Strong bounce
                            p.jumpsRemaining = p.maxJumps; // Reset jumps
                            playSound('jump');

                            // Damage to enemy
                            const bounceDamage = 30;
                            enemy.health -= bounceDamage;
                            p.stats.damageDealt += bounceDamage;

                            // Combo counter
                            p.combo = Math.min(p.combo + 1, 99);
                            p.comboTimer = 180;

                            // Bounce particles
                            for (let i = 0; i < 20; i++) {
                                Game.particles.push({
                                    x: enemy.x + enemy.width / 2,
                                    y: enemy.y,
                                    vx: (Math.random() - 0.5) * 8,
                                    vy: -Math.random() * 6,
                                    life: 1,
                                    color: '#fbbf24',
                                    size: Math.random() * 5 + 2
                                });
                            }

                            // If kills enemy with bounce
                            if (enemy.health <= 0 && !enemy.isDead) {
                                enemy.isDead = true;
                                p.stats.kills++;

                                // XP bonus
                                p.xp += enemy.xp;
                                this.checkLevelUp();

                                try {
                                    if (typeof showNotification === 'function') {
                                        showNotification('🦘 Stomp Kill!', `+${enemy.xp} XP`, 1500);
                                    }
                                } catch (e) {}
                            }
                        } else {
                            // Normal collision - take damage
                            if (enemy.hitCooldown <= 0 && !p.isInvulnerable) {
                                // PART 5: Check for shield buff
                                const shieldBuff = p.activeBuffs.find(b => b.type === 'shield');

                                if (!shieldBuff) {
                                    // BUGFIX: Activate invulnerability IMMEDIATELY to prevent multiple hits
                                    p.isInvulnerable = true;
                                    p.invulnerabilityTime = 60;

                                    // Player takes damage
                                    p.health -= enemy.damage;
                                    p.health = Math.max(0, p.health); // Ensure health doesn't go negative
                                    p.stats.damageTaken += enemy.damage;
                                    playSound('damage');

                                    // Knockback
                                    const knockbackDir = p.x < enemy.x ? -1 : 1;
                                    p.velocityX = knockbackDir * 8;
                                    p.velocityY = -8;

                                    Game.camera.shake = 10;
                                    Game.camera.shakeIntensity = 8;

                                    if (p.health <= 0) {
                                        p.health = 0; // Ensure health is exactly 0

                                } else {

            checkCollision(player, platform) {
                return player.x < platform.x + platform.width &&
                       player.x + player.width > platform.x &&
                       player.y < platform.y + platform.height &&
                       player.y + player.height > platform.y;

            createCoinParticles(x, y) {
                for (let i = 0; i < 10; i++) {
                    Game.particles.push({

                        y: y,
                        vx: (Math.random() - 0.5) * 5,

                    });

            // PART 7: Update spell projectiles and effects
            updateSpells(dt) {
                const p = Game.player;

                for (let i = Game.spells.length - 1; i >= 0; i--) {
                    const spell = Game.spells[i];

                    // Update spell lifetime
                    spell.life -= dt;
                    if (spell.life <= 0) {
                        Game.spells.splice(i, 1);
                        continue;
                    }

                    if (spell.type === 'lightbolt') {
                        // Move projectile
                        spell.x += spell.vx;
                        spell.y += spell.vy;

                        // Trail effect
                        spell.trail.push({ x: spell.x, y: spell.y, life: 0.3 });
                        if (spell.trail.length > 10) spell.trail.shift();

                        // Check collision with enemies
                        let hit = false;
                        this.enemies.forEach(enemy => {
                            if (enemy.isDead || hit) return;

                            const dx = spell.x - (enemy.x + enemy.width / 2);
                            const dy = spell.y - (enemy.y + enemy.height / 2);
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < spell.radius + enemy.width / 2) {
                                // Hit!
                                enemy.health -= spell.damage;
                                p.stats.damageDealt += spell.damage;

                                        color: spell.color,
                                        size: Math.random() * 5 + 2
                                    });

                                hit = true;
                                Game.spells.splice(i, 1);
                            }

                        // Check collision with bosses
                        if (!hit) {
                            this.bosses.forEach(boss => {

                                            `💙 ${boss.type.name} Defeated!`,

                                            6000

                                    // Impact particles

                                        Game.spellParticles.push({
                                            x: spell.x,
                                            y: spell.y,
                                            vx: Math.cos(angle) * (Math.random() * 6 + 2),

                    } else if (spell.type === 'nova') {

                        if (spell.radius >= spell.maxRadius) {

                        }

                        // Check collision with enemies
                        this.enemies.forEach(enemy => {
                            if (enemy.isDead) return;
                            if (spell.hitEnemies.includes(enemy)) return; // Already hit

                            const dx = spell.x - (enemy.x + enemy.width / 2);
                            const dy = spell.y - (enemy.y + enemy.height / 2);
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < spell.radius) {
                                spell.hitEnemies.push(enemy);

                                // Damage enemy
                                enemy.health -= spell.damage;
                                p.stats.damageDealt += spell.damage;

                                p.comboTimer = 3;

                                // Knockback
                                const angle = Math.atan2(dy, dx);

                        // Check collision with bosses
                        this.bosses.forEach(boss => {
                            if (boss.isDefeated || !boss.isActive) return;
                            if (spell.hitEnemies.includes(boss)) return;

                            const dx = spell.x - (boss.x + boss.width / 2);
                            const dy = spell.y - (boss.y + boss.height / 2);
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < spell.radius) {
                                spell.hitEnemies.push(boss);

                                boss.health -= spell.damage;
                                p.stats.damageDealt += spell.damage;
                                boss.invulnerableTimer = 10;

                                if (boss.health <= 0 && !boss.isDefeated) {
                                    boss.isDefeated = true;
                                    // PART 9: Epic drop!
                                    this.playEpicDrop();
                                    p.coins += boss.type.coins;
                                    this.gainXP(boss.type.xp);

                                    const mission = this.missions.find(m => m.type === 'main' && m.description.includes(boss.type.name));
                                    if (mission && !mission.completed) {
                                        mission.completed = true;
                                        if (mission.reward.coins) p.coins += mission.reward.coins;
                                        if (mission.reward.xp) this.gainXP(mission.reward.xp);
                                    }

                                    // PART 11: Show UNIQUE motivational message on boss defeat 💙
                                    const bossId = boss.type.id;
                                        if (!Game.bossMessagesUsed[bossId]) Game.bossMessagesUsed[bossId] = [];
                                        const availableMessages = Game.bossDefeatMessages[bossId].filter(msg => !Game.bossMessagesUsed[bossId].includes(msg));
                                        let message;
                                        if (availableMessages.length > 0) {
                                            message = availableMessages[Math.floor(Math.random() * availableMessages.length)];
                                            Game.bossMessagesUsed[bossId].push(message);
                                        } else {
                                            const messages = Game.bossDefeatMessages[bossId];
                                            message = messages[Math.floor(Math.random() * messages.length)];
                                        };

                                        `💙 ¡${boss.type.name} Defeatdo!`,
                                        `"${randomQuote.quote}"`,
                                        8000
                                    );
                                }
                            }
                        });
                    }
                }
            },

            // PART 7: Update spell particle effects
            updateSpellParticles(dt) {
                for (let i = Game.spellParticles.length - 1; i >= 0; i--) {
                    const particle = Game.spellParticles[i];
                    particle.life -= dt;

                    if (particle.life <= 0) {
                        Game.spellParticles.splice(i, 1);
                        continue;
                    }

                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vx *= 0.98;
                    particle.vy *= 0.98;
                }

                // Update spell trails
                Game.spells.forEach(spell => {
                    if (spell.trail) {
                        for (let i = spell.trail.length - 1; i >= 0; i--) {
                            spell.trail[i].life -= dt;
                            if (spell.trail[i].life <= 0) {
                                spell.trail.splice(i, 1);
                            }
                        }
                    }
                });
            },

            // PART 8: Update companion
            updateCompanion(dt) {
                const comp = Game.companion;
                if (!comp.active) return;

                const p = Game.player;
                comp.animationTime += dt;
                comp.orbitAngle += 0.05;

                // Follow player with smooth movement
                const offsetX = Math.cos(comp.orbitAngle) * 60;
                const offsetY = Math.sin(comp.orbitAngle) * 30 - 40;

                comp.targetX = p.x + p.width / 2 + offsetX;
                comp.targetY = p.y + p.height / 2 + offsetY;

                // Smooth follow
                comp.velocityX = (comp.targetX - comp.x) * 0.1;
                comp.velocityY = (comp.targetY - comp.y) * 0.1;

                comp.x += comp.velocityX;
                comp.y += comp.velocityY;

                // Change emotion based on player state
                if (p.health < 30) {
                    comp.emotion = 'worried';
                } else if (p.combo >= 5) {
                    comp.emotion = 'excited';
                } else if (p.isGrounded) {
                    comp.emotion = 'happy';
                } else {
                    comp.emotion = 'neutral';
                }

                // Evolve form based on collected memories
                if (Game.collectedMemories.length >= 4) {
                    comp.form = 'phoenix';
                } else if (Game.collectedMemories.length >= 2) {
                    comp.form = 'wisp';
                } else {
                    comp.form = 'spark';
                }

                // Generate companion particles
                if (Math.random() < 0.3) {
                    comp.particles.push({
                        x: comp.x,
                        y: comp.y,
                        vx: (Math.random() - 0.5) * 2,
                        vy: (Math.random() - 0.5) * 2,
                        life: 0.8,
                        color: comp.color,
                        size: Math.random() * 3 + 2
                    });
                }

                // Update companion particles
                for (let i = comp.particles.length - 1; i >= 0; i--) {
                    comp.particles[i].life -= dt;
                    comp.particles[i].x += comp.particles[i].vx;
                    comp.particles[i].y += comp.particles[i].vy;

                    if (comp.particles[i].life <= 0) {
                        comp.particles.splice(i, 1);
                    }
                }
            },

            // PART 8: Update emotion orbs
            updateEmotionOrbs(dt) {
                const p = Game.player;

                Game.emotionOrbs.forEach(orb => {
                    if (orb.collected) return;

                    // Float animation
                    orb.floatOffset += dt * 2;
                    orb.pulseTime += dt * 3;

                    // Check collision with player
                    if (this.checkCollision(p, orb)) {
                        orb.collected = true;

                        // Apply orb effect
                        const buff = {
                            type: orb.type.effect,
                            multiplier: orb.type.multiplier,
                            value: orb.type.value,
                            duration: orb.type.duration,
                            color: orb.type.color
                        };

                        // Special handling for different orb types
                        if (orb.type.id === 'hope') {
                            p.health = Math.min(p.health + 30, Game.saveData.stats.maxHealth);
                            p.activeBuffs.push({ ...buff, type: 'shield' });
                        } else if (orb.type.id === 'calm') {
                            p.mana = Math.min(p.mana + 50, p.maxMana);
                            // Mana regen boost - handled in update
                        } else {
                            p.activeBuffs.push(buff);
                        }

                        // Visual effect
                        for (let i = 0; i < 30; i++) {
                            const angle = (Math.PI * 2 * i) / 30;
                            Game.particles.push({
                                x: orb.x + orb.width / 2,
                                y: orb.y + orb.height / 2,
                                vx: Math.cos(angle) * 5,
                                vy: Math.sin(angle) * 5,
                                life: 1,
                                color: orb.type.color,
                                size: Math.random() * 4 + 2
                            });
                        }

                        playSound('pickup');
                        showNotification(
                            `${orb.type.icon} ${orb.type.name}`,
                            orb.type.effect === 'heal_shield' ? '+30 ❤️ +Shield' : `Buff activado!`,
                            2000
                        );
                    }
                });

                // Remove collected orbs
                Game.emotionOrbs = Game.emotionOrbs.filter(orb => !orb.collected);
            },

            // PART 8: Update memory fragments
            updateMemoryFragments(dt) {
                const p = Game.player;

                Game.memoryFragments.forEach(fragment => {
                    if (fragment.collected) return;

                    fragment.rotation += dt * 2;
                    fragment.glowIntensity = 0.7 + Math.sin(this.time * 3) * 0.3;

                    // Check collision
                    if (this.checkCollision(p, fragment)) {
                        fragment.collected = true;
                        Game.collectedMemories.push(fragment.memory);

                        // Epic collection effect
                        for (let i = 0; i < 50; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            const speed = Math.random() * 8 + 2;
                            Game.particles.push({
                                x: fragment.x + fragment.width / 2,
                                y: fragment.y + fragment.height / 2,
                                vx: Math.cos(angle) * speed,
                                vy: Math.sin(angle) * speed,
                                life: 1.5,
                                color: '#a855f7',
                                size: Math.random() * 5 + 3
                            });
                        }

                        // Companion reacts
                        Game.companion.emotion = 'excited';

                        playSound('levelup');
                        showNotification(
                            `💭 Memoria Recuperada (${Game.collectedMemories.length}/5)`,
                            fragment.memory.text,
                            5000
                        );
                    }
                });
            },

            // PART 8: Update atmospheric particles
            updateAtmosphericParticles(dt) {
                // Update existing particles
                for (let i = Game.atmosphericParticles.length - 1; i >= 0; i--) {
                    const particle = Game.atmosphericParticles[i];

                    particle.x += particle.vx;
                    particle.y += particle.vy;

                    // Wrap around
                    if (particle.y > canvas.height) {
                        particle.y = 0;
                        particle.x = Math.random() * this.worldLength;
                    }

                    // Change type based on world progress
                    if (Game.worldProgress > 0.5 && particle.type === 'sparkle') {
                        if (Math.random() < 0.01) {
                            particle.type = 'petal';
                            particle.color = '#fbbf24';
                        }
                    }
                }

                // Add new particles based on progress
                if (Math.random() < 0.1 && Game.atmosphericParticles.length < 100) {
                    const type = Game.worldProgress > 0.7 ? 'petal' : Game.worldProgress > 0.4 ? 'light' : 'sparkle';
                    const colors = {
                        sparkle: '#ffffff',
                        light: '#fbbf24',
                        petal: ['#ff6b9d', '#fbbf24', '#60a5fa', '#10b981'][Math.floor(Math.random() * 4)]
                    };

                    Game.atmosphericParticles.push({
                        x: Math.random() * this.worldLength,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.5,
                        vy: Math.random() * 0.5 + 0.2,
                        size: Math.random() * 3 + 1,
                        color: colors[type],
                        type: type,
                        life: 1,
                        opacity: Math.random() * 0.5 + 0.3
                    });
                }
            },

            // PART 8: Update world transformation
            updateWorldTransformation() {
                // Calculate world progress based on player position and collectibles
                const positionProgress = Game.player.x / this.worldLength;
                const memoryProgress = Game.collectedMemories.length / 5;
                const bossProgress = this.bosses.filter(b => b.isDefeated).length / this.bosses.length;

                Game.worldProgress = (positionProgress * 0.5) + (memoryProgress * 0.3) + (bossProgress * 0.2);
                Game.worldProgress = Math.min(Game.worldProgress, 1);
            },

            // PART 8: Update breathing exercise
            updateBreathingExercise(dt) {
                const ex = Game.breathingExercise;
                ex.timer += dt;

                const cycleDuration = 4; // 4 seconds per phase

                if (ex.phase === 'inhale') {
                    ex.radius = 50 + (ex.timer / cycleDuration) * 50;
                    if (ex.timer >= cycleDuration) {
                        ex.phase = 'hold';
                        ex.timer = 0;
                    }
                } else if (ex.phase === 'hold') {
                    ex.radius = 100;
                    if (ex.timer >= cycleDuration * 0.5) { // Hold for 2 seconds
                        ex.phase = 'exhale';
                        ex.timer = 0;
                    }
                } else if (ex.phase === 'exhale') {
                    ex.radius = 100 - (ex.timer / cycleDuration) * 50;
                    if (ex.timer >= cycleDuration) {
                        ex.phase = 'inhale';
                        ex.timer = 0;
                        ex.completedCycles++;

                        // Complete exercise after 3 cycles
                        if (ex.completedCycles >= 3) {
                            this.completeBreathingExercise();
                        }
                    }
                }
            },

            // PART 8: Complete breathing exercise
            completeBreathingExercise() {
                const ex = Game.breathingExercise;
                ex.active = false;
                ex.completedCycles = 0;
                ex.phase = 'inhale';

                const p = Game.player;

                // Full restoration
                p.health = Game.saveData.stats.maxHealth;
                p.mana = p.maxMana;
                p.energy = Game.saveData.stats.maxEnergy;

                p.activeBuffs.push({
                    type: 'clarity',
                    multiplier: 1.5,
                    duration: 600, // 10 seconds
                    color: '#60a5fa'
                });

                for (let i = 0; i < 80; i++) {

                    const speed = 6 + Math.random() * 4;
                    Game.particles.push({
                        x: p.x + p.width / 2,

                    });

                );

            // PART 12 + 13: Sistema de Triple Salto + Coyote Time + Wall Jump! 🚀🕐🧗
            handleJump() {
                const p = Game.player;
                const jumpForce = -12;
                const hasInfiniteEnergy = p.activeBuffs.find(b => b.type === 'infinite_energy');

                // PART 13: WALL JUMP! 🧗
                if (p.isWallSliding && p.wallJumpTimer <= 0) {
                    // Wall jump: salta en dirección opuesta a la pared
                    p.velocityY = jumpForce * 1.1; // 10% más fuerte
                    p.velocityX = -p.wallSide * 8; // Impulso horizontal fuerte
                    p.isWallSliding = false;
                    p.wallJumpTimer = 10; // Cooldown para evitar spam
                    p.jumpsRemaining = p.maxJumps - 1; // Le quedan 2 saltos
                    playSound('jump');

                    // Partículas de wall jump
                    for (let i = 0; i < 15; i++) {
                        Game.particles.push({
                            x: p.wallSide === 1 ? p.x + p.width : p.x,
                            y: p.y + p.height / 2,
                            vx: p.wallSide * (Math.random() * 4 + 2),
                            vy: (Math.random() - 0.5) * 6,
                            life: 0.8,
                            color: '#60a5fa',
                            size: Math.random() * 4 + 2
                        });
                    }

                    // Notification disabled - less spam en pantalla
                    // try {
                    //     if (typeof showNotification === 'function') {
                    //         showNotification('🧗 Wall Jump!', '', 800);
                    //     }
                    // } catch (e) {}

                    return; // Exit early, wall jump handled
                }

                // Decrease wall jump timer
                if (p.wallJumpTimer > 0) p.wallJumpTimer--;

                // PART 13: Coyote time - Si acabamos de dejar el suelo, aún podemos saltar
                const canCoyoteJump = p.coyoteTime > 0 && p.jumpsRemaining === p.maxJumps;

                // Calcular costo de energía basado en el número de salto
                const jumpNumber = p.maxJumps - p.jumpsRemaining + 1;
                const energyCost = 10 + (jumpNumber - 1) * 5; // 10, 15, 20 energía

                // Permitir salto si hay saltos restantes y suficiente energía (o coyote time)
                if ((p.jumpsRemaining > 0 || canCoyoteJump) && (p.energy >= energyCost || hasInfiniteEnergy)) {
                    p.velocityY = jumpForce;
                    if (!hasInfiniteEnergy) p.energy -= energyCost;

                    // Si usamos coyote jump, restar del contador de saltos
                    if (canCoyoteJump) {
                        p.jumpsRemaining--; // Usar primer salto
                        p.coyoteTime = 0; // Consumir coyote time
                    } else {
                        p.jumpsRemaining--;
                    }

                    p.isGrounded = false;
                    p.stats.jumps++;
                    playSound('jump');

                    // PART 9: Play musical note (más agudo con cada salto)
                    this.playJumpNote(Math.abs(jumpForce) + jumpNumber * 3);

                    // Visual feedback para triple salto
                    if (jumpNumber === 3) {
                        // Partículas especiales para el tercer salto
                        for (let i = 0; i < 15; i++) {
                            const angle = Math.random() * Math.PI * 2;
                            Game.particles.push({
                                x: p.x + p.width / 2,
                                y: p.y + p.height,
                                vx: Math.cos(angle) * 4,
                                vy: Math.sin(angle) * 4,
                                life: 0.8,
                                color: '#fbbf24',
                                size: Math.random() * 4 + 2
                            });
                        }
                    }
                }
            },

            // PART 5: Handle special ability
            handleSpecialAbility() {
                const p = Game.player;
                const ability = this.specialAbilities[Game.saveData.character];

                // Check cooldown and energy
                if (p.specialAbilityCooldown > 0 || p.energy < ability.energyCost) {

                    } else {
                        showNotification('⚡ Sin energía', 'Necesitas más energía', 1500);
                    }
                    return;
                }

                p.energy -= ability.energyCost;
                p.specialAbilityCooldown = ability.cooldown * 60; // Convert to frames
                p.isUsingSpecial = true;
                p.stats.specialAbilitiesUsed++;

                playSound('levelup');

                if (Game.saveData.character === 'luna') {
                    // Luna's ability: Healing wave
                    showNotification(
                        `${ability.icon} ${ability.name}!`,
                        ability.description,
                        3000
                    );

                    // Heal player
                    p.health = Math.min(p.health + ability.healAmount, Game.saveData.stats.maxHealth);

                    // Create wave effect
                    for (let i = 0; i < 50; i++) {
                        const angle = (Math.PI * 2 * i) / 50;
                        const speed = 5 + Math.random() * 3;
                        Game.particles.push({
                            x: p.x + p.width / 2,
                            y: p.y + p.height / 2,
                            vx: Math.cos(angle) * speed,
                            vy: Math.sin(angle) * speed,
                            life: 1.5,
                            color: ability.color,
                            size: Math.random() * 6 + 4
                        });
                    }

                    // Push back nearby enemies
                    this.enemies.forEach(enemy => {
                        if (enemy.isDead) return;

                        const dx = enemy.x - p.x;
                        const dy = enemy.y - p.y;
                        const distance = Math.sqrt(dx * dx + dy * dy);

                        if (distance < ability.range) {
                            const pushDir = dx > 0 ? 1 : -1;
                            enemy.velocityX = pushDir * ability.pushForce;
                            enemy.velocityY = -ability.pushForce;
                        }
                    });

                } else if (Game.saveData.character === 'sol') {
                    // Sol's ability: Dash attack
                    showNotification(
                        `${ability.icon} ${ability.name}!`,
                        ability.description,
                        3000
                    );

                    p.isDashing = true;
                    const dashDir = p.isFacingRight ? 1 : -1;
                    p.velocityX = dashDir * ability.dashSpeed;
                    p.isInvulnerable = true;

                    // Trail particles
                    const dashInterval = setInterval(() => {
                        for (let i = 0; i < 5; i++) {
                            Game.particles.push({
                                x: p.x + p.width / 2,
                                y: p.y + p.height / 2,
                                vx: (Math.random() - 0.5) * 4,
                                vy: (Math.random() - 0.5) * 4,
                                life: 0.8,
                                color: ability.color,
                                size: Math.random() * 6 + 3
                            });
                        }
                    }, 50);

                    // Damage enemies during dash
                    const dashDamageInterval = setInterval(() => {
                        this.enemies.forEach(enemy => {
                            if (enemy.isDead) return;

                            if (this.checkCollision(p, enemy)) {
                                enemy.health -= ability.damage;
                                p.stats.damageDealt += ability.damage;

                                // Knockback
                                enemy.velocityX = dashDir * 15;
                                enemy.velocityY = -10;

                                // Hit particles
                                for (let i = 0; i < 10; i++) {
                                    Game.particles.push({
                                        x: enemy.x + enemy.width / 2,
                                        y: enemy.y + enemy.height / 2,
                                        vx: (Math.random() - 0.5) * 10,
                                        vy: (Math.random() - 0.5) * 10,
                                        life: 0.6,
                                        color: ability.color,
                                        size: Math.random() * 5 + 2
                                    });
                                }

                                if (enemy.health <= 0) {
                                    enemy.isDead = true;
                                    p.stats.enemiesDefeated++;
                                    this.gainXP(enemy.xp);
                                    playSound('enemy_death');
                                }
                            }
                        });
                    }, 100);

                    // End dash after duration
                    setTimeout(() => {
                        p.isDashing = false;
                        p.isInvulnerable = false;
                        p.isUsingSpecial = false;
                        clearInterval(dashInterval);
                        clearInterval(dashDamageInterval);
                    }, ability.duration * 1000);
                }

                if (Game.saveData.character === 'luna') {
                    setTimeout(() => {
                        p.isUsingSpecial = false;
                    }, 500);
                }
            },
