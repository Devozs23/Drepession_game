            drawParallax() {
                // Sky gradient
                const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
                const progress = Game.player.x / this.worldLength;

                // Change colors based on progress (dark to sunset)
                if (progress < 0.5) {
                    skyGradient.addColorStop(0, '#0f0c29');
                    skyGradient.addColorStop(1, '#302b63');
                } else {
                    const t = (progress - 0.5) * 2;
                    const r1 = Math.floor(15 + (255 - 15) * t);
                    const g1 = Math.floor(12 + (107 - 12) * t);
                    const b1 = Math.floor(41 + (133 - 41) * t);
                    skyGradient.addColorStop(0, `rgb(${r1}, ${g1}, ${b1})`);
                    skyGradient.addColorStop(1, '#ff6b9d');
                }

                ctx.fillStyle = skyGradient;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw mountains (parallax)
                const layer = this.parallaxLayers[1];
                const offsetX = Game.camera.x * layer.speed;

                ctx.fillStyle = layer.color;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);

                for (let i = 0; i < layer.heights.length; i++) {
                    const x = (i * 100) - offsetX;
                    const y = layer.y - layer.heights[i];
                    ctx.lineTo(x, y);
                }

                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            },

            drawStars() {
                this.stars.forEach(star => {
                    const screenX = star.x - Game.camera.x * 0.1;
                    const screenY = star.y;

                    ctx.save();
                    ctx.globalAlpha = star.opacity;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(screenX, screenY, star.size, star.size);
                    ctx.restore();
                });
            },

            drawClouds() {
                this.clouds.forEach(cloud => {
                    const screenX = cloud.x - Game.camera.x * 0.5;
                    const screenY = cloud.y;

                    ctx.save();
                    ctx.globalAlpha = cloud.opacity;
                    ctx.fillStyle = '#fff';

                    // Draw cloud shape
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width / 3, screenY - cloud.height / 4, cloud.height / 1.5, 0, Math.PI * 2);
                    ctx.arc(screenX + cloud.width * 2/3, screenY, cloud.height / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            },

            // VARIEDAD: Función para dibujar diferentes formas de plataformas 🎨
            drawPlatformShape(ctx, x, y, w, h, shape, strokeOnly = false) {
                ctx.beginPath();

                switch(shape) {
                    case 'roundedRect':
                        // Rectángulo con bordes redondeados
                        const radius = Math.min(10, h / 2);
                        ctx.moveTo(x + radius, y);
                        ctx.lineTo(x + w - radius, y);
                        ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
                        ctx.lineTo(x + w, y + h - radius);
                        ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
                        ctx.lineTo(x + radius, y + h);
                        ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
                        ctx.lineTo(x, y + radius);
                        ctx.quadraticCurveTo(x, y, x + radius, y);
                        break;

                    case 'ellipse':
                        // Óvalo/elipse
                        ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
                        break;

                    case 'hexagon':
                        // Hexágono
                        const centerX = x + w/2;
                        const centerY = y + h/2;
                        ctx.moveTo(centerX + w/2, centerY);
                        ctx.lineTo(centerX + w/4, centerY + h/2);
                        ctx.lineTo(centerX - w/4, centerY + h/2);
                        ctx.lineTo(centerX - w/2, centerY);
                        ctx.lineTo(centerX - w/4, centerY - h/2);
                        ctx.lineTo(centerX + w/4, centerY - h/2);
                        ctx.closePath();
                        break;

                    case 'diamond':
                        // Diamante/rombo
                        ctx.moveTo(x + w/2, y);              // Top
                        ctx.lineTo(x + w, y + h/2);          // Right
                        ctx.lineTo(x + w/2, y + h);          // Bottom
                        ctx.lineTo(x, y + h/2);              // Left
                        ctx.closePath();
                        break;

                    case 'rectangle':
                    default:
                        // Rectángulo normal
                        ctx.rect(x, y, w, h);
                        break;
                }

                if (strokeOnly) {
                    ctx.stroke();
                } else {
                    ctx.fill();
                }
            },

            drawPlatforms() {
                this.platforms.forEach(platform => {
                    if (platform.broken) return;

                    const screenX = platform.x - Game.camera.x;
                    const screenY = platform.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + platform.width < 0 || screenX > canvas.width) return;

                    // Platform shadow
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                    ctx.fillRect(screenX + 5, screenY + 5, platform.width, platform.height);

                    // PART 10: Rainbow platform - animated color
                    if (platform.type === 'rainbow') {
                        ctx.fillStyle = `hsl(${platform.rainbowHue}, 70%, 60%)`;
                        ctx.save();
                        ctx.shadowColor = `hsl(${platform.rainbowHue}, 70%, 60%)`;
                        ctx.shadowBlur = 15;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        ctx.restore();
                    }
                    // PART 10: Trampoline platform - spring effect
                    else if (platform.type === 'trampoline') {
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        // Spring lines
                        ctx.strokeStyle = '#059669';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 5; i++) {
                            const x = screenX + (platform.width / 6) * (i + 1);
                            ctx.beginPath();
                            ctx.moveTo(x, screenY + 5);
                            ctx.lineTo(x, screenY + platform.height - 5);
                            ctx.stroke();
                        }
                    }
                    // PART 10: Cloud platform - fluffy appearance
                    else if (platform.type === 'cloud') {
                        ctx.save();
                        ctx.globalAlpha = 0.7;
                        ctx.fillStyle = platform.color;
                        // Draw cloud shape
                        ctx.beginPath();
                        for (let i = 0; i < 3; i++) {
                            const cx = screenX + (platform.width / 4) * (i + 0.5);
                            ctx.arc(cx, screenY + platform.height / 2, platform.height / 2, 0, Math.PI * 2);
                        }
                        ctx.fill();
                        ctx.restore();
                    }
                    // PART 10: Magnetic platform - magnetic field lines
                    else if (platform.type === 'magnetic') {
                        ctx.fillStyle = platform.color;
                        ctx.save();
                        ctx.shadowColor = platform.color;
                        ctx.shadowBlur = 10;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        // Magnetic particles
                        for (let i = 0; i < 3; i++) {
                            const angle = (this.time * 2 + i * (Math.PI * 2 / 3)) % (Math.PI * 2);
                            const px = screenX + platform.width / 2 + Math.cos(angle) * 30;
                            const py = screenY + platform.height / 2 + Math.sin(angle) * 20;
                            ctx.fillStyle = '#ec4899';
                            ctx.beginPath();
                            ctx.arc(px, py, 3, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        ctx.restore();
                    }
                    // PART 10: Boost platform - arrow indicator
                    else if (platform.type === 'boost') {
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        // Arrow
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.moveTo(screenX + platform.width * 0.7, screenY + platform.height / 2);
                        ctx.lineTo(screenX + platform.width * 0.5, screenY + 8);
                        ctx.lineTo(screenX + platform.width * 0.5, screenY + platform.height - 8);
                        ctx.fill();
                    }
                    // Normal platform - CON FORMAS Y GRADIENTES VARIADOS! 🎨✨
                    else {
                        // Gradiente vertical para más profundidad
                        const gradient = ctx.createLinearGradient(screenX, screenY, screenX, screenY + platform.height);
                        gradient.addColorStop(0, platform.color);
                        // Color más oscuro abajo
                        const darkerColor = platform.color.replace(/[0-9a-f]{2}(?=[0-9a-f]{2}$)/gi, match => {
                            return Math.max(0, parseInt(match, 16) - 30).toString(16).padStart(2, '0');
                        });
                        gradient.addColorStop(1, darkerColor);

                        ctx.fillStyle = gradient;
                        this.drawPlatformShape(ctx, screenX, screenY, platform.width, platform.height, platform.shape || 'rectangle');

                        // Patrón de puntos aleatorio para más textura
                        if (Math.random() > 0.7) { // 30% de plataformas tienen puntos
                            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                            for (let i = 0; i < 3; i++) {
                                const dotX = screenX + Math.random() * platform.width;
                                const dotY = screenY + Math.random() * platform.height;
                                ctx.beginPath();
                                ctx.arc(dotX, dotY, 2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }

                    // Platform border (con la misma forma)
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.lineWidth = 2;
                    this.drawPlatformShape(ctx, screenX, screenY, platform.width, platform.height, platform.shape || 'rectangle', true);

                    // BUGFIX PART 13: Advertencia visual para plataformas que se van a romper ⚠️
                    if (platform.type === 'breakable' && platform.breaking) {
                        // Parpadeo rojo de advertencia
                        const flashSpeed = 10; // Más rápido = más urgente
                        if (Math.floor(this.time * 60) % flashSpeed < flashSpeed / 2) {
                            ctx.save();
                            ctx.globalAlpha = 0.5;
                            ctx.fillStyle = '#ff0000';
                            ctx.fillRect(screenX, screenY, platform.width, platform.height);
                            ctx.restore();
                        }
                        // Grietas visuales
                        ctx.strokeStyle = '#ff0000';
                        ctx.lineWidth = 2;
                        for (let i = 0; i < 3; i++) {
                            const x = screenX + (platform.width / 4) * (i + 0.5);
                            ctx.beginPath();
                            ctx.moveTo(x, screenY);
                            ctx.lineTo(x + (Math.random() - 0.5) * 10, screenY + platform.height);
                            ctx.stroke();
                        }
                    }

                    // Victory platform glow
                    if (platform.type === 'victory') {
                        ctx.save();
                        ctx.shadowColor = '#fbbf24';
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = platform.color;
                        ctx.fillRect(screenX, screenY, platform.width, platform.height);
                        ctx.restore();
                    }
                });
            },

            drawCoins() {
                this.coins.forEach(coin => {
                    if (coin.collected) return;

                    const screenX = coin.x - Game.camera.x;
                    const screenY = coin.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.rotate(coin.rotation);

                    // Coin glow
                    ctx.shadowColor = '#fbbf24';
                    ctx.shadowBlur = 10;

                    // Coin
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Coin center
                    ctx.fillStyle = '#f59e0b';
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.radius - 4, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();
                });
            },

            // PART 5: Draw power-ups
            drawPowerups() {
                this.powerups.forEach(powerup => {
                    if (powerup.collected) return;

                    const screenX = powerup.x - Game.camera.x;
                    const screenY = powerup.y + Math.sin(powerup.floatOffset) * 10 - Game.camera.y;

                    if (screenX < -50 || screenX > canvas.width + 50) return;

                    ctx.save();
                    ctx.translate(screenX, screenY);
                    ctx.rotate(powerup.rotation);

                    // Glow effect
                    ctx.shadowColor = powerup.type.color;
                    ctx.shadowBlur = 20;

                    // Power-up background
                    ctx.fillStyle = powerup.type.color;
                    ctx.globalAlpha = 0.8;
                    ctx.fillRect(-powerup.width/2, -powerup.height/2, powerup.width, powerup.height);

                    // Icon
                    ctx.globalAlpha = 1;
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(powerup.type.icon, 0, 0);

                    ctx.restore();
                });
            },

            // PART 5: Draw NPCs
            drawNPCs() {
                this.npcs.forEach(npc => {
                    const screenX = npc.x - Game.camera.x;
                    const screenY = npc.y + Math.sin(npc.floatOffset) * 5 - Game.camera.y;

                    if (screenX < -100 || screenX > canvas.width + 100) return;

                    ctx.save();

                    // Glow effect
                    ctx.shadowColor = npc.type.color;
                    ctx.shadowBlur = 20;

                    // Body (wise robed figure)
                    ctx.fillStyle = npc.type.color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, npc.width/2, 0, Math.PI * 2);
                    ctx.fill();

                    // Wisdom aura
                    ctx.globalAlpha = 0.3;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, npc.width/2 + 10, 0, Math.PI * 2);
                    ctx.fill();

                    // Face
                    ctx.globalAlpha = 1;
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🧙', screenX, screenY);

                    // Name label if not interacted
                    if (!npc.hasInteracted) {
                        ctx.font = '12px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.shadowColor = '#000';
                        ctx.shadowBlur = 4;
                        ctx.fillText(npc.type.name, screenX, screenY - 35);
                    }

                    ctx.restore();
                });
            },

            // PART 5: Draw player trail
            drawTrail() {
                Game.player.trail = Game.player.trail.filter(t => {
                    t.life -= 0.03;
                    if (t.life <= 0) return false;

                    const screenX = t.x - Game.camera.x;
                    const screenY = t.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = t.life * 0.5;
                    ctx.fillStyle = t.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    return true;
                });
            },

            drawEnemies() {
                this.enemies.forEach(enemy => {
                    if (enemy.isDead) return;

                    const screenX = enemy.x - Game.camera.x;
                    const screenY = enemy.y - Game.camera.y;

                    // Don't draw if off screen
                    if (screenX + enemy.width < 0 || screenX > canvas.width) return;

                    // EFECTOS VISUALES ÉPICOS! 👹
                    const pulse = Math.sin(this.time * 3) * 3; // Pulsación
                    const float = Math.sin(this.time * 2) * 5; // Flotación

                    ctx.save();

                    // Aura exterior (anillos pulsantes)
                    for (let i = 0; i < 2; i++) {
                        ctx.globalAlpha = 0.2 - i * 0.1;
                        ctx.strokeStyle = enemy.color;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        const ringSize = pulse + i * 15;
                        ctx.arc(screenX + enemy.width / 2, screenY + enemy.height / 2 + float, enemy.width / 2 + ringSize, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Glow effect INTENSO
                    ctx.shadowColor = enemy.color;
                    ctx.shadowBlur = 25 + pulse;

                    // Enemy body (shadowy form con pulsación)
                    ctx.fillStyle = enemy.color;
                    ctx.globalAlpha = 0.9;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2, screenY + enemy.height / 2 + float, enemy.width / 2 + pulse / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Partículas orbitando
                    for (let i = 0; i < 3; i++) {
                        const angle = (this.time * 2 + i * (Math.PI * 2 / 3)) % (Math.PI * 2);
                        const orbitRadius = enemy.width / 2 + 20;
                        const particleX = screenX + enemy.width / 2 + Math.cos(angle) * orbitRadius;
                        const particleY = screenY + enemy.height / 2 + float + Math.sin(angle) * orbitRadius;

                        ctx.globalAlpha = 0.8;
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.arc(particleX, particleY, 3, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Eyes (menacing) con brillo
                    ctx.globalAlpha = 1;
                    ctx.shadowBlur = 15;
                    ctx.fillStyle = '#ff0000'; // Ojos rojos brillantes
                    const eyeY = screenY + enemy.height / 2 - 5 + float;
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 5, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Pupils
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(screenX + enemy.width / 2 - 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.arc(screenX + enemy.width / 2 + 8, eyeY, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // Health bar
                    if (enemy.health < enemy.maxHealth) {
                        const barWidth = enemy.width;
                        const barHeight = 4;
                        const barX = screenX;
                        const barY = screenY - 10;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                        ctx.fillRect(barX, barY, barWidth, barHeight);

                        ctx.fillStyle = '#ef4444';
                        const healthWidth = (enemy.health / enemy.maxHealth) * barWidth;
                        ctx.fillRect(barX, barY, healthWidth, barHeight);
                    }

                    // Name label
                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 4;
                    ctx.fillText(enemy.name, screenX + enemy.width / 2, screenY - 15);
                    ctx.shadowBlur = 0;
                });
            },

            // PART 6: Draw bosses
            drawBosses() {
                this.bosses.forEach(boss => {
                    if (boss.isDefeated) return;

                    const screenX = boss.x - Game.camera.x;
                    const screenY = boss.y - Game.camera.y;

                    if (screenX + boss.width < -100 || screenX > canvas.width + 100) return;

                    // EFECTOS ÉPICOS DE BOSS! 👑💀
                    const pulse = Math.sin(this.time * 2) * 8; // Pulsación intensa
                    const float = Math.sin(this.time * 1.5) * 10; // Flotación grande
                    const breathe = Math.sin(this.time * 4) * 5; // Respiración

                    ctx.save();

                    // Anillos de poder múltiples
                    for (let i = 0; i < 4; i++) {
                        ctx.globalAlpha = 0.3 - i * 0.05;
                        ctx.strokeStyle = boss.type.color;
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        const ringSize = pulse + i * 25 + breathe;
                        ctx.arc(screenX + boss.width / 2, screenY + boss.height / 2 + float, boss.width / 2 + ringSize, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Massive glow effect ÉPICO
                    ctx.shadowColor = boss.type.color;
                    ctx.shadowBlur = 40 + pulse;

                    // Boss body con fase
                    const currentPhase = boss.type.phases[boss.currentPhase];
                    const color = currentPhase?.color || boss.type.color;

                    ctx.fillStyle = color;
                    ctx.globalAlpha = 0.95;
                    ctx.beginPath();
                    ctx.arc(screenX + boss.width / 2, screenY + boss.height / 2 + float, boss.width / 2 + breathe / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Aura INTENSA
                    ctx.globalAlpha = 0.4;
                    ctx.beginPath();
                    ctx.arc(screenX + boss.width / 2, screenY + boss.height / 2 + float, boss.width / 2 + 30 + pulse / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Partículas orbitando (más que enemigos normales)
                    for (let i = 0; i < 6; i++) {
                        const angle = (this.time * 1.5 + i * (Math.PI * 2 / 6)) % (Math.PI * 2);
                        const orbitRadius = boss.width / 2 + 40;
                        const particleX = screenX + boss.width / 2 + Math.cos(angle) * orbitRadius;
                        const particleY = screenY + boss.height / 2 + float + Math.sin(angle) * orbitRadius;

                        ctx.globalAlpha = 0.9;
                        ctx.fillStyle = boss.type.color;
                        ctx.shadowBlur = 10;
                        ctx.beginPath();
                        ctx.arc(particleX, particleY, 5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Eyes (glowing red INTENSO)
                    ctx.globalAlpha = 1;
                    ctx.fillStyle = '#ff0000';
                    const eyeY = screenY + boss.height / 2 - 10 + float;
                    ctx.shadowColor = '#ff0000';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    const eyeSize = 10 + breathe / 3;
                    ctx.arc(screenX + boss.width / 2 - 20, eyeY, eyeSize, 0, Math.PI * 2);
                    ctx.arc(screenX + boss.width / 2 + 20, eyeY, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.restore();

                    // BOSS HEALTH BAR (prominent)
                    const barWidth = 200;
                    const barHeight = 20;
                    const barX = screenX + boss.width / 2 - barWidth / 2;
                    const barY = screenY - 40;

                    // Background
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(barX, barY, barWidth, barHeight);

                    // Health
                    ctx.fillStyle = '#ef4444';
                    const healthWidth = (boss.health / boss.maxHealth) * barWidth;
                    ctx.fillRect(barX, barY, healthWidth, barHeight);

                    // Border
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(barX, barY, barWidth, barHeight);

                    // Boss name and title
                    ctx.font = 'bold 18px Arial';
                    ctx.fillStyle = '#fbbf24';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = '#000';
                    ctx.shadowBlur = 6;
                    ctx.fillText(boss.type.name, screenX + boss.width / 2, screenY - 55);

                    ctx.font = '12px Arial';
                    ctx.fillStyle = '#fff';
                    ctx.fillText(boss.type.title, screenX + boss.width / 2, screenY - 70);

                    // Health text
                    ctx.font = '14px Arial';
                    ctx.fillText(`${Math.floor(boss.health)} / ${boss.maxHealth}`, screenX + boss.width / 2, barY + 15);
                    ctx.shadowBlur = 0;

                    // Dialogue box (if active)
                    if (boss.dialogue && boss.dialogueTimer > 0) {
                        const dialogueWidth = 300;
                        const dialogueHeight = 50;
                        const dialogueX = screenX + boss.width / 2 - dialogueWidth / 2;
                        const dialogueY = screenY - 120;

                        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.fillRect(dialogueX, dialogueY, dialogueWidth, dialogueHeight);

                        ctx.strokeStyle = boss.type.color;
                        ctx.lineWidth = 2;
                        ctx.strokeRect(dialogueX, dialogueY, dialogueWidth, dialogueHeight);

                        ctx.font = '14px Arial';
                        ctx.fillStyle = '#fff';
                        ctx.textAlign = 'center';
                        ctx.fillText(boss.dialogue, screenX + boss.width / 2, dialogueY + 30);
                    }
                });
            },

            drawPlayer() {
                const p = Game.player;
                const screenX = p.x - Game.camera.x;
                const screenY = p.y - Game.camera.y;

                ctx.save();

                // PART 13: Flow State Visual Effects! 🌊✨🌟
                if (p.flowLevel > 0) {
                    const flowColors = [
                        null,
                        '#3b82f6', // Flow = azul
                        '#8b5cf6', // Euphoria = morado
                        '#ec4899'  // Transcendence = rosa
                    ];
                    const flowColor = flowColors[p.flowLevel];
                    const flowIntensity = [0, 15, 25, 40][p.flowLevel];

                    // Aura/Glow around player
                    ctx.shadowColor = flowColor;
                    ctx.shadowBlur = flowIntensity;

                    // Outer glow rings
                    for (let i = 0; i < p.flowLevel; i++) {
                        ctx.globalAlpha = 0.15 - i * 0.03;
                        ctx.strokeStyle = flowColor;
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        const pulseSize = Math.sin(this.time * 3 + i) * 8;
                        ctx.arc(screenX + p.width/2, screenY + p.height/2, 35 + pulseSize + i * 10, 0, Math.PI * 2);
                        ctx.stroke();
                    }

                    // Trail particles for high flow levels
                    if (p.flowLevel >= 2 && Math.random() < 0.3) {
                        Game.particles.push({
                            x: p.x + p.width / 2 + (Math.random() - 0.5) * p.width,
                            y: p.y + p.height / 2 + (Math.random() - 0.5) * p.height,
                            vx: (Math.random() - 0.5) * 2,
                            vy: (Math.random() - 0.5) * 2,
                            life: 0.8,
                            color: flowColor,
                            size: Math.random() * 4 + 2
                        });
                    }

                    // Transcendence: extra sparkles!
                    if (p.flowLevel === 3 && Math.random() < 0.5) {
                        const angle = Math.random() * Math.PI * 2;
                        const distance = 30 + Math.random() * 20;
                        Game.particles.push({
                            x: p.x + p.width / 2 + Math.cos(angle) * distance,
                            y: p.y + p.height / 2 + Math.sin(angle) * distance,
                            vx: (Math.random() - 0.5) * 3,
                            vy: (Math.random() - 0.5) * 3,
                            life: 1.2,
                            color: '#ffffff',
                            size: Math.random() * 5 + 2
                        });
                    }

                    ctx.globalAlpha = 1;
                }

                // Flip if facing left
                if (!p.isFacingRight) {
                    ctx.translate(screenX + p.width, screenY);
                    ctx.scale(-1, 1);
                    ctx.translate(-(screenX + p.width), -screenY);
                }

                // BUGFIX PART 13: Parpadeo cuando invulnerable (para que se vea el efecto)
                if (p.isInvulnerable && p.flowLevel !== 3) {
                    // Parpadeo cada 4 frames
                    if (Math.floor(this.time * 60) % 8 < 4) {
                        ctx.globalAlpha = 0.4;
                    }
                }

                // ANIMACIONES MEJORADAS - ¡Ya no es momia! 🎭

                // Variables de animación
                const isMoving = Math.abs(p.velocityX) > 0.1;
                const isJumping = !p.isGrounded;
                const walkCycle = this.time * 10; // Speed del ciclo de caminata

                // Bob de cabeza y cuerpo al caminar
                const headBob = isMoving ? Math.sin(walkCycle) * 2 : 0;
                const bodyLean = isMoving ? Math.sin(walkCycle * 0.5) * 1 : 0;

                // Shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.ellipse(screenX + p.width/2, screenY + p.height + 2, p.width/2, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body (con inclinación)
                ctx.fillStyle = p.color;
                ctx.fillRect(screenX + 8 + bodyLean, screenY + 20 + headBob, p.width - 16, 22);

                // Head (con bob)
                ctx.fillStyle = '#FFD1B3';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2 + bodyLean, screenY + 12 + headBob, 12, 0, Math.PI * 2);
                ctx.fill();

                // Hair
                if (Game.saveData.character === 'luna') {
                    ctx.fillStyle = '#3d2817';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2 - 6 + bodyLean, screenY + 8 + headBob, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2 + 6 + bodyLean, screenY + 8 + headBob, 10, 0, Math.PI * 2);
                    ctx.arc(screenX + p.width/2 + bodyLean, screenY + 4 + headBob, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#2d1810';
                    ctx.beginPath();
                    ctx.arc(screenX + p.width/2 + bodyLean, screenY + 4 + headBob, 12, 0, Math.PI);
                    ctx.fill();
                }

                // Eyes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(screenX + p.width/2 - 4 + bodyLean, screenY + 10 + headBob, 2, 0, Math.PI * 2);
                ctx.arc(screenX + p.width/2 + 4 + bodyLean, screenY + 10 + headBob, 2, 0, Math.PI * 2);
                ctx.fill();

                // Smile
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(screenX + p.width/2 + bodyLean, screenY + 12 + headBob, 5, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Arms ANIMADOS! (balanceo al caminar, arriba al saltar)
                ctx.fillStyle = '#FFD1B3';
                if (isJumping) {
                    // Brazos arriba cuando salta
                    ctx.fillRect(screenX + 2, screenY + 18 + headBob, 6, 12);
                    ctx.fillRect(screenX + p.width - 8, screenY + 18 + headBob, 6, 12);
                } else if (isMoving) {
                    // Brazos se balancean al caminar (opuesto a las piernas)
                    const armSwing = Math.sin(walkCycle) * 6;
                    ctx.fillRect(screenX + 2, screenY + 22 + headBob - armSwing, 6, 15);
                    ctx.fillRect(screenX + p.width - 8, screenY + 22 + headBob + armSwing, 6, 15);
                } else {
                    // Brazos normales cuando está quieto
                    ctx.fillRect(screenX + 2, screenY + 22, 6, 15);
                    ctx.fillRect(screenX + p.width - 8, screenY + 22, 6, 15);
                }

                // Legs ANIMADAS! (movimiento más pronunciado)
                ctx.fillStyle = p.color;
                if (isJumping) {
                    // Piernas juntas al saltar
                    ctx.fillRect(screenX + 10, screenY + 42 + headBob, 6, 16);
                    ctx.fillRect(screenX + p.width - 16, screenY + 42 + headBob, 6, 16);
                } else {
                    // Piernas caminando (movimiento x2 más pronunciado)
                    const legOffset = isMoving ? Math.sin(walkCycle) * 6 : 0;
                    ctx.fillRect(screenX + 10, screenY + 42 + headBob + legOffset, 6, 18);
                    ctx.fillRect(screenX + p.width - 16, screenY + 42 + headBob - legOffset, 6, 18);
                }

                // Shoes (se mueven con las piernas)
                ctx.fillStyle = '#333';
                if (isJumping) {
                    ctx.fillRect(screenX + 10, screenY + 56 + headBob, 6, 4);
                    ctx.fillRect(screenX + p.width - 16, screenY + 56 + headBob, 6, 4);
                } else {
                    const legOffset = isMoving ? Math.sin(walkCycle) * 6 : 0;
                    ctx.fillRect(screenX + 10, screenY + 58 + headBob + legOffset, 6, 4);
                    ctx.fillRect(screenX + p.width - 16, screenY + 58 + headBob - legOffset, 6, 4);
                }

                ctx.restore();
            },

            // BARRA DE VIDA GRANDE Y VISIBLE! 💙
            drawPlayerHealthBar() {
                const p = Game.player;
                const maxHealth = Game.saveData.stats.maxHealth;

                // Posición fija en la pantalla (esquina superior izquierda)
                const barX = 20;
                const barY = 20;
                const barWidth = 300;
                const barHeight = 30;

                // Fondo negro semi-transparente
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(barX - 5, barY - 5, barWidth + 10, barHeight + 10);

                // Borde dorado
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 3;
                ctx.strokeRect(barX - 5, barY - 5, barWidth + 10, barHeight + 10);

                // Barra de fondo (gris)
                ctx.fillStyle = '#333';
                ctx.fillRect(barX, barY, barWidth, barHeight);

                // Barra de vida (color según salud)
                const healthPercent = p.health / maxHealth;
                const currentWidth = barWidth * healthPercent;

                // Color según porcentaje de vida
                let healthColor;
                if (healthPercent > 0.6) {
                    healthColor = '#10b981'; // Verde
                } else if (healthPercent > 0.3) {
                    healthColor = '#f59e0b'; // Naranja
                } else {
                    healthColor = '#ef4444'; // Rojo
                }

                // Gradiente para la barra de vida
                const healthGradient = ctx.createLinearGradient(barX, barY, barX, barY + barHeight);
                healthGradient.addColorStop(0, healthColor);
                healthGradient.addColorStop(1, healthColor + '88'); // Más transparente abajo

                ctx.fillStyle = healthGradient;
                ctx.fillRect(barX, barY, currentWidth, barHeight);

                // Efecto de brillo si está en Transcendence
                if (p.flowLevel === 3) {
                    ctx.save();
                    ctx.globalAlpha = 0.5 + Math.sin(this.time * 5) * 0.3;
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(barX, barY, currentWidth, barHeight);
                    ctx.restore();
                }

                // Texto de vida (grande y claro)
                ctx.font = 'bold 20px Arial';
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.shadowColor = '#000';
                ctx.shadowBlur = 4;
                ctx.fillText(`${Math.floor(p.health)} / ${maxHealth}`, barX + barWidth / 2, barY + barHeight / 2 + 7);
                ctx.shadowBlur = 0;

                // Icono de corazón
                ctx.font = '24px Arial';
                ctx.fillText('❤️', barX - 15, barY + barHeight / 2 + 7);

                // Lives counter
                ctx.fillStyle = 'white';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`❤️ Lives: ${Game.player.lives}`, barX, barY + barHeight + 30);
                ctx.shadowBlur = 0;
            },

            // PART 7: Draw spell projectiles and effects
            drawSpells() {
                Game.spells.forEach(spell => {
                    if (spell.type === 'lightbolt') {
                        const screenX = spell.x - Game.camera.x;
                        const screenY = spell.y - Game.camera.y;

                        ctx.save();

                        // Draw trail
                        if (spell.trail.length > 0) {
                            ctx.strokeStyle = spell.color;
                            ctx.lineWidth = spell.radius * 2;
                            ctx.lineCap = 'round';
                            ctx.globalAlpha = 0.4;

                            ctx.beginPath();
                            spell.trail.forEach((point, i) => {
                                const trailX = point.x - Game.camera.x;
                                const trailY = point.y - Game.camera.y;
                                const alpha = (i / spell.trail.length) * 0.5;
                                ctx.globalAlpha = alpha * (point.life / 0.3);

                                if (i === 0) {
                                    ctx.moveTo(trailX, trailY);
                                } else {
                                    ctx.lineTo(trailX, trailY);
                                }
                            });
                            ctx.stroke();
                        }

                        // Draw main projectile with epic glow
                        ctx.globalAlpha = 1;
                        ctx.shadowColor = spell.glowColor;
                        ctx.shadowBlur = 25;

                        // Outer glow
                        ctx.fillStyle = spell.glowColor;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius * 1.5, 0, Math.PI * 2);
                        ctx.fill();

                        // Inner bright core
                        ctx.shadowBlur = 15;
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius * 0.7, 0, Math.PI * 2);
                        ctx.fill();

                        // Middle layer
                        ctx.shadowBlur = 20;
                        ctx.fillStyle = spell.color;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.restore();

                    } else if (spell.type === 'nova') {
                        const screenX = spell.x - Game.camera.x;
                        const screenY = spell.y - Game.camera.y;

                        ctx.save();

                        // Expanding ring effect
                        const progress = spell.radius / spell.maxRadius;
                        ctx.globalAlpha = 1 - progress;

                        // Outer ring
                        ctx.shadowColor = spell.glowColor;
                        ctx.shadowBlur = 30;
                        ctx.strokeStyle = spell.glowColor;
                        ctx.lineWidth = 8;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius, 0, Math.PI * 2);
                        ctx.stroke();

                        // Middle ring
                        ctx.strokeStyle = spell.color;
                        ctx.lineWidth = 5;
                        ctx.shadowBlur = 20;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius - 5, 0, Math.PI * 2);
                        ctx.stroke();

                        // Inner bright ring
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 15;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius - 10, 0, Math.PI * 2);
                        ctx.stroke();

                        // Filled circle with gradient
                        ctx.globalAlpha = (1 - progress) * 0.3;
                        const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, spell.radius);
                        gradient.addColorStop(0, spell.color);
                        gradient.addColorStop(1, 'transparent');
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, spell.radius, 0, Math.PI * 2);
                        ctx.fill();

                        // Rotating energy lines
                        ctx.globalAlpha = 1 - progress;
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 2;
                        const time = Date.now() * 0.01;
                        for (let i = 0; i < 8; i++) {
                            const angle = (Math.PI * 2 * i) / 8 + time;
                            const x1 = screenX + Math.cos(angle) * spell.radius * 0.5;
                            const y1 = screenY + Math.sin(angle) * spell.radius * 0.5;
                            const x2 = screenX + Math.cos(angle) * spell.radius;
                            const y2 = screenY + Math.sin(angle) * spell.radius;

                            ctx.beginPath();
                            ctx.moveTo(x1, y1);
                            ctx.lineTo(x2, y2);
                            ctx.stroke();
                        }

                        ctx.restore();
                    }
                });
            },

            // PART 7: Draw spell particle effects
            drawSpellParticles() {
                Game.spellParticles.forEach(particle => {
                    const screenX = particle.x - Game.camera.x;
                    const screenY = particle.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = particle.life;
                    ctx.shadowColor = particle.color;
                    ctx.shadowBlur = 10;
                    ctx.fillStyle = particle.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, particle.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            },

            // PART 8: Draw atmospheric particles
            drawAtmosphericParticles() {
                Game.atmosphericParticles.forEach(particle => {
                    const screenX = particle.x - Game.camera.x;
                    const screenY = particle.y - Game.camera.y;

                    // Only draw if on screen
                    if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) return;

                    ctx.save();
                    ctx.globalAlpha = particle.opacity * Game.worldProgress;
                    ctx.shadowColor = particle.color;
                    ctx.shadowBlur = particle.type === 'light' ? 8 : 3;
                    ctx.fillStyle = particle.color;

                    if (particle.type === 'petal') {
                        // Draw petal shape
                        ctx.beginPath();
                        ctx.ellipse(screenX, screenY, particle.size, particle.size * 1.5, Math.PI / 4, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, particle.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                });
            },

            // PART 8: Draw emotion orbs
            drawEmotionOrbs() {
                Game.emotionOrbs.forEach(orb => {
                    if (orb.collected) return;

                    const screenX = orb.x - Game.camera.x;
                    const screenY = orb.y + Math.sin(orb.floatOffset) * 10 - Game.camera.y;

                    ctx.save();

                    // Pulsing glow effect
                    const pulseScale = 1 + Math.sin(orb.pulseTime) * 0.2;
                    ctx.shadowColor = orb.type.color;
                    ctx.shadowBlur = 20 * pulseScale;

                    // Outer glow
                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = orb.type.color;
                    ctx.beginPath();
                    ctx.arc(screenX + orb.width / 2, screenY + orb.height / 2, orb.width * 0.7 * pulseScale, 0, Math.PI * 2);
                    ctx.fill();

                    // Main orb body
                    ctx.globalAlpha = 0.9;
                    const gradient = ctx.createRadialGradient(
                        screenX + orb.width / 2, screenY + orb.height / 2, 0,
                        screenX + orb.width / 2, screenY + orb.height / 2, orb.width / 2
                    );
                    gradient.addColorStop(0, '#ffffff');
                    gradient.addColorStop(0.5, orb.type.color);
                    gradient.addColorStop(1, orb.type.color);
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(screenX + orb.width / 2, screenY + orb.height / 2, orb.width / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Icon
                    ctx.globalAlpha = 1;
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText(orb.type.icon, screenX + orb.width / 2, screenY + orb.height / 2 + 7);

                    ctx.restore();
                });
            },

            // PART 8: Draw memory fragments
            drawMemoryFragments() {
                Game.memoryFragments.forEach(fragment => {
                    if (fragment.collected) return;

                    const screenX = fragment.x - Game.camera.x;
                    const screenY = fragment.y - Game.camera.y;

                    ctx.save();
                    ctx.translate(screenX + fragment.width / 2, screenY + fragment.height / 2);
                    ctx.rotate(fragment.rotation);

                    // Epic glow
                    ctx.shadowColor = '#a855f7';
                    ctx.shadowBlur = 25 * fragment.glowIntensity;

                    // Rotating diamond shape
                    ctx.globalAlpha = 0.9;
                    ctx.fillStyle = '#a855f7';
                    ctx.beginPath();
                    ctx.moveTo(0, -fragment.height / 2);
                    ctx.lineTo(fragment.width / 2, 0);
                    ctx.lineTo(0, fragment.height / 2);
                    ctx.lineTo(-fragment.width / 2, 0);
                    ctx.closePath();
                    ctx.fill();

                    // Inner crystal
                    ctx.fillStyle = '#ffffff';
                    ctx.globalAlpha = 0.7;
                    ctx.beginPath();
                    ctx.moveTo(0, -fragment.height / 3);
                    ctx.lineTo(fragment.width / 3, 0);
                    ctx.lineTo(0, fragment.height / 3);
                    ctx.lineTo(-fragment.width / 3, 0);
                    ctx.closePath();
                    ctx.fill();

                    // Memory symbol
                    ctx.globalAlpha = 1;
                    ctx.font = 'bold 16px Arial';
                    ctx.fillStyle = '#a855f7';
                    ctx.textAlign = 'center';
                    ctx.fillText('💭', 0, 5);

                    ctx.restore();
                });
            },

            // PART 8: Draw companion "Esperancita"
            drawCompanion() {
                const comp = Game.companion;
                if (!comp.active) return;

                const screenX = comp.x - Game.camera.x;
                const screenY = comp.y - Game.camera.y;

                ctx.save();

                // Draw companion particles
                comp.particles.forEach(p => {
                    const pX = p.x - Game.camera.x;
                    const pY = p.y - Game.camera.y;

                    ctx.globalAlpha = p.life;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 6;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(pX, pY, p.size, 0, Math.PI * 2);
                    ctx.fill();
                });

                // Draw companion based on form
                ctx.globalAlpha = 0.95;
                ctx.shadowColor = comp.glowColor;
                ctx.shadowBlur = 20;

                if (comp.form === 'spark') {
                    // Simple spark - small glowing orb
                    ctx.fillStyle = comp.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, comp.size / 2, 0, Math.PI * 2);
                    ctx.fill();

                    // Core
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, comp.size / 4, 0, Math.PI * 2);
                    ctx.fill();

                } else if (comp.form === 'wisp') {
                    // Wisp - larger with trail
                    const wobble = Math.sin(comp.animationTime * 3) * 5;

                    ctx.fillStyle = comp.color;
                    ctx.beginPath();
                    ctx.ellipse(screenX, screenY + wobble, comp.size * 0.6, comp.size * 0.8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Eyes
                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.arc(screenX - 5, screenY - 3 + wobble, 3, 0, Math.PI * 2);
                    ctx.arc(screenX + 5, screenY - 3 + wobble, 3, 0, Math.PI * 2);
                    ctx.fill();

                } else if (comp.form === 'phoenix') {
                    // Phoenix - majestic bird form
                    const flap = Math.sin(comp.animationTime * 5) * 3;

                    // Body
                    ctx.fillStyle = '#ff6b9d';
                    ctx.beginPath();
                    ctx.ellipse(screenX, screenY, comp.size * 0.7, comp.size, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Wings
                    ctx.fillStyle = '#fbbf24';
                    ctx.beginPath();
                    ctx.ellipse(screenX - comp.size * 0.8, screenY + flap, comp.size * 0.5, comp.size * 0.3, -0.5, 0, Math.PI * 2);
                    ctx.ellipse(screenX + comp.size * 0.8, screenY + flap, comp.size * 0.5, comp.size * 0.3, 0.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Flame trail
                    for (let i = 0; i < 3; i++) {
                        const offset = i * 8;
                        ctx.globalAlpha = 0.6 - i * 0.2;
                        ctx.fillStyle = i === 0 ? '#ff6b9d' : '#fbbf24';
                        ctx.beginPath();
                        ctx.arc(screenX, screenY + comp.size + offset, comp.size * 0.4 - i * 3, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Emotion indicator (small symbol above companion)
                ctx.globalAlpha = 1;
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                let emoji = '😊';
                if (comp.emotion === 'worried') emoji = '😟';
                else if (comp.emotion === 'excited') emoji = '🤩';
                else if (comp.emotion === 'calm') emoji = '😌';
                ctx.fillText(emoji, screenX, screenY - comp.size - 10);

                ctx.restore();
            },

            // PART 11: Draw weather effects 🌧️❄️⛈️
            drawWeather() {
                const weather = Game.weather;
                if (!weather || weather.current === 'clear') return;

                ctx.save();

                // Draw weather particles
                weather.particles.forEach(p => {
                    const screenX = p.x - Game.camera.x;
                    const screenY = p.y - Game.camera.y;

                    if (p.type === 'rain') {
                        ctx.strokeStyle = p.color;
                        ctx.lineWidth = 2;
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.moveTo(screenX, screenY);
                        ctx.lineTo(screenX + p.vx * 2, screenY + p.vy * 2);
                        ctx.stroke();
                    } else if (p.type === 'snow') {
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = 0.8;
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, p.size, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });

                // BUGFIX: Lightning drawing code removed

                // Draw fog overlay
                if (weather.current === 'fog') {
                    const fogGradient = ctx.createRadialGradient(
                        canvas.width / 2, canvas.height / 2, 0,
                        canvas.width / 2, canvas.height / 2, canvas.width
                    );
                    fogGradient.addColorStop(0, 'rgba(200, 200, 200, 0)');
                    fogGradient.addColorStop(0.7, `rgba(200, 200, 200, ${weather.intensity * 0.3})`);
                    fogGradient.addColorStop(1, `rgba(200, 200, 200, ${weather.intensity * 0.5})`);

                    ctx.fillStyle = fogGradient;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                // Draw aurora borealis
                if (weather.current === 'aurora') {
                    ctx.globalAlpha = weather.intensity * 0.6;

                    const auroraColors = ['#10b981', '#60a5fa', '#a855f7', '#ec4899'];
                    const time = Date.now() / 1000;

                    for (let i = 0; i < 3; i++) {
                        const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height / 2);
                        gradient.addColorStop(0, 'transparent');
                        gradient.addColorStop(0.5, auroraColors[i % auroraColors.length]);
                        gradient.addColorStop(1, 'transparent');

                        ctx.fillStyle = gradient;

                        ctx.beginPath();
                        for (let x = 0; x <= canvas.width; x += 20) {
                            const y = canvas.height * 0.2 + Math.sin((x + time * 50 + i * 100) / 50) * 30;
                            if (x === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.lineTo(canvas.width, 0);
                        ctx.lineTo(0, 0);
                        ctx.closePath();
                        ctx.fill();
                    }
                }

                ctx.restore();
            },

            // PART 8: Draw breathing exercise overlay
            drawBreathingExercise() {
                const ex = Game.breathingExercise;

                // Dark overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                ctx.save();

                // Expanding/contracting circle
                const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, ex.radius);
                gradient.addColorStop(0, '#60a5fa');
                gradient.addColorStop(0.5, '#3b82f6');
                gradient.addColorStop(1, 'rgba(59, 130, 246, 0.3)');

                ctx.fillStyle = gradient;
                ctx.shadowColor = '#60a5fa';
                ctx.shadowBlur = 30;
                ctx.beginPath();
                ctx.arc(centerX, centerY, ex.radius, 0, Math.PI * 2);
                ctx.fill();

                // Inner circle
                ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(centerX, centerY, ex.radius * 0.7, 0, Math.PI * 2);
                ctx.fill();

                // Phase text
                ctx.shadowBlur = 0;
                ctx.font = 'bold 36px Arial';
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                let phaseText = '';
                if (ex.phase === 'inhale') phaseText = 'Inhale...';
                else if (ex.phase === 'hold') phaseText = 'Mantén...';
                else if (ex.phase === 'exhale') phaseText = 'Exhale...';

                ctx.fillText(phaseText, centerX, centerY + 10);

                // Cycle counter
                ctx.font = '20px Arial';
                ctx.fillText(`Ciclo ${ex.completedCycles + 1} / 3`, centerX, centerY + 50);

                // Instructions
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.fillText('Follow the circle with your breathing', centerX, centerY - 80);

                ctx.restore();
            },

            // BUGFIX PART 11: Only draw particles (update moved to updateParticles)
            drawParticles() {
                Game.particles.forEach(p => {
                    const screenX = p.x - Game.camera.x;
                    const screenY = p.y - Game.camera.y;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, Math.min(1, p.life)); // Clamp to 0-1
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, p.size || 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            },

            drawMessage() {
                if (!this.currentMessage) return;

                const alpha = this.messageTimer > 0.5 ? 1 : this.messageTimer * 2;

                ctx.save();
                ctx.globalAlpha = alpha;

                // Message background
                const msgWidth = 400;
                const msgHeight = 60;
                const msgX = canvas.width - msgWidth - 20;
                const msgY = 100;

                ctx.fillStyle = 'rgba(102, 126, 234, 0.9)';
                ctx.shadowColor = '#667eea';
                ctx.shadowBlur = 20;
                ctx.fillRect(msgX, msgY, msgWidth, msgHeight);

                // Message text
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.font = '20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(this.currentMessage, msgX + msgWidth/2, msgY + msgHeight/2 + 7);

                ctx.restore();
            },

            victory() {
                Game.state = GameStates.VICTORY;
                saveGame();
                showNotification('🎉 Victory!', '¡You have completed your journey de esperanza!');

                // Show victory screen (will implement in next part)
                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            },

            gameOver() {
                Game.state = GameStates.GAME_OVER;
                // Notification disabled - less spam
                // showNotification('💔 Game Over', 'Don't give up, try again');

                setTimeout(() => {
                    Game.state = GameStates.MAIN_MENU;
                    MainMenuScene.init();
                }, 3000);
            }
        };

        function startGame() {
            Game.state = GameStates.PLAYING;
            GameScene.init();
        }

        // ============================================
        // INPUT HANDLING
        // ============================================

        document.addEventListener('keydown', (e) => {
            Game.keys[e.key] = true;

            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.handleInput(e.key);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.handleInput(e.key);
            } else if (Game.state === GameStates.PLAYING) {
                // Jump
                if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    GameScene.handleJump();
                }

                // Attack
                if (e.key === 'z' || e.key === 'Z') {
                    e.preventDefault();
                    GameScene.handleAttack();
                }

                // PART 12: Air Dash! 💨
                if (e.key === 'Shift') {
                    e.preventDefault();
                    GameScene.handleAirDash();
                }

                // PART 13: Ground Pound! 💥
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    GameScene.handleGroundPound();
                }

                // PART 5: Special Ability
                if (e.key === 'x' || e.key === 'X') {
                    e.preventDefault();
                    GameScene.handleSpecialAbility();
                }

                // PART 8: Breathing Exercise
                if (e.key === 'b' || e.key === 'B') {
                    e.preventDefault();
                    if (!Game.breathingExercise.active) {
                        Game.breathingExercise.active = true;
                        Game.breathingExercise.phase = 'inhale';
                        Game.breathingExercise.timer = 0;
                        Game.breathingExercise.completedCycles = 0;
                        showNotification(
                            '🧘 Breathing Exercise',
                            'Follow the circle with your breathing',
                            3000
                        );
                    }
                }

                // PART 11: Transformations (Teclas 1-4) 🔮
                if (e.key === '1') {
                    e.preventDefault();
                    GameScene.transformPlayer('shadow'); // Forma Sombra - Invisible
                }
                if (e.key === '2') {
                    e.preventDefault();
                    GameScene.transformPlayer('light'); // Forma Light - Volar
                }
                if (e.key === '3') {
                    e.preventDefault();
                    GameScene.transformPlayer('giant'); // Forma Gigante - Poder
                }
                if (e.key === '4') {
                    e.preventDefault();
                    GameScene.transformPlayer('speed'); // Forma Veloz - Speed
                }

                // Pause
                if (e.key === 'Escape') {
                    Game.state = GameStates.PAUSED;
                    showNotification('⏸️ Pausedo', 'Presiona ESC para continuar');
                }
            } else if (Game.state === GameStates.PAUSED) {
                if (e.key === 'Escape') {
                    Game.state = GameStates.PLAYING;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            Game.keys[e.key] = false;
        });

        // PART 7: Track mouse position
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            Game.mouseX = e.clientX - rect.left;
            Game.mouseY = e.clientY - rect.top;
        });

        // PART 7: Left click - Spell 1 (Light Bolt)
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.handleClick(x, y);
            } else if (Game.state === GameStates.PLAYING) {
                if (e.button === 0) { // Left click
                    e.preventDefault();
                    GameScene.castSpell1();
                } else if (e.button === 2) { // Right click
                    e.preventDefault();
                    GameScene.castSpell2();
                }
            }
        });

        // PART 7: Prevent context menu on right click
        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // ============================================
        // GAME LOOP
        // ============================================

        function gameLoop(timestamp) {
            // Calculate delta time
            if (!Game.lastFrameTime) Game.lastFrameTime = timestamp;
            Game.deltaTime = (timestamp - Game.lastFrameTime) / 1000;

            // OPTIMIZED: Cap delta time to prevent physics issues when tab is inactive
            if (Game.deltaTime > 0.1) Game.deltaTime = 0.1; // Max 100ms

            Game.lastFrameTime = timestamp;

            // Update
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.update(Game.deltaTime);
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.update(Game.deltaTime);
            }

            // Draw
            if (Game.state === GameStates.MAIN_MENU) {
                MainMenuScene.draw();
            } else if (Game.state === GameStates.CHARACTER_SELECT) {
                CharacterSelectScene.draw();
            } else if (Game.state === GameStates.PLAYING) {
                GameScene.draw();
            }

            // Continue loop
            requestAnimationFrame(gameLoop);
        }

        // ============================================
        // INITIALIZATION
        // ============================================

        function init() {
            // Simulate loading
            let progress = 0;
            const loadingInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);

                    // Hide loading screen
                    setTimeout(() => {
                        document.getElementById('loadingScreen').classList.add('hidden');

                        // Initialize main menu
                        Game.state = GameStates.MAIN_MENU;
                        MainMenuScene.init();

                        // Start game loop
                        requestAnimationFrame(gameLoop);

                        showNotification(
                            '🌟 Welcome',
                            'Your journey of hope is about to begin'
                        );
                    }, 500);
                }
                document.getElementById('loadingBar').style.width = progress + '%';
            }, 100);
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
